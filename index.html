  {s:"Depuis la rentrée, des jeux de mots sur le prénom de Jean-Paul sont repris par une grande partie de la cour. Il s'inscrit au club d'échecs « pour avoir un peu de répit ».", a:"harcelement", e:"Répétition, durée et disproportion (un élève contre un groupe). Le club d'échecs est une stratégie d'évitement, un signal faible typique."},
  {s:"Dans la file de la cantine, un élève en pousse un autre, qui tombe et se blesse au poignet. Les deux ne se connaissent pas et rien ne s'était passé avant.", a:"violence", e:"Un acte isolé, sans répétition ni ciblage : réponse éducative ou disciplinaire, prise en charge de l'élève blessé. Restez attentifs à une éventuelle suite."},
  {s:"Lucas, 4e, n'est plus invité dans les groupes de discussion de la classe ; quand il écrit, personne ne répond, et certains se moquent de lui publiquement. Cela dure depuis plusieurs semaines ; il s'absente.", a:"harcelement", e:"Cyberharcèlement : exclusion et moqueries répétées, visibles par tous, avec un effet sur la scolarité (absences)."},
  {s:"Manon est tantôt admise dans le groupe de Bérénice, tantôt rejetée, selon l'humeur de celle-ci. Cela s'accentue ; Manon se confie en larmes en disant qu'elle est « nulle ».", a:"harcelement", e:"Harcèlement relationnel : l'alternance inclusion-exclusion répétée installe un rapport de pouvoir. La cible finit par se croire responsable."},
  {s:"Deux amies se brouillent après une rumeur. Pendant une semaine, chacune dit du mal de l'autre à ses copines. Elles se réconcilient ensuite.", a:"conflit", e:"Un conflit entre égales, même s'il est vif : aucune des deux n'est dans l'incapacité de se défendre et la situation s'éteint."},
  {s:"Maxime, 6e, est bousculé et frappé discrètement par plusieurs élèves de 3e lors des changements de salle, depuis des semaines. Il n'en parle pas, de peur que ça empire ; il devient nerveux entre les cours.", a:"harcelement", e:"Répétition, durée, disproportion (âge, nombre) et furtivité des gestes. Le silence par peur des représailles est caractéristique."},
  {s:"En cours, Arthur plante son compas dans la cuisse de Martin. Il explique que Martin lui donne une tape sur la tête chaque fois que le professeur écrit au tableau, depuis plusieurs mois.", a:"harcelement", e:"Il faut traiter deux choses : la violence grave d'Arthur, qui appelle une réponse immédiate, et le harcèlement qu'il subissait depuis des mois. Jamais de médiation entre les deux."},
  {s:"Pendant un match d'EPS, après une faute, un élève insulte un camarade. Il s'excuse en fin de cours ; rien de tel ne s'était produit avant.", a:"violence", e:"Une violence verbale ponctuelle : rappel de la règle, réparation. Pas de répétition ni de ciblage à ce stade."},
  {s:"Une photo de Nora en maillot de bain, postée par sa sœur puis retirée, a été partagée. Les commentaires blessants se multiplient et, au collège, la plupart des élèves ne lui parlent plus. Elle refuse d'y retourner.", a:"harcelement", e:"Cyberharcèlement collectif qui se prolonge dans l'établissement par l'exclusion. Conserver les preuves, protéger, et faire retirer les contenus."}
];
const QLBL = {conflit:"Conflit", violence:"Violence ponctuelle", harcelement:"Harcèlement"};
function initQuiz(){
  const el = $("#quiz"); let i = 0, score = 0, answered = false;
  const draw = () => {
    if(i >= QUIZ.length){
      el.innerHTML = `<p class="q">${score} bonne${score>1?"s":""} réponse${score>1?"s":""} sur ${QUIZ.length}</p><p class="hint">Les trois critères à retenir : répétition, durée, disproportion des forces. En cas de doute, on transmet : ce n'est pas à l'adulte qui reçoit la parole de qualifier les faits.</p><div class="act"><button class="btn pri" type="button" id="qz-r">Recommencer</button></div>`;
      $("#qz-r").addEventListener("click", ()=>{ i=0; score=0; draw(); }); return;
    }
    const q = QUIZ[i]; answered = false;
    el.innerHTML = `<div class="path"><span>Situation ${i+1} sur ${QUIZ.length}</span><span>·</span><span>${score} bonne${score>1?"s":""} réponse${score>1?"s":""}</span></div><p style="max-width:65ch">${esc(q.s)}</p><div class="act">${Object.keys(QLBL).map(k=>`<button class="btn" type="button" data-k="${k}">${QLBL[k]}</button>`).join("")}</div><div id="qz-fb"></div>`;
    el.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{
      if(answered) return; answered = true;
      const ok = b.dataset.k === q.a; if(ok) score++;
      el.querySelectorAll("[data-k]").forEach(x=>{ x.disabled=true; if(x.dataset.k===q.a) x.classList.add("pri"); });
      $("#qz-fb").innerHTML = `<div class="res ${ok?"r-ok":"r-stop"}" style="margin-top:12px"><h3>${ok?"Juste":"Réponse attendue : "+QLBL[q.a]}</h3><p>${esc(q.e)}</p></div><div class="act"><button class="btn pri" type="button" id="qz-n">${i<QUIZ.length-1?"Situation suivante":"Voir le résultat"}</button></div>`;
      $("#qz-n").addEventListener("click", ()=>{ i++; draw(); });
    }));
  };
  draw();
}

// ---------- Autodiagnostic ----------
const DIAG = [
  {d:"Équipe ressource", p:["pi2","g4"], q:["Une équipe ressource d'au moins cinq personnels, de métiers différents, est constituée et connue de tous.","Ses membres sont formés à la prise en charge des situations, y compris à la MPP pour une partie d'entre eux."]},
  {d:"Protocole", p:["pi3","g2","g5"], q:["L'établissement dispose d'un protocole écrit, adapté à la législation du pays d'accueil.","Tous les personnels, y compris les nouveaux arrivants, savent à qui transmettre une situation et dans quel délai.","Chaque situation fait l'objet d'un journal écrit, de la première parole à la clôture."]},
  {d:"Élèves ambassadeurs", p:["p4","f4"], q:["Un groupe d'élèves ambassadeurs volontaires est formé (au moins dix au collège ou au lycée).","Un adulte référent les accompagne, avec des réunions régulières dans l'année."]},
  {d:"10 heures d'apprentissage", p:["p3","p2"], q:["Les 10 heures sont planifiées pour chaque niveau, dans le temps scolaire.","Une équipe sait qui assure quelles séances et avec quelles ressources."]},
  {d:"Temps forts", p:["p5"], q:["L'établissement participe au moins à un temps fort (Journée Non au harcèlement, prix, Safer Internet Day).","Les élèves, et pas seulement les adultes, sont acteurs de ces temps forts."]},
  {d:"Familles", p:["co1","g7"], q:["Le programme et le protocole sont présentés aux familles à la rentrée.","Un atelier de sensibilisation des parents est organisé dans l'année."]},
  {d:"Diagnostic et climat", p:["r3","pi5","p1"], q:["Le climat scolaire a été mesuré (enquête ELCS ou équivalent) et les résultats restitués.","Les règles sont appliquées de la même manière par tous les adultes, et l'équipe en a parlé ensemble."]}
];
function initAutodiag(){
  const el = $("#autodiag"); const ans = store("cs-diag") || {};
  const opts = [["2","Oui"],["1","En partie"],["0","Non"]];
  let n = 0;
  el.innerHTML = `<form class="form" id="dForm">${DIAG.map((g,gi)=>`<fieldset><legend>${esc(g.d)}</legend>${g.q.map((q,qi)=>{const k=gi+"-"+qi; n++; return `<div role="radiogroup" aria-label="${esc(q)}"><p style="font-size:var(--s-sm);font-weight:700">${n}. ${esc(q)}</p><div class="act" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${opts.map(o=>`<label style="font-weight:400;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer"><input type="radio" name="d${k}" id="d${k}-${o[0]}" value="${o[0]}" ${ans[k]===o[0]?"checked":""}>${o[1]}</label>`).join("")}</div></div>`}).join("")}</fieldset>`).join("")}</form>
  <h2 style="margin-top:24px">Résultat par domaine</h2><div id="dRes"></div><div class="act" style="display:flex;gap:8px;margin-top:12px"><button class="btn" type="button" id="dReset">Effacer mes réponses</button></div>`;
  const res = () => {
    let total = 0, answered = 0;
    $("#dRes").innerHTML = `<div class="tbl"><table><thead><tr><th>Domaine</th><th>Avancement</th><th>À lire</th></tr></thead><tbody>${DIAG.map((g,gi)=>{
      let sc=0, done=0; g.q.forEach((_,qi)=>{ const v=ans[gi+"-"+qi]; if(v!==undefined){ sc+=+v; done++; } });
      answered += done; total += g.q.length;
      const pct = done ? Math.round(sc/(g.q.length*2)*100) : null;
      const col = pct===null?"var(--line)":pct>=75?"var(--ok)":pct>=40?"var(--beam)":"var(--alert)";
      return `<tr><td><b>${esc(g.d)}</b></td><td style="min-width:9rem"><div style="height:8px;border-radius:4px;background:var(--ground);border:1px solid var(--line);overflow:hidden"><div style="height:100%;width:${pct||0}%;background:${col}"></div></div><span style="font-size:var(--s-xs);color:var(--muted)">${pct===null?"pas encore répondu":pct+" %"}</span></td><td>${(pct===null||pct<75)?g.p.map(p=>`<a href="#${p}">${esc(PAGES[p].t)}</a>`).join("<br>"):"<span style='color:var(--muted)'>En place</span>"}</td></tr>`;
    }).join("")}</tbody></table></div><p class="hint" style="margin-top:8px;font-size:var(--s-xs);color:var(--muted)">${answered} réponse${answered>1?"s":""} sur ${total}. Oui = 2 points, en partie = 1, non = 0.</p>`;
  };
  $("#dForm").addEventListener("change", e=>{ const k=e.target.name.slice(1); ans[k]=e.target.value; store("cs-diag", ans); res(); });
  $("#dReset").addEventListener("click", ()=>{ Object.keys(ans).forEach(k=>delete ans[k]); store("cs-diag",{}); $("#dForm").reset(); res(); });
  res();
}

// ---------- Parcours ----------
const PARCOURS = {
  decouverte:{t:"Découverte", d:"45 minutes · tous les personnels", steps:[["urgence","Lire les 5 premiers gestes"],["c1","Comprendre ce qu'est le climat scolaire"],["c2","Distinguer conflit, violence et harcèlement"],["c3","Comprendre pourquoi le harcèlement dure"],["r1","Repérer les signaux faibles"],["g2","Savoir à qui transmettre"],["c2","Faire le quiz « conflit ou harcèlement ? »"]]},
  equipe:{t:"Équipe ressource", d:"2 heures · équipe ressource et direction", steps:[["pi1","Situer pHARe dans la politique de climat"],["pi7","Faire l'autodiagnostic de l'établissement"],["pi2","Organiser l'équipe ressource"],["pi3","Compléter la trame de protocole"],["g3","Mettre en place la protection"],["g4","Utiliser l'arbre « MPP ou pas MPP ? »"],["g6","Suivre et clore une situation"],["g7","Communiquer avec les familles"],["pi6","Clarifier le rôle de chacun"]]},
  mpp:{t:"Méthode de préoccupation partagée", d:"2 heures · équipe resserrée", steps:[["g1","Construire l'alliance avec la cible"],["g4","Savoir quand ne pas utiliser la MPP"],["g5","Conduire les entretiens avec les intimidateurs"],["g6","Organiser les phases de suivi"],["f2","Pratiquer en scénettes"],["f6","Débriefer avec la grille d'observation"]]}
};
function initParcours(){
  const el = $("#parcours"); const prog = store("cs-parcours") || {};
  el.innerHTML = Object.entries(PARCOURS).map(([k,p])=>`<section class="box" style="margin-top:14px" id="pc-${k}"><h3 style="font-family:var(--f-display);font-size:1.15rem">${esc(p.t)}</h3><p style="font-size:var(--s-sm);color:var(--muted)">${esc(p.d)}</p>
  <div style="height:8px;border-radius:4px;background:var(--ground);border:1px solid var(--line);overflow:hidden;margin:12px 0 4px"><div class="pbar" style="height:100%;background:var(--accent);width:0"></div></div><p class="pcount" style="font-size:var(--s-xs);color:var(--muted)"></p>
  <ol class="check" style="margin-top:10px">${p.steps.map((st,i)=>`<li><label><input type="checkbox" data-pk="${k}-${i}" id="pc-${k}-${i}" ${prog[k+"-"+i]?"checked":""}><span><b>${i+1}. ${esc(st[1])}</b><a href="#${st[0]}" style="font-size:var(--s-sm)">${esc(pageLabel(st[0]).t)} →</a></span></label></li>`).join("")}</ol></section>`).join("");
  const upd = () => Object.entries(PARCOURS).forEach(([k,p])=>{ const d=p.steps.filter((_,i)=>prog[k+"-"+i]).length; const sec=$("#pc-"+k); sec.querySelector(".pbar").style.width=(d/p.steps.length*100)+"%"; sec.querySelector(".pcount").textContent=`${d} étape${d>1?"s":""} sur ${p.steps.length}`; });
  el.addEventListener("change", e=>{ if(e.target.dataset.pk){ prog[e.target.dataset.pk]=e.target.checked; store("cs-parcours", prog); upd(); } });
  upd();
}

const GRILLE = [
  ["Posture","L'adulte se présente et ouvre avec courtoisie, sans reproche."],
  ["Posture","Il nomme sa préoccupation pour l'élève en difficulté, sans accuser."],
  ["Posture","Il reste ferme et sobre : pas de longues discussions."],
  ["Questions","Il évite les « pourquoi as-tu fait ça ? » et toute question accusatrice."],
  ["Questions","Il ne cherche pas de preuves et ne contredit pas frontalement le déni."],
  ["Questions","Il utilise le silence pour laisser réfléchir."],
  ["Questions","Il reformule ce que dit l'élève."],
  ["Conclusion","Il demande à l'élève ce qu'il peut faire, lui, pour que ça aille mieux."],
  ["Conclusion","Il valorise une proposition concrète (« Très bien, tu vas le faire ? »)."],
  ["Conclusion","Il annonce un prochain rendez-vous rapproché."],
  ["À éviter","Jugement de valeur, menace de sanction, évocation des parents."]
];
function initGrille(){
  const el = $("#grilleMPP"); const opts=["Observé","En partie","Non"];
  el.innerHTML = `<div class="tbl"><table><thead><tr><th>Critère</th><th>Observation</th></tr></thead><tbody>${GRILLE.map((g,i)=>`<tr><td><span style="font-size:var(--s-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${g[0]}</span><br>${esc(g[1])}</td><td style="white-space:nowrap">${opts.map((o,j)=>`<label style="display:block;font-size:var(--s-sm)"><input type="radio" name="gm${i}" id="gm${i}-${j}" value="${o}"> ${i===GRILLE.length-1?["Absent","Parfois","Présent"][j]:o}</label>`).join("")}</td></tr>`).join("")}</tbody></table></div>
  <div class="form" style="margin-top:12px"><label for="gm-note">Une phrase à reformuler<textarea id="gm-note"></textarea></label></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn pri" type="button" id="gm-copy">Copier la grille</button><button class="btn" type="button" id="gm-reset">Nouvelle scénette</button></div>`;
  $("#gm-copy").addEventListener("click", ()=>{
    let t = "OBSERVATION D'UN ENTRETIEN MPP\n"; GRILLE.forEach((g,i)=>{ const v=el.querySelector(`input[name=gm${i}]:checked`); t += `- ${g[1]} : ${v?v.parentNode.textContent.trim():"non renseigné"}\n`; });
    t += "Phrase à reformuler : " + ($("#gm-note").value.trim()||"—"); copyText(t, "Grille copiée");
  });
  $("#gm-reset").addEventListener("click", ()=>{ el.querySelectorAll("input").forEach(x=>x.checked=false); $("#gm-note").value=""; });
}
function initBilan(){
  const el = $("#bilan");
  el.innerHTML = `<div class="form"><div><span style="font-weight:700;font-size:var(--s-sm)">Météo de fin de séance</span><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${["Ensoleillé","Nuageux","Pluvieux"].map((m,i)=>`<label style="font-weight:400;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px"><input type="radio" name="bm" id="bm${i}" value="${m}">${m}</label>`).join("")}</div></div>
  <label for="b-tete">La tête : ce que j'ai appris<textarea id="b-tete"></textarea></label>
  <label for="b-coeur">Le cœur : ce que j'ai ressenti ou préféré<textarea id="b-coeur"></textarea></label>
  <label for="b-main">La main : ce que je vais faire<textarea id="b-main"></textarea></label></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn pri" type="button" id="b-copy">Copier le bilan</button><button class="btn" type="button" id="b-reset">Effacer</button></div>`;
  $("#b-copy").addEventListener("click", ()=>{ const m=el.querySelector("input[name=bm]:checked"); copyText(`BILAN DE SÉANCE\nMétéo : ${m?m.value:"—"}\nTête : ${$("#b-tete").value.trim()||"—"}\nCœur : ${$("#b-coeur").value.trim()||"—"}\nMain : ${$("#b-main").value.trim()||"—"}`, "Bilan copié"); });
  $("#b-reset").addEventListener("click", ()=>{ el.querySelectorAll("textarea").forEach(t=>t.value=""); el.querySelectorAll("input").forEach(x=>x.checked=false); });
}
function copyText(t, msg){
  const fb = () => { const ta=document.createElement("textarea"); ta.value=t; ta.style.cssText="width:100%;min-height:10rem;margin-top:10px"; document.activeElement.parentNode.insertAdjacentElement("afterend", ta); ta.select(); toast("Sélectionnez le texte puis copiez-le"); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(fb); else fb();
}

  <div class="section-lbl">Outil interactif</div><div class="see"><a href="#${sp.extra[0]}">${esc(sp.extra[1])} →</a></div>

  <div class="section-lbl">Autres espaces</div><div class="see">${Object.entries(SPACES).filter(([k])=>k!==id).map(([k,v])=>`<a href="#${k}">${esc(v.t)}</a>`).join("")}</div>${footer()}</div>`;
}

// ---------- Routeur ----------
function route(){
  let id = (location.hash||"#accueil").slice(1) || "accueil";
  $("#results").hidden = true; $("#q").value = "";
  $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  if(id==="accueil") renderHome();
  else if(id==="outils") renderTools();
  else if(id==="ressources") renderRes();
  else if(SPACES[id]) renderSpace(id);
  else if(PAGES[id]) renderPage(id);
  else { id="accueil"; renderHome(); }
  markNav(id);
  document.title = (id==="accueil" ? "" : pageLabel(id).t + " · ") + "Climat scolaire & pHARe";
  window.scrollTo(0,0);
  $("#main").focus({preventScroll:true});
}

// ---------- Aperçu des ressources dans une iframe ----------
function openPdf(url,title){ $("#pdfTitle").textContent=title||"Ressource"; $("#pdfFrame").src=url; $("#pdfOpen").href=url; $("#pdfModal").hidden=false; $("#pdfClose").focus(); }
function closePdf(){ $("#pdfModal").hidden=true; $("#pdfFrame").src="about:blank"; }
document.addEventListener("click", e=>{ const b=e.target.closest(".pdf-btn"); if(b){ openPdf(b.dataset.pdf,b.dataset.title); } if(e.target===$("#pdfModal")) closePdf(); });
$("#pdfClose").addEventListener("click",closePdf);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#pdfModal").hidden) closePdf(); });

buildNav();
window.addEventListener("hashchange", route);
$("#q").addEventListener("input", e=>search(e.target.value));
$("#q").addEventListener("keydown", e=>{ if(e.key==="Escape"){ $("#results").hidden=true; e.target.blur(); } if(e.key==="Enter"){ const f=$("#results a"); if(f) location.hash=f.getAttribute("href"); } });
document.addEventListener("click", e=>{ if(!e.target.closest(".search") && !e.target.closest("#sToggle")) { $("#results").hidden=true; $("#searchWrap").classList.remove("show"); } });
$("#menuBtn").addEventListener("click", ()=>{ const o=$("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); });
$("#sToggle").addEventListener("click", ()=>{ $("#searchWrap").classList.toggle("show"); $("#q").focus(); });
$("#main").setAttribute("tabindex","-1");
route();

</script>
