<h2>Les 22 fiches</h2>
<p style="color:var(--muted);font-size:var(--s-sm)">Cliquez sur une fiche pour l'ouvrir.</p>
<div class="fiches"><details class="fiche"><summary><span class="fnum">01</span><span class="ftit">Le climat scolaire, ça se ressent (brise-glace)</span><span class="fmeta">10 min · Plénière</span></summary><div class="fbody"><p><b>Objectif.</b> Construire ensemble une définition du climat scolaire à partir du vécu professionnel, sans apport théorique.</p>
<ol class="fsteps">
<li><b>La météo de l'établissement (3 min).</b> « Si votre établissement était une météo en ce moment, ce serait laquelle ? Un seul mot. Pas d'explication pour l'instant. » Chacun répond à voix haute ou par geste : ☀️ ⛅ 🌫️ ⛈️ 🌬️ ❄️</li>
<li><b>Ce qui se perçoit sans être écrit (3–4 min).</b> « Quand on entre dans un établissement, avant même un cours, qu'est-ce qu'on ressent ou qu'on observe ? » Noter en vrac : bruit ou silence, regards, tensions, posture des élèves, posture des adultes, relations, circulation, façon de se parler. Puis la question pivot : « Est-ce que tout cela est écrit quelque part dans un texte officiel ? »</li>
<li><b>Vrai / faux éclair (2 min).</b> « Je vais lire 3 phrases. Répondez juste VRAI ou FAUX, sans débattre. »
<ul><li>« Le climat scolaire, c'est surtout une question de discipline. » → <b>faux</b></li><li>« Le climat scolaire influence directement les apprentissages. » → <b>vrai</b></li><li>« Le climat scolaire concerne uniquement les élèves. » → <b>faux</b></li></ul></li>
<li><b>Conclusion (1 min).</b> Poser la définition en reprenant leurs mots : « Le climat scolaire, c'est la qualité du vécu quotidien dans l'établissement : ce qui se ressent, ce qui se vit, dans les relations, les attitudes, les règles implicites, et qui concerne autant les élèves que les adultes. » Puis la phrase clé : <b>« On ne le décrète pas. On le construit collectivement, par des gestes professionnels ordinaires. »</b></li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1768818606898x423370138576604860/METEO%20DE%20L%20ETABLISSEMENT.png" target="_blank" rel="noopener">Visuel « météo de l'établissement »</a></p></div></details><details class="fiche"><summary><span class="fnum">02</span><span class="ftit">Atelier des 15 situations : analyser avant de juger</span><span class="fmeta">40 min + 15 min de restitution · Groupes</span></summary><div class="fbody"><p><b>Objectif.</b> Passer d'un cas particulier aux causes systémiques. Chaque groupe travaille sur 5 des 15 situations, avec les sept axes de questionnement ci-dessous.</p>
<div class="tbl"><table><thead><tr><th>Axe</th><th>Questions pour les groupes</th></tr></thead><tbody>
<tr><td><b>1. Comprendre (objectiver avant de juger)</b></td><td>Qu'est-ce qui pose problème factuellement ? À quel moment la situation bascule-t-elle ? Qui est directement, indirectement concerné ? Quels éléments manquent ? Qu'est-ce qui relève de la communication, de l'organisation ou de la posture ?</td></tr>
<tr><td><b>2. Ressenti et climat perçu</b></td><td>Quels ressentis chez les élèves, les enseignants, la direction, les familles ? En quoi influencent-ils le climat ? Quelles émotions risquent de s'installer si rien ne change ? Qui est le plus fragilisé, et pourquoi ?</td></tr>
<tr><td><b>3. Justice scolaire et équité</b></td><td>En quoi la situation peut-elle être perçue comme injuste ? Injustice réelle, ressentie, ou les deux ? Qu'est-ce qui donne le sentiment de favoritisme, d'arbitraire, de non-reconnaissance ? Quelles règles semblent absentes, floues ou mal partagées ?</td></tr>
<tr><td><b>4. Communication</b></td><td>À quels moments la communication est-elle défaillante ? Qui aurait dû communiquer, à qui, quand ? Qu'aurait-on pu dire autrement ? Quelle place pour l'échange et le retour ? Quels effets d'une communication tardive ou seulement descendante ?</td></tr>
<tr><td><b>5. Postures et responsabilités</b></td><td>Quelles postures posent question ? Quelles marges de manœuvre avait chacun ? Qu'est-ce qui relève d'une décision individuelle, d'un fonctionnement collectif, d'un pilotage institutionnel ? En quoi la situation interroge-t-elle notre rôle ?</td></tr>
<tr><td><b>6. Effets sur le collectif</b></td><td>Quels effets sur la cohésion de l'équipe, la confiance envers la direction, la relation entre collègues ? Quels comportements de repli ou de résistance ? En quoi cela alimente-t-il défiance ou fatigue professionnelle ?</td></tr>
<tr><td><b>7. Leviers d'amélioration</b></td><td>Qu'aurait-on pu faire en amont ? Quelles actions simples auraient déjà amélioré la situation ? Quels leviers relèvent de l'individu, du collectif, de l'organisation ? Quelles règles gagneraient à être co-construites ? À court, moyen et long terme.</td></tr>
</tbody></table></div>
<p><b>Restitution (15 min).</b> Recueillir les réflexions de chaque groupe, faire ressortir les idées clés, repérer convergences et divergences, valider la compréhension collective et préparer la suite. Enchaîner sur les constats (« pourquoi agir sur le climat scolaire et le bien-être ? ») puis la définition (apports, 2 × 15 min).</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1768821729774x761720732994092500/Atelier%20sur%20les%20probl%C3%A9matiques%20du%20climat%20scolaire.pdf" target="_blank" rel="noopener">Les 15 situations</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1731862085595x980174952961218700/Constat%20sur%20le%20climat%20scolaire%20et%20d%C3%A9finition%20du%20climat%20scolaire.pptx" target="_blank" rel="noopener">Diaporama constats et définition</a> · <a href="https://view.genially.com/5ad0bb8c10d0df38498e3b8b/interactive-content-memo-climat-scolaire" target="_blank" rel="noopener">Mémo climat scolaire (Genially)</a></p></div></details><details class="fiche"><summary><span class="fnum">03</span><span class="ftit">Quelles solutions mettre en œuvre ? Prioriser</span><span class="fmeta">15 min + 15 min de retours · Individuel puis collectif</span></summary><div class="fbody"><p><b>Objectif.</b> Passer de l'analyse à des solutions concrètes et réalisables.</p>
<ol class="fsteps">
<li>Chaque stagiaire choisit une ou deux des 15 situations.</li>
<li>Réflexion individuelle sur les actions possibles.</li>
<li>Il classe ses solutions selon leur faisabilité et leur impact.</li>
<li>Mise en commun : on confronte les idées pour enrichir les propositions.</li>
<li>Retour collectif : on range les solutions à court, moyen et long terme, puis on les compare au document de solutions.</li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://gamma.app/docs/Solutions-pour-15-situations-du-climat-scolaire-c4zwlp0dzmcpa5x" target="_blank" rel="noopener">Solutions (Gamma)</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1768823154967x156565750162059650/Solutions-pour-15-situations-du-climat-scolaire.pdf" target="_blank" rel="noopener">Solutions pour les 15 situations</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1768823244920x339026307080493760/Solutions%20propos%C3%A9es%20a%20court%20%20moyen%20et%20long%20termes.pdf" target="_blank" rel="noopener">Solutions à court, moyen et long terme</a></p></div></details><details class="fiche"><summary><span class="fnum">04</span><span class="ftit">Jeu du climat scolaire (ZAN)</span><span class="fmeta">20 min · Groupes · facultatif</span></summary><div class="fbody"><p><b>Objectif.</b> Revisiter de façon ludique les notions de climat scolaire et de bien-être avant la pause. Ce jeu se place en fin de matinée et ne se joue que si le planning le permet.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715165176623x276079133257890460/JeuxClimatScolaire_BienEtre.pdf" target="_blank" rel="noopener">Jeu climat scolaire et bien-être</a></p></div></details><details class="fiche"><summary><span class="fnum">05</span><span class="ftit">Les mots du climat scolaire (photolangage)</span><span class="fmeta">30 min · Individuel puis groupe</span></summary><div class="fbody"><p><b>Objectif.</b> Faire émerger et confronter les représentations, puis s'accorder sur des mots communs.</p>
<p><b>Matériel.</b> Un jeu de photos par table, des post-it.</p>
<ol class="fsteps">
<li><b>Phase 1.</b> Individuellement, chacun choisit deux photos qui illustrent sa perception du climat scolaire.</li>
<li><b>Phase 2.</b> Pour chaque image, trois mots qui l'évoquent, notés sur des post-it posés sur la table.</li>
<li><b>Phase 3.</b> Le groupe partage et discute des images et des mots.</li>
<li><b>Phase 4.</b> Le groupe retient trois images et cinq mots qui, selon lui, définissent le climat scolaire.</li>
<li><b>Phase 5.</b> Mise en commun et discussion collective.</li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://drive.google.com/file/d/1EJyxjD5BhfCk_n8MEZpMRjZj16M6cVQC/view" target="_blank" rel="noopener">Jeu de photolangage</a></p></div></details><details class="fiche"><summary><span class="fnum">06</span><span class="ftit">World Café express : définir le harcèlement</span><span class="fmeta">15 min (créneau de 30 min) · 4 tables · groupes de 4 à 5</span></summary><div class="fbody"><p><b>Organisation.</b> 4 tables, une feuille A3 et un feutre par table. Consigne (1 min) : « Vous allez discuter rapidement autour de questions clés sur le harcèlement. Notez mots-clés, idées courtes, exemples concrets. Pas de débat long, on va à l'essentiel. »</p>
<p><b>Temps de travail.</b> Trois rotations de 4 minutes ; à chaque signal, on change de table.</p>
<div class="tbl"><table><thead><tr><th>Table</th><th>Questions</th><th>À noter</th></tr></thead><tbody>
<tr><td><b>1. Comprendre le harcèlement</b></td><td>Qu'est-ce que le harcèlement ? Ses caractéristiques ? Qui sont les protagonistes ?</td><td>3 mots-clés, 1 exemple concret</td></tr>
<tr><td><b>2. Repérer les risques</b></td><td>Quelles conséquences ? Quels environnements propices ? Quels signaux faibles ?</td><td>3 signaux d'alerte, 1 lieu ou moment à risque</td></tr>
<tr><td><b>3. Agir dans l'établissement</b></td><td>Quelles missions pour l'équipe ressource ? Qu'est-ce que le cyberharcèlement ?</td><td>2 missions clés, 1 différence harcèlement / cyberharcèlement</td></tr>
<tr><td><b>4. Prévenir et sensibiliser</b></td><td>Quelles campagnes de sensibilisation connaissez-vous ? Qu'est-ce qui fonctionne vraiment ?</td><td>1 action efficace, 1 idée simple à tester</td></tr>
</tbody></table></div>
<p><b>Restitution express (2 min).</b> Chaque table donne une idée clé à voix haute, 20 secondes maximum.</p>
<p><b>Variante longue (40 min).</b> « Reconnaître les signes du harcèlement » avec les affiches du World Café et les murs de ressources pHARe.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715251909026x689407037093433700/affiches-world-cafa-formation-du-25-septembre-2023_gukm4bbaket.pdf" target="_blank" rel="noopener">Affiches du World Café</a> · <a href="https://digipad.app/p/464359/1672fb4b4053b" target="_blank" rel="noopener">Digipad pHARe (Marseille)</a></p></div></details><details class="fiche"><summary><span class="fnum">07</span><span class="ftit">Séquence « information sur le harcèlement » en 5 temps</span><span class="fmeta">60 min · Individuel puis plénière</span></summary><div class="fbody"><ol class="fsteps">
<li><b>Réflexion individuelle sur la notion de harcèlement (10 min).</b> Chacun écrit ce qu'il met derrière le mot avant tout apport (métacognition).</li>
<li><b>Qu'est-ce que le harcèlement ? (15 min).</b> Apport en plénière : répétition, rapport de force, isolement, rôle du groupe.</li>
<li><b>Les signaux faibles à repérer (10 min).</b> Les indicateurs à prendre en compte.</li>
<li><b>Pratiques de classe qui préviennent le harcèlement (15 min).</b> CPS, justice éducative, gestes professionnels.</li>
<li><b>Le programme des 10 heures (10 min).</b></li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767536206136x691829611944143600/Temps-1-Reflexion-individuelle-sur-la-notion-de-Harcelement.pdf" target="_blank" rel="noopener">Temps 1 : réflexion individuelle</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767535507285x731430403735033000/Comprendre-le-harcelement-scolaire.pdf" target="_blank" rel="noopener">Comprendre le harcèlement</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767523132253x186136044356101100/Prevenir-le-Harcelement-Scolaire-des-indicateurs.pdf" target="_blank" rel="noopener">Les indicateurs</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767544077417x937820674675194200/Leviers-pedagogiques-et-psychosociaux-contre-le-harcelement-scolaire-en-classe.pdf" target="_blank" rel="noopener">Leviers en classe</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767544691411x347875534526692860/Le-programme-10-heures-dapprentissage-du-plan-pHARe.pdf" target="_blank" rel="noopener">Les 10 heures</a></p></div></details><details class="fiche"><summary><span class="fnum">08</span><span class="ftit">4 situations de harcèlement : réflexion préharcèlement</span><span class="fmeta">40 min · Groupes</span></summary><div class="fbody"><p><b>Objectifs.</b> Repérer les signaux faibles dans des cas concrets, comprendre les mécanismes, réfléchir collectivement à la prévention et à l'action rapide, adopter une posture proactive.</p>
<ol class="fsteps"><li>Chaque groupe lit une situation (temps 1).</li><li>Il relève ce qui, avant les faits, aurait pu alerter.</li><li>Il confronte ses repérages aux indicateurs.</li><li>Le formateur projette les propositions de solutions pour les 4 situations.</li></ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767519261948x469752837394838500/situation%20de%20harcelement%20scolaire-TEMPS%201.pdf" target="_blank" rel="noopener">Situations (temps 1)</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767522586617x634567840244101800/Prevenir-le-harcelement-scolaire.pdf" target="_blank" rel="noopener">Prévenir le harcèlement</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767523132253x186136044356101100/Prevenir-le-Harcelement-Scolaire-des-indicateurs.pdf" target="_blank" rel="noopener">Les indicateurs</a> · <a href="https://gamma.app/docs/Analyse-de-Situations-de-Harcelement-Scolaire-h4aac237d76qi4a" target="_blank" rel="noopener">Analyse des situations (Gamma)</a></p></div></details><details class="fiche"><summary><span class="fnum">09</span><span class="ftit">Reconnaître les signaux de harcèlement en 4 temps</span><span class="fmeta">60 min · Groupes</span></summary><div class="fbody"><ol class="fsteps">
<li><b>Signaux précoces.</b> Chaque groupe choisit une situation et cherche les signaux qui auraient pu alerter : interactions et dynamiques qui ont précédé les faits.</li>
<li><b>Signaux faibles.</b> Avec les documents de repérage, il examine ce qui aurait pu être détecté en amont.</li>
<li><b>Évaluer puis proposer.</b> Le groupe évalue la gravité avec les outils d'évaluation (fiche d'évaluation d'une situation, harcèlomètre, violentomètre), puis élabore des réponses adaptées.</li>
<li><b>Présenter.</b> Chaque groupe présente ses solutions ; on discute leur pertinence, leur efficacité et leur faisabilité.</li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715164079961x409895268519526500/situation%20de%20harcelement%20scolaire.pdf" target="_blank" rel="noopener">Situations</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713735563831x673360660183364100/grille-reperage-harcelement-14750.pdf" target="_blank" rel="noopener">Grille de repérage</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713782914500x860597332111059200/DOC%203%20-Fiche-Evaluation%20d%27une%20situation.docx" target="_blank" rel="noopener">Fiche d'évaluation d'une situation</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713765357273x440097382541216200/violentometre_maj_10072019_web.pdf" target="_blank" rel="noopener">Violentomètre</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715165182905x712491831689611400/Reconnaitre%20les%20signaux%20d%20harcelement%20et%20trouver%20des%20solutions.pdf" target="_blank" rel="noopener">Pistes de solutions</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713735881192x455554797808389570/00-livret_referent_complet.pdf" target="_blank" rel="noopener">Livret du référent</a></p></div></details><details class="fiche"><summary><span class="fnum">10</span><span class="ftit">Comment agir pour améliorer le climat scolaire ?</span><span class="fmeta">45 min + 15 min d'apports · Groupes</span></summary><div class="fbody"><p><b>Objectif.</b> Relier les situations travaillées le matin aux leviers du climat scolaire : stratégie d'équipe, justice scolaire, pédagogie et coopération, prévention des violences, coéducation, partenariats, qualité de vie.</p>
<ol class="fsteps"><li>Les groupes travaillent avec le document d'atelier et le mémo.</li><li>Chaque groupe propose des actions par levier.</li><li>Le formateur présente ensuite les propositions de solutions et la deuxième partie de l'atelier.</li></ol>

<p><b>Qu'est-ce que la MPP ? (25 min).</b> Une vidéo, le diaporama, puis les deux autres vidéos (lisibles dans le site : <a href="#g8">4.8</a> ou <a href="#f9">vidéothèque</a>). Le diaporama couvre les principes, les objectifs (prévention, désescalade, responsabilisation), le cadre éthique et la posture, ce que la MPP est et n'est pas.</p>
<ol class="fsteps">
<li><b>Constituer l'équipe (travail collaboratif).</b> Quels profils peuvent l'intégrer (enseignants, CPE, AED, direction, infirmière…) ? Quels rôles et quelles complémentarités ? Comment fonctionner : coordination, confidentialité, continuité ?</li>

<li><b>Découvrir les documents de suivi.</b> Suivre toutes les étapes, tracer les entretiens et les engagements, définir des indicateurs d'évolution, rester cohérent avec le cadre institutionnel et le protocole de l'établissement.</li>
</ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767527896452x876727330018458100/entretien%20de%20la%20MPP.pdf" target="_blank" rel="noopener">Entretien de la MPP</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767528893569x609659891670402800/Charte%20de%20conduite%20de%20l%20entretien%20MPP.pdf" target="_blank" rel="noopener">Charte de conduite de l'entretien</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767524510424x605391719776828400/mise_en_oeuvre_programme_phare_mpp_-_2%20vf.pdf" target="_blank" rel="noopener">Diaporama MPP</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713787131428x974529216697074700/Quand-ne-pas-utiliser-la-methode-de-la-preoccupation-partagee.pdf" target="_blank" rel="noopener">Quand ne pas utiliser la MPP</a> · <a href="https://www.canotech.fr/a/34105/methode-de-la-preoccupation-partagee-1-prise-en-charge-dun-cas-dintimidation" target="_blank" rel="noopener">Vidéos CanoTech MPP</a></p></div></details><details class="fiche"><summary><span class="fnum">15</span><span class="ftit">MPP ou pas MPP ?</span><span class="fmeta">15 à 30 min · Groupes</span></summary><div class="fbody"><p><b>Rappel.</b> La MPP n'est pas automatique ni adaptée à toutes les situations : elle demande d'abord une analyse professionnelle. <b>Savoir ne pas l'utiliser est une compétence professionnelle.</b></p>
<p><b>Objectif.</b> Décider si une situation peut être traitée par la MPP. On ne propose pas de solutions : on analyse et on choisit la méthode.</p>
<ol class="fsteps">
<li>Pour chaque situation, une seule réponse : ✅ oui, la MPP est adaptée · ⚠️ oui, mais avec des limites · ❌ non, la MPP n'est pas adaptée.</li>
<li>Justifier en 2 à 4 phrases à partir de la gravité des faits, de la répétition, du type de violence (verbale, physique, sexuelle, numérique…) et de l'existence ou non d'un danger immédiat. Rester factuel.</li>
<li><b>Dire la limite</b>, même en cas de « oui » : à partir de quand la MPP ne suffit plus ? Par exemple : « La MPP est possible tant qu'il n'y a pas de violence physique. »</li>
<li>Question finale : dans quels types de situations la MPP ne doit-elle pas être utilisée ?</li>
</ol>
<p><b>Ce qu'on ne fait pas :</b> proposer une sanction, proposer une solution éducative, raconter une expérience personnelle, chercher à « bien faire » au lieu de raisonner.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767525736643x701593768861875500/CONSIGNES%20POUR%20LES%20STAGIAIRES%20MPP%20ou%20pas%20MPP.docx" target="_blank" rel="noopener">Consignes</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767525076168x307026599237214340/Sc%C3%A9narii%20Jeux%20de%20r%C3%B4les.docx" target="_blank" rel="noopener">Scénarios</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1767526496284x410347122021399900/correction%20MPP%20ou%20Pas%20MPP.docx" target="_blank" rel="noopener">Corrigé</a></p></div></details><details class="fiche"><summary><span class="fnum">16</span><span class="ftit">3 situations complexes à gérer avec la MPP</span><span class="fmeta">90 min · Groupes</span></summary><div class="fbody"><p><b>Préparation.</b> Distribuer le dossier MPP imprimé et la grille d'observation partagée.</p>
<ol class="fsteps"><li>Chaque groupe analyse une situation complexe : faits, acteurs, risques, MPP adaptée ou non.</li><li>Il construit la suite des entretiens et le suivi.</li><li>Il compare son analyse au corrigé.</li></ol>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713788279830x131942005019399790/Reflechir%20%C3%A0%203%20situations%20complexes.pdf" target="_blank" rel="noopener">3 situations complexes</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1713788287505x136956046117107330/3%20situations%20complexes%20version%20Corrig%C3%A9.pdf" target="_blank" rel="noopener">Corrigé</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729257888821x888870016222702600/grille%20d%27observation%20partag%C3%A9e%20La%20m%C3%A9thode%20de%20pr%C3%A9occupation%20partag%C3%A9e.docx" target="_blank" rel="noopener">Grille d'observation partagée</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729593517406x962866035753645600/ATELIER%20M%C3%A9thode%20de%20la%20pr%C3%A9occupation%20partag%C3%A9e.pdf" target="_blank" rel="noopener">Atelier MPP</a></p></div></details><details class="fiche"><summary><span class="fnum">17</span><span class="ftit">Je me forme à la MPP : micro-scénettes</span><span class="fmeta">40 à 50 min · Trios</span></summary><div class="fbody"><p><b>Pourquoi.</b> Avec de bonnes intentions, les adultes interrogent souvent comme des enquêteurs, parlent comme des juges et raisonnent comme des sanctionneurs. Ces postures figent les positions et renforcent le déni. <b>On ne cherche pas un coupable : on cherche des alliés pour faire cesser une situation.</b></p>
<div class="note"><b>Principe fondamental</b>On ne joue PAS des élèves. Les jeux de rôle servent uniquement à s'entraîner entre adultes à tenir une posture professionnelle : parler, écouter et formuler autrement, sans retomber dans les réflexes habituels.</div>
<p><b>Les principes de l'entretien.</b> Je ne mène pas d'enquête, je ne cherche pas la vérité, je n'accuse pas, je ne moralise pas, je ne menace pas. J'exprime une préoccupation, je parle de la situation de l'élève ciblé, je reste neutre et calme, je cherche de l'aide, je vise un petit engagement concret.</p>
<p><b>Trois rôles, qui tournent à chaque situation.</b></p>
<ul>
<li><b>A, l'adulte qui mène l'entretien.</b> Son but n'est ni l'aveu, ni la preuve, ni la morale, mais un petit engagement concret qui améliore la situation de l'élève en difficulté.</li>
<li><b>B, l'adulte qui joue l'élève</b>, sobrement et de façon réaliste. Il minimise (« c'est rien »), banalise (« on rigolait »), se dédouane (« c'est pas moi »), dilue (« tout le monde fait pareil »). Il ne cherche pas à piéger A.</li>
<li><b>C, l'observateur.</b> Il regarde la posture, le type de phrases, les moments où l'entretien sort de la MPP. Il analyse la méthode, pas la personne.</li>
</ul>
<p><b>Déroulé d'une scénette.</b></p>
<div class="tbl"><table><thead><tr><th>Étape</th><th>Durée</th><th>Contenu</th></tr></thead><tbody>
<tr><td>1. Comprendre la situation</td><td>5 min</td><td>Qui est l'élève en difficulté ? En quoi est-ce douloureux pour lui ? Pourquoi une approche punitive aggraverait-elle les choses ?</td></tr>
<tr><td>2. Préparer l'entretien</td><td>5 min</td><td>A prépare 2 phrases de préoccupation, 2 phrases sur l'élève ciblé, 1 question pour solliciter de l'aide, 1 phrase pour chercher un engagement.</td></tr>
<tr><td>3. Jouer</td><td>7 min</td><td>En conditions réalistes.</td></tr>
<tr><td>4. Analyser</td><td>10 min</td><td>C repère ce qui relève de la MPP, ce qui s'en éloigne, et explique pourquoi.</td></tr>
<tr><td>5. Rejouer en mieux</td><td>7 min</td><td>Même scène, posture améliorée.</td></tr>
</tbody></table></div>
<p><b>Grille de l'observateur.</b> L'adulte a évité toute accusation · évité toute enquête · parlé en termes de préoccupation · parlé de la situation de l'élève ciblé · utilisé des questions ouvertes · évité morale, leçon et menace · cherché un engagement concret · gardé une posture calme et bienveillante.</p>
<p><b>Aide-mémoire.</b> « Je suis un peu inquiet pour X… » · « J'ai l'impression que la situation devient compliquée pour lui… » · « Tu n'es pas obligé d'être d'accord, mais j'ai besoin de ton aide. » · « Qu'est-ce que tu pourrais faire pour que ça se passe mieux pour lui ? » · « À ton avis, qu'est-ce qui pourrait l'aider ? » · « Qu'est-ce que tu pourrais faire, toi, concrètement ? »</p>
<div class="tbl"><table><thead><tr><th>Situation</th><th>Enjeu</th></tr></thead><tbody>
<tr><td><b>1. « Le rigolo de la classe »</b> : depuis des semaines, un élève fait rire la classe en se moquant toujours du même camarade, jamais très violemment mais tous les jours. L'élève ciblé s'isole.</td><td>Faire prendre conscience de sa responsabilité dans un comportement banalisé.</td></tr>
<tr><td><b>2. « Le relais sur les réseaux »</b> : il n'est pas à l'origine des messages mais les partage et les commente. « Moi j'ai juste relayé. »</td><td>Travailler la responsabilité indirecte sans accuser.</td></tr>
<tr><td><b>3. « L'isolement progressif »</b> : un élève n'est plus jamais choisi dans les groupes ; certains évitent de s'asseoir à côté de lui.</td><td>Faire percevoir le poids du collectif.</td></tr>
<tr><td><b>4. « Le leader populaire »</b> : il donne le ton ; quand il se moque, les autres suivent.</td><td>Transformer un leader négatif en allié.</td></tr>
<tr><td><b>5. « C'était pour rire »</b> : l'élève reconnaît les faits mais nie l'impact.</td><td>Déplacer la discussion de l'intention vers les effets.</td></tr>
</tbody></table></div>
<p><b>Activité spéciale « L'entretien raté ».</b> Un volontaire mène un entretien accusateur, moralisateur, enquêteur. Le groupe relève toutes les erreurs, reformule les phrases en version MPP et rejoue la scène.</p>
<p><b>À retenir.</b> La MPP n'est ni une enquête, ni une médiation, ni une sanction, ni une négociation. C'est une posture professionnelle, un langage commun et une stratégie d'équipe pour protéger les élèves.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1769355572680x216965147050479200/GUIDE%20DE%20FORMATION%20MPP%20SCENETTE.pdf" target="_blank" rel="noopener">Guide de formation par scénettes</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1774946990213x595837724487292500/Grille%20d%20evaluation%20entretien%20MPP.pdf" target="_blank" rel="noopener">Grille d'évaluation de l'entretien</a></p></div></details><details class="fiche"><summary><span class="fnum">18</span><span class="ftit">Mettre au point la MPP face à des situations de harcèlement</span><span class="fmeta">40 min + 10 min de bilan · Groupes</span></summary><div class="fbody"><p><b>Objectif.</b> Adopter une approche bienveillante et pragmatique pour repérer, intervenir et résoudre les situations d'intimidation.</p>
<ol class="fsteps">
<li>Les fondements de la MPP : origines et principes.</li>
<li>Étude détaillée du protocole d'intervention (pHARe / Pikas).</li>
<li>Mises en situation sur des scénarios : harcèlement verbal, cyberintimidation, intimidation physique discrète.</li>
<li>Analyse en groupe et retours d'expérience pour une application immédiate.</li>
<li>Conclusion et synthèse des outils.</li>
</ol>
<p>L'accent porte sur la posture : neutralité, absence d'accusation, alliance avec la cible, recherche de solutions avec les élèves mis en cause, gestion du déni et désescalade.</p>

<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729592208023x646422027673939000/Modules%20de%20formation%20des%20ambassadeurs%20PHARE.pdf" target="_blank" rel="noopener">Modules de formation</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729261465407x574554073479766500/grille%20d%27analyse%20module%20de%20formation%20ambassadeur%20version%20vierge.docx" target="_blank" rel="noopener">Grille d'analyse (vierge)</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1732026800737x452592779266905100/grille%20d%27analyse%20module%20de%20formation%20ambassadeur%20compl%C3%A9t%C3%A9%20module%201%20et%202.docx" target="_blank" rel="noopener">Grille complétée (modules 1 et 2)</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729592202353x204218532980111170/Fiches%20d%20activite%20pour%20la%20formation%20Ambassadeur%20Phare.pdf" target="_blank" rel="noopener">Fiches d'activité</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1729592193620x309703271460193300/Le%20role%20des%20ambassadeurs%20PHARE.pdf" target="_blank" rel="noopener">Le rôle des ambassadeurs</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1770569788042x886575057359034100/FORMATION%20AMBASSADEUR%20PHARE%20PRIMAIRE.pdf" target="_blank" rel="noopener">Formation 1er degré</a> · <a href="https://www.canotech.fr/a/37416/des-lyceens-ambassadeurs-contre-le-harcelement" target="_blank" rel="noopener">Vidéo CanoTech</a></p></div></details><details class="fiche"><summary><span class="fnum">20</span><span class="ftit">Mettre en œuvre pHARe dans son établissement</span><span class="fmeta">90 min · Groupes, un thème chacun</span></summary><div class="fbody"><p><b>Objectif.</b> À partir des documents fournis, chaque groupe propose des actions concrètes sur un thème lié à pHARe et au bien-être des élèves.</p>
<div class="tbl"><table><thead><tr><th>Thèmes à répartir</th></tr></thead><tbody>
<tr><td>1. Safer Internet Day · 2. Formation des ambassadeurs · 3. Prix « Non au harcèlement » · 4. Mallette des parents · 5. Opération « Bienvenue en 6e » · 6. Les 10 heures d'apprentissage · 7. Le travail de l'empathie avec les élèves · 8. L'équipe de direction</td></tr>
</tbody></table></div>
<ol class="fsteps">
<li>Analyser les documents pour comprendre les enjeux et objectifs du thème.</li>
<li>Identifier les problématiques et les besoins de l'établissement.</li>
<li>Proposer des actions concrètes et réalisables.</li>
<li>Bâtir un plan d'action : étapes, ressources, personnes impliquées.</li>
<li>Préparer une présentation orale pour le groupe.</li>
</ol>
<p>Les plans produits ici alimentent directement le <a href="#f7">plan à 90 jours</a>.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715259546024x757948178018149600/kit-empathie-decembre-2023-v4.pdf" target="_blank" rel="noopener">Kit empathie vol. 1</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715259557588x326698899401235840/kit-empathie-volume-2-v2.pdf" target="_blank" rel="noopener">vol. 2</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1730452484496x718417526332154000/kit-empathie_volume-3-v2.pdf" target="_blank" rel="noopener">vol. 3</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1731861145404x182456134121459680/2015_non_harcelement_cahier_activites.pdf" target="_blank" rel="noopener">Cahier d'activités Non au harcèlement</a> · <a href="https://www.empathic.fr/" target="_blank" rel="noopener">Empathic</a></p></div></details><details class="fiche"><summary><span class="fnum">21</span><span class="ftit">Mesurer le climat : l'enquête locale (ELCS)</span><span class="fmeta">30 min · Apports</span></summary><div class="fbody"><p><b>Objectif.</b> Présenter l'ELCS comme un outil de pilotage, pas comme une note. Montrer les questionnaires par public, la passation, puis l'analyse croisée.</p>
<p><b>Vigilance.</b> Attention à la « moyennisation » : une moyenne satisfaisante peut masquer un groupe d'élèves, un lieu ou un moment en difficulté. Lire les écarts entre publics.</p>
<p class="fdocs"><b>Documents</b> <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1715844247408x534854992220230600/fiche_presentation_elcs%281%29.pdf" target="_blank" rel="noopener">Fiche de présentation ELCS</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1716292940934x184874926730034700/ELCLS.pptx" target="_blank" rel="noopener">Diaporama ELCS</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1730137459060x359176510483145660/20241011_nah_grille_elementaire.pdf" target="_blank" rel="noopener">Grille élémentaire</a> · <a href="https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1714063191869x223994182957695000/outil_autodiagnostic_climat_scolaire_ecole_premier_degre.docx" target="_blank" rel="noopener">Autodiagnostic 1er degré</a> · <a href="https://www.pedagogie.ac-nantes.fr/groupe-academique-climat-scolaire/enquetes-locales-de-climat-scolaire/" target="_blank" rel="noopener">Ressources ELCS (Nantes)</a></p></div></details><details class="fiche"><summary><span class="fnum">22</span><span class="ftit">Bilan de formation</span><span class="fmeta">15 min · Synthèse</span></summary><div class="fbody"><p>Revenir aux attentes exprimées sur les post-it du J1, présenter la suite (mise en place des AFE dans les établissements) et faire remplir l'évaluation de la formation (ATENA). Faire formuler à chacun une première action à mener dans les quinze jours (voir <a href="#f7">7.7</a>).</p></div></details></div>
<h2>Points de vigilance du formateur</h2>
<ul>
<li>Travailler sur les <b>causes</b> du harcèlement, pas seulement sur ses manifestations.</li>
<li>Parler des <b>discriminations détournées</b> (moqueries « pour rire » qui visent une origine, une apparence, un handicap…), du <b>sexisme</b>, des discours masculinistes et du respect.</li>
<li>Présenter l'ELCS comme un outil et rappeler le risque de <b>moyennisation</b>.</li>
<li>Parler du <b>bien-être des personnels</b> et de tous les acteurs, pas seulement des élèves.</li>
<li>Rappeler le <b>système de signalement des agents</b> prévu par l'établissement et le pays d'accueil.</li>
</ul>
<h2>Sommaire des fiches</h2>
<div class="tbl"><table><thead><tr><th>N°</th><th>Activité</th><th>Durée</th><th>Modalité</th></tr></thead><tbody><tr><td>1</td><td>Le climat scolaire, ça se ressent (brise-glace)</td><td>10 min</td><td>Plénière</td></tr><tr><td>2</td><td>Atelier des 15 situations : analyser avant de juger</td><td>40 min + 15 min de restitution</td><td>Groupes</td></tr><tr><td>3</td><td>Quelles solutions mettre en œuvre ? Prioriser</td><td>15 min + 15 min de retours</td><td>Individuel puis collectif</td></tr><tr><td>4</td><td>Jeu du climat scolaire (ZAN)</td><td>20 min</td><td>Groupes · facultatif</td></tr><tr><td>5</td><td>Les mots du climat scolaire (photolangage)</td><td>30 min</td><td>Individuel puis groupe</td></tr><tr><td>6</td><td>World Café express : définir le harcèlement</td><td>15 min (créneau de 30 min)</td><td>4 tables · groupes de 4 à 5</td></tr><tr><td>7</td><td>Séquence « information sur le harcèlement » en 5 temps</td><td>60 min</td><td>Individuel puis plénière</td></tr><tr><td>8</td><td>4 situations de harcèlement : réflexion préharcèlement</td><td>40 min</td><td>Groupes</td></tr><tr><td>9</td><td>Reconnaître les signaux de harcèlement en 4 temps</td><td>60 min</td><td>Groupes</td></tr><tr><td>10</td><td>Comment agir pour améliorer le climat scolaire ?</td><td>45 min + 15 min d'apports</td><td>Groupes</td></tr><tr><td>11</td><td>Échanges de pratiques</td><td>20 min (J1) + 10 min (J2)</td><td>Collaboration</td></tr><tr><td>12</td><td>Présenter pHARe en 5 temps</td><td>40 min</td><td>Plénière</td></tr><tr><td>13</td><td>Bilan de journée : 4 post-it</td><td>15 min</td><td>Individuel, anonyme</td></tr><tr><td>14</td><td>L'équipe ressource et la MPP : constituer son équipe</td><td>10 min + 25 min</td><td>Apports puis travail collaboratif</td></tr><tr><td>15</td><td>MPP ou pas MPP ?</td><td>15 à 30 min</td><td>Groupes</td></tr><tr><td>16</td><td>3 situations complexes à gérer avec la MPP</td><td>90 min</td><td>Groupes</td></tr><tr><td>17</td><td>Je me forme à la MPP : micro-scénettes</td><td>40 à 50 min</td><td>Trios</td></tr><tr><td>18</td><td>Mettre au point la MPP face à des situations de harcèlement</td><td>40 min + 10 min de bilan</td><td>Groupes</td></tr><tr><td>19</td><td>Je prépare ma formation d'ambassadeurs pHARe</td><td>40 min + 2 × 5 min</td><td>Groupes (3 modules)</td></tr><tr><td>20</td><td>Mettre en œuvre pHARe dans son établissement</td><td>90 min</td><td>Groupes, un thème chacun</td></tr><tr><td>21</td><td>Mesurer le climat : l'enquête locale (ELCS)</td><td>30 min</td><td>Apports</td></tr><tr><td>22</td><td>Bilan de formation</td><td>15 min</td><td>Synthèse</td></tr></tbody></table></div>

c6:{rub:"comprendre", n:"1.6", t:"Le harcèlement : définitions de référence", s:"Le harcèlement entre élèves est défini par la recherche, par le droit et par les textes de l'Éducation nationale. Les trois convergent sur trois critères : des agressions répétées, inscrites dans la durée, dans un rapport de force où la cible ne peut pas se défendre. Le droit français en fait un délit depuis 2022.", pub:["Tous","Formateurs"], src:"Code de l'éducation, art. L.111-6 ; Code pénal, art. 222-33-2-2 et 222-33-2-3 (loi du 2 mars 2022) ; D. Olweus ; C. Salmivalli ; programme pHARe",
body:`
<p>Cette page sert d'apport théorique en formation. Elle complète la page <a href="#c2">1.2</a> (reconnaître le harcèlement) et la page <a href="#c3">1.3</a> (pourquoi il dure). Le bouton « Projeter » l'affiche en grand.</p>
<h2>1. La définition de la recherche</h2>
<div class="def"><p>« Un élève est victime de harcèlement lorsqu'il est exposé de manière répétée et à long terme à des actions négatives de la part d'un ou de plusieurs autres élèves. »</p><p class="who">Dan Olweus, psychologue norvégien, à l'origine des travaux sur le harcèlement scolaire (années 1970 à 1990).</p></div>
<p>Olweus ajoute une condition décisive : un <b>déséquilibre des forces</b>. Il n'y a pas harcèlement quand deux élèves de force comparable se disputent ou se battent. Le harcèlement commence quand l'un ne peut plus se défendre, parce qu'il est seul face à un groupe, plus jeune, isolé ou atteint dans ce qu'il est.</p>
<div class="two">
<div class="box"><h3>Répétition</h3><p>Ce n'est pas un acte isolé. C'est l'accumulation de petits faits, souvent anodins pris un par un, qui détruit.</p></div>
<div class="box"><h3>Durée</h3><p>Les faits s'installent : semaines, mois, parfois années. La cible finit par croire que la situation est normale ou méritée.</p></div>
<div class="box"><h3>Asymétrie</h3><p>Un rapport de domination : la cible ne peut pas répondre. C'est ce qui distingue le harcèlement du conflit.</p></div>
</div>
<p>Les chercheurs distinguent le harcèlement <b>direct</b> (coups, insultes, menaces) et le harcèlement <b>indirect ou relationnel</b> (rumeurs, mise à l'écart, exclusion du groupe). Ce second type est le moins visible des adultes, et souvent le plus destructeur.</p>

<h2>2. Un phénomène de groupe</h2>
<p>La chercheuse finlandaise Christina Salmivalli a montré que le harcèlement n'est pas un duel entre un agresseur et une victime. C'est une situation de groupe, dans laquelle chaque élève présent joue un rôle :</p>
<div class="tbl"><table><thead><tr><th>Rôle</th><th>Ce qu'il fait</th><th>Effet sur la situation</th></tr></thead><tbody>
<tr><td><b>Le ou les initiateurs</b></td><td>Lancent les moqueries, les mises à l'écart.</td><td>Donnent le ton.</td></tr>
<tr><td><b>Les suiveurs</b></td><td>Participent, imitent, relaient.</td><td>Amplifient.</td></tr>
<tr><td><b>Les supporters</b></td><td>Rient, encouragent, regardent.</td><td>Donnent un public et une récompense.</td></tr>
<tr><td><b>Les témoins silencieux</b></td><td>Ne disent rien, s'éloignent.</td><td>Leur silence est lu comme un accord.</td></tr>
<tr><td><b>Les défenseurs</b></td><td>Soutiennent la cible, alertent un adulte.</td><td>Peuvent faire cesser la situation.</td></tr>
</tbody></table></div>
<p>C'est pourquoi pHARe forme des ambassadeurs et travaille avec les classes : <b>le groupe qui entretient le harcèlement est aussi celui qui peut l'arrêter</b>. C'est aussi pourquoi la <a href="#g8">méthode de la préoccupation partagée</a> rencontre les élèves un par un : seul, un élève sort de la dynamique du groupe.</p>
<p><b>Les mécanismes qui font durer le harcèlement</b> :</p>
<ul>
<li><b>La diffusion de la responsabilité</b> : quand tout le monde voit, chacun pense que quelqu'un d'autre agira.</li>
<li><b>Le conformisme</b> : on suit le groupe pour ne pas devenir à son tour la cible.</li>
<li><b>Le désengagement moral</b> : « c'est pour rire », « il l'a cherché », « tout le monde le fait ». Ces phrases permettent de faire du mal sans se sentir coupable.</li>
<li><b>La loi du silence</b> : la cible se tait par honte, par peur des représailles ou pour ne pas inquiéter ses parents ; les témoins se taisent pour ne pas être des « balances ».</li>
</ul>
${VID("meca")}

<h2>3. La définition du programme pHARe</h2>
<div class="def"><p>Le harcèlement est une violence répétitive, physique, verbale ou psychologique, perpétrée sur la durée par un ou plusieurs élèves à l'encontre d'un élève qui est dans l'incapacité de se défendre dans ce contexte précis.</p><p class="who">Formulation des supports pHARe et du protocole de traitement des situations.</p></div>
<p>Le cyberharcèlement est la même violence, exercée par les outils numériques : messages, publications, exclusion des groupes de discussion, diffusion de photos ou de vidéos. Il ne s'arrête ni à la sortie de l'établissement ni le soir, il touche un public potentiellement illimité, et un seul partage suffit à installer la répétition.</p>

<h2>4. Ce que dit le droit français</h2>
<p><b>Le droit à une scolarité sans harcèlement</b> est inscrit dans le Code de l'éducation depuis 2019. Depuis la loi du 2 mars 2022, l'article L.111-6 précise :</p>
<div class="def"><p>« Aucun élève ou étudiant ne doit subir de faits de harcèlement résultant de propos ou comportements, commis au sein de l'établissement d'enseignement ou en marge de la vie scolaire ou universitaire et ayant pour objet ou pour effet une dégradation de ses conditions d'apprentissage. »</p><p class="who">Code de l'éducation, article L.111-6.</p></div>
<p>Le même article demande aux établissements de prendre les mesures de prévention, de détection et de traitement, et d'informer chaque année élèves et parents des risques du harcèlement et du cyberharcèlement. La loi prévoit aussi la formation de tous les personnels.</p>
<p><b>Le délit de harcèlement scolaire</b> (Code pénal, article 222-33-2-3) reprend la définition du harcèlement moral : des propos ou comportements <b>répétés</b> qui dégradent les conditions de vie de la victime et altèrent sa santé physique ou mentale. Deux précisions comptent particulièrement pour l'école :</p>
<ul>
<li>Le délit est constitué même quand <b>chaque auteur n'a agi qu'une fois</b>, dès lors que plusieurs personnes ont visé la même victime de manière concertée ou à l'instigation de l'une d'elles. Le « like » ou le partage d'un message s'inscrit dans cette logique.</li>
<li>Il s'applique aussi lorsque les faits <b>continuent après que l'auteur ou la victime a quitté l'établissement</b>.</li>
</ul>
<div class="tbl"><table><thead><tr><th>Conséquence pour la victime</th><th>Peine maximale encourue</th></tr></thead><tbody>
<tr><td>Incapacité totale de travail (ITT) de 8 jours au plus, ou aucune ITT</td><td>3 ans d'emprisonnement et 45 000 € d'amende</td></tr>
<tr><td>ITT de plus de 8 jours</td><td>5 ans et 75 000 €</td></tr>
<tr><td>Suicide ou tentative de suicide</td><td>10 ans et 150 000 €</td></tr>
</tbody></table></div>
<p>Ces peines sont celles prévues pour les majeurs ; pour les mineurs s'appliquent les règles propres à la justice des mineurs, qui privilégient les mesures éducatives.</p>
<div class="note"><b>Dans un établissement du réseau AEFE</b>Le droit français fixe le cadre de référence éducatif du réseau. Mais hors de France, ce sont d'abord la loi pénale et les obligations de signalement du pays d'accueil qui s'appliquent aux faits. Chaque établissement précise dans son <a href="#pi3">protocole</a> ce qu'il fait, à qui il s'adresse et dans quels délais, au regard de sa législation locale.</div>

<h2>5. Ce que le harcèlement n'est pas, et les idées reçues</h2>
<div class="tbl"><table><thead><tr><th>Idée reçue</th><th>Ce qu'il faut répondre</th></tr></thead><tbody>
<tr><td>« Ça forge le caractère. »</td><td>Le harcèlement abîme durablement : anxiété, dépression, décrochage, perte d'estime de soi, qui peuvent persister à l'âge adulte.</td></tr>
<tr><td>« Ce sont des histoires d'enfants. »</td><td>C'est une violence, et la loi en fait un délit. Les adultes ont l'obligation d'agir.</td></tr>
<tr><td>« Il n'a qu'à se défendre. »</td><td>Par définition, la cible ne le peut pas. Lui demander de se défendre, c'est la rendre responsable de ce qu'elle subit.</td></tr>
<tr><td>« Il y a des élèves qui attirent les problèmes. »</td><td>N'importe quel élève peut être ciblé. Le prétexte (une différence, une réussite, un changement) est choisi par le groupe ; il n'explique rien. pHARe demande de ne jamais présenter de « profil » de victime.</td></tr>
<tr><td>« Il faut les mettre face à face pour qu'ils s'expliquent. »</td><td>Non. La médiation suppose deux élèves à égalité ; elle expose la cible à son agresseur. Elle est exclue en cas de harcèlement.</td></tr>
<tr><td>« Si c'était grave, il nous l'aurait dit. »</td><td>La plupart des cibles ne parlent pas, ou très tard. D'où l'importance des <a href="#r1">signaux faibles</a>.</td></tr>
</tbody></table></div>
<p>Le harcèlement touche aussi les <b>auteurs</b> (risque accru de conduites violentes plus tard) et les <b>témoins</b> (anxiété, sentiment d'impuissance, perte de confiance dans les adultes). C'est un problème de tout l'établissement, pas d'un élève.</p>
${VID("ecueils")}`,
tools:["t-livret-ref","t-harcelometre","t-violento","t-karpman"], links:[["Source","Qu'est-ce que le harcèlement ? Définitions et cadre légal (ministère)","https://www.education.gouv.fr/non-au-harcelement/qu-est-ce-que-le-harcelement-325361"],["Texte","Code pénal, article 222-33-2-3, sur Légifrance","https://www.legifrance.gouv.fr/search/code?query=222-33-2-3"],["Source","Portail Non au harcèlement",NAH]], see:["c2","c3","g8","r1"]},

c7:{rub:"comprendre", n:"1.7", t:"Le climat scolaire : comprendre le concept", s:"Le climat scolaire désigne la qualité et le caractère de la vie dans un établissement, tels que les vivent les élèves, les personnels et les familles. Ce n'est ni l'ambiance du moment ni le niveau de discipline : c'est un ensemble de normes, de relations et de pratiques, qui se mesure et sur lequel une équipe peut agir.", pub:["Tous","Formateurs"], src:"National School Climate Center (Cohen et al., 2009) ; travaux d'É. Debarbieux ; éduscol, climat scolaire (2026)",
body:`
<p>Cette page approfondit la page <a href="#c1">1.1</a>. Elle peut servir d'apport après le brise-glace « Le climat scolaire, ça se ressent » (<a href="#f8">fiche 1</a>).</p>
<h2>1. D'où vient la notion</h2>
<p>L'idée qu'un établissement a un « climat » propre, qui influence les apprentissages, est ancienne. La recherche s'en est saisie de façon systématique à partir des années 1970, aux États-Unis puis en Europe. En France, la notion s'est imposée au début des années 2010, notamment à partir des enquêtes de victimation et des travaux d'Éric Debarbieux sur la violence à l'école. Le ministère en a fait un axe de politique éducative, décliné aujourd'hui en sept facteurs.</p>
<h2>2. Une définition de référence</h2>
<div class="def"><p>Le climat scolaire désigne la qualité et le caractère de la vie à l'école. Il repose sur les expériences que les élèves, les parents et les personnels font de la vie scolaire, et il reflète les normes, les objectifs, les valeurs, les relations interpersonnelles, les pratiques d'enseignement et d'apprentissage, et les structures organisationnelles.</p><p class="who">National School Climate Center (Cohen, McCabe, Michelli et Pickeral, 2009), traduction.</p></div>
<p>Trois mots de cette définition sont à expliquer en formation :</p>
<ul>
<li><b>Expériences</b> : le climat est un <b>vécu</b>, subjectif et collectif. Deux adultes peuvent décrire le même établissement très différemment ; un élève isolé ne vit pas le même climat que ses camarades. C'est pour cela qu'on interroge tous les publics.</li>
<li><b>Normes et valeurs</b> : ce qui se fait et ne se fait pas, souvent sans être écrit. Une règle affichée mais jamais appliquée crée une norme : « ici, on peut ».</li>
<li><b>Structures</b> : l'emploi du temps, les espaces, la surveillance, l'organisation des récréations, la circulation de l'information. Le climat ne dépend pas que des personnes ; il dépend aussi de l'organisation.</li>
</ul>
<h2>3. Ce que le climat scolaire n'est pas</h2>
<div class="tbl"><table><thead><tr><th>Ce n'est pas…</th><th>parce que…</th></tr></thead><tbody>
<tr><td>L'ambiance du jour</td><td>Le climat est durable ; il se construit et se dégrade sur des mois.</td></tr>
<tr><td>Une question de discipline</td><td>Un établissement très « tenu » peut avoir un climat dégradé si les élèves s'y sentent injustement traités ou seuls.</td></tr>
<tr><td>L'affaire des seuls élèves</td><td>Le bien-être des personnels, la cohérence de l'équipe et la relation avec les familles en font partie.</td></tr>
<tr><td>Une moyenne</td><td>Un bon score global peut masquer un groupe, un lieu ou un moment où des élèves vont mal. Il faut lire les écarts (voir <a href="#r3">l'ELCS</a>).</td></tr>
<tr><td>Un projet à part</td><td>Il traverse toutes les pratiques ordinaires : la façon d'accueillir, de noter, de punir, de parler aux familles.</td></tr>
</tbody></table></div>
<h2>4. Pourquoi il est central</h2>
<p>La recherche internationale associe un climat scolaire positif à de meilleurs apprentissages, à moins de violence et de harcèlement, à moins d'absentéisme et de décrochage, au bien-être des élèves et à la stabilité des équipes. Le lien fonctionne dans les deux sens : la violence dégrade le climat, et un climat dégradé favorise la violence. C'est ce cercle qu'une équipe cherche à inverser.</p>
<p>Le harcèlement en est un bon exemple. Il prospère là où les adultes ne sont pas cohérents, où des lieux échappent à leur regard, où les élèves pensent que parler ne sert à rien. Prévenir le harcèlement, c'est donc d'abord agir sur le climat.</p>
<h2>5. Les sept facteurs, avec leur question clé</h2>
<div class="tbl"><table><thead><tr><th>Facteur</th><th>Question à poser à l'équipe</th></tr></thead><tbody>
<tr><td><b>Stratégie d'équipe</b></td><td>Les adultes appliquent-ils les mêmes règles et tiennent-ils le même discours ?</td></tr>
<tr><td><b>Pédagogie et coopération</b></td><td>Les élèves apprennent-ils aussi à travailler ensemble, et chacun a-t-il une place en classe ?</td></tr>
<tr><td><b>Qualité de vie</b></td><td>Les temps et les lieux (cour, cantine, couloirs, internat) sont-ils pensés et surveillés ?</td></tr>
<tr><td><b>Coéducation</b></td><td>Les familles sont-elles des partenaires, et pas seulement des destinataires d'information ?</td></tr>
<tr><td><b>Partenariats</b></td><td>L'établissement s'appuie-t-il sur des ressources extérieures (santé, associations, collectivités) ?</td></tr>
<tr><td><b>Justice scolaire</b></td><td>Les règles sont-elles claires, expliquées et appliquées avec équité ? (voir <a href="#c8">1.8</a>)</td></tr>
<tr><td><b>Prévention des violences et du harcèlement</b></td><td>Les élèves savent-ils à qui parler, et les adultes savent-ils quoi faire ?</td></tr>
</tbody></table></div>
<div class="note"><b>Pour la formation</b>Faites associer chaque situation de l'<a href="#f8">atelier des 15 situations</a> à un ou deux facteurs : les stagiaires voient ainsi qu'un même problème a plusieurs causes, et donc plusieurs leviers.</div>`,
tools:["t-memo","t-fiches-edu","t-guide-cs","t-elcs"], links:[["Source","Éduscol · Une École engagée en faveur du climat scolaire",EDU_CS],["Source","National School Climate Center","https://schoolclimate.org/"],CT("a/34104/le-bien-etre-a-lecole","Le bien-être à l'école")], see:["c1","c8","r3","p1"]},

c8:{rub:"comprendre", n:"1.8", t:"Qu'est-ce que la justice scolaire ?", s:"La justice scolaire, c'est la manière dont les règles sont posées, appliquées et vécues dans l'établissement. Ce qui compte n'est pas seulement que les décisions soient justes, mais qu'elles soient perçues comme justes : un fort sentiment d'injustice nourrit la violence, le silence et le désengagement.", pub:["Tous","Direction","Vie scolaire"], src:"Éduscol, fiche « justice scolaire » ; circulaire n° 2014-059 du 27 mai 2014 (règles, punitions et sanctions)",
body:`
<h2>1. Une définition</h2>
<div class="def"><p>La justice scolaire désigne l'ensemble des règles de vie de l'établissement, la façon dont elles sont élaborées, expliquées et appliquées, et le <b>sentiment de justice</b> qu'en retirent les élèves et les adultes.</p></div>
<p>Elle est l'un des sept facteurs du climat scolaire. La recherche montre que les élèves qui se sentent injustement traités s'investissent moins, respectent moins les règles et font moins confiance aux adultes, y compris pour signaler une violence.</p>
<h2>2. Trois dimensions du sentiment de justice</h2>
<div class="tbl"><table><thead><tr><th>Dimension</th><th>La question que se pose l'élève</th><th>Exemples en établissement</th></tr></thead><tbody>
<tr><td><b>Distributive</b></td><td>Est-ce que je reçois ce que je mérite, comme les autres ?</td><td>Notes, attention, prise de parole, punitions, responsabilités confiées.</td></tr>
<tr><td><b>Procédurale</b></td><td>La décision a-t-elle été prise de façon correcte ?</td><td>Règles connues à l'avance, écoute de sa version, explication de la décision, possibilité de la contester.</td></tr>
<tr><td><b>Relationnelle</b></td><td>Est-ce qu'on m'a traité avec respect ?</td><td>Ton, humiliation publique ou non, prise en compte de la personne derrière l'acte.</td></tr>
</tbody></table></div>
<p>Une sanction juste sur le fond peut être vécue comme injuste si elle est prononcée sans écoute ou devant la classe. À l'inverse, une décision difficile est mieux acceptée quand l'élève a été entendu et que la règle était connue.</p>
<h2>3. Punition et sanction : ne pas confondre</h2>
<div class="tbl"><table><thead><tr><th></th><th>Punition scolaire</th><th>Sanction disciplinaire</th></tr></thead><tbody>
<tr><td><b>Pour quoi</b></td><td>Manquements mineurs, perturbations de la vie de la classe ou de l'établissement.</td><td>Atteintes aux personnes et aux biens, manquements graves ou répétés.</td></tr>
<tr><td><b>Qui décide</b></td><td>Les personnels, dans le cadre du règlement intérieur.</td><td>Le chef d'établissement ou le conseil de discipline.</td></tr>
<tr><td><b>Comment</b></td><td>Mesure d'ordre intérieur, sans procédure formelle.</td><td>Procédure obligatoire, inscription au dossier de l'élève.</td></tr>
</tbody></table></div>
<h2>4. Les principes du droit disciplinaire</h2>
<p>Dans le cadre réglementaire français (circulaire du 27 mai 2014), toute sanction respecte cinq principes :</p>
<ol class="steps">
<li><b>Légalité</b> : les fautes et les sanctions possibles sont écrites dans le règlement intérieur. On ne sanctionne pas ce qui n'est pas prévu.</li>
<li><b>Contradictoire</b> : l'élève, avec ses représentants légaux, présente sa version avant toute décision. C'est une garantie pour lui comme pour l'institution.</li>
<li><b>Proportionnalité</b> : la sanction est à la mesure de la gravité du manquement et constitue une réponse éducative adaptée.</li>
<li><b>Individualisation</b> : on examine la responsabilité de chacun ; les punitions et sanctions collectives sont interdites.</li>
<li><b>Non bis in idem</b> : on ne sanctionne pas deux fois les mêmes faits.</li>
</ol>
<p>La <b>mesure de responsabilisation</b> (activités éducatives, solidaires ou de réparation, en dehors des heures de cours) donne à la sanction un sens : comprendre la portée de son acte et réparer.</p>
<div class="note"><b>Dans le réseau AEFE</b>Le régime disciplinaire dépend du statut de l'établissement et du droit du pays d'accueil. Les principes ci-dessus restent une référence de justice pour tous : règles écrites, écoute, proportion, responsabilité individuelle.</div>
<h2>5. Justice scolaire et harcèlement</h2>
<ul>
<li><b>Le sentiment d'impunité fait taire.</b> Si les élèves pensent qu'un signalement ne change rien, ils ne parlent plus. La cohérence des réponses est un levier de prévention.</li>
<li><b>La sanction seule ne protège pas.</b> Elle peut même provoquer des représailles discrètes. Quand une sanction est prononcée, la cible est d'autant plus accompagnée, et le suivi continue.</li>
<li><b>Les punitions collectives sont proscrites</b> : elles soudent le groupe contre celui qui a parlé.</li>
<li><b>Réparer n'est pas négocier.</b> Les démarches restauratives ont leur place après la cessation des faits, jamais sous la forme d'une confrontation entre la cible et l'auteur.</li>
<li><b>La MPP n'est pas une sanction</b>, et elle ne l'exclut pas : si les faits persistent, la procédure disciplinaire prend le relais (voir <a href="#g8">4.8</a>).</li>
</ul>
<h2>6. Questions pour un atelier d'équipe</h2>
<ul>
<li>Nos élèves connaissent-ils les règles ? Les ont-ils discutées ?</li>
<li>Appliquons-nous la même règle de la même façon d'un adulte à l'autre, d'une classe à l'autre ?</li>
<li>Expliquons-nous nos décisions ? Écoutons-nous la version de l'élève ?</li>
<li>Quelle place donnons-nous à la réparation ?</li>
<li>Que disent les élèves de la justice dans l'<a href="#r3">enquête de climat scolaire</a> ?</li>
</ul>`,
tools:["t-fiches-edu","t-elcs"], links:[["Texte","Circulaire n° 2014-059 du 27 mai 2014 : règles, punitions et sanctions","https://www.education.gouv.fr/bo/14/Hebdo22/MENE1406107C.htm"],["Source","Fiche éduscol « justice scolaire » (PDF)","https://7a97dba91e3888ca1da6a61fcbbca2f5.cdn.bubble.io/f1716279404372x526621716408385100/fiche_cs_justice_scolaire.pdf"]], see:["c7","c1","p1","g5"]},

g8:{rub:"gerer", n:"4.8", t:"La méthode de la préoccupation partagée expliquée", s:"La MPP ne cherche pas un coupable : elle cherche à faire cesser les brimades en rendant chaque intimidateur acteur de la solution. Ses entretiens individuels, courts et non accusateurs cassent la dynamique de groupe. Quatre vidéos de Réseau Canopé la montrent en situation, à projeter en formation.", pub:["Équipe ressource","Formateurs","Direction"], src:"Vidéos Réseau Canopé (CanoTech) ; J.-P. Bellon et B. Gardette, Centre RéSIS ; livret de formation MPP (académie de Normandie) ; programme pHARe",
body:`
<p>Cette page explique la méthode en profondeur. La conduite à tenir dans le protocole est en <a href="#g5">4.5</a> ; la décision d'y recourir, en <a href="#g4">4.4</a>.</p>
<h2>1. Découvrir la méthode en vidéo</h2>
<p>Trois épisodes courts de Réseau Canopé suivent une équipe ressource, de la prise en charge aux entretiens. À projeter dans l'ordre (12 minutes au total), puis à discuter.</p>
${VID("mpp1")}
<p><b>Questions après l'épisode 1</b> : qui intervient ? Pourquoi une équipe et pas un adulte seul ? Qu'est-ce qui surprend dans la posture ?</p>
${VID("mpp2")}
<p><b>Questions après l'épisode 2</b> : que fait l'adulte, et que s'interdit-il de faire ? Que dit-il à l'élève pour le rassurer ?</p>
${VID("mpp3")}
<p><b>Questions après l'épisode 3</b> : relevez les phrases de l'adulte. Lesquelles ouvrent le dialogue ? Comment réagit-il au déni ?</p>
${VID("mppcom")}

<h2>2. D'où vient la méthode</h2>
<p>La méthode a été conçue par le psychologue suédois <b>Anatol Pikas</b> (en anglais <i>Method of Shared Concern</i>). Elle a été adaptée en France par <b>Jean-Pierre Bellon et Bertrand Gardette</b>, avec Marie Quartier, au sein de l'Association pour la prévention des phénomènes de harcèlement entre élèves et du Centre RéSIS. Le programme pHARe l'a retenue comme méthode de traitement des situations, à mettre en œuvre par l'équipe ressource formée.</p>
<h2>3. Sur quoi elle repose</h2>
<p>La méthode part de trois constats :</p>
<ol class="steps">
<li><b>L'intimidation est d'abord un phénomène de groupe.</b> Chaque élève fait des choses qu'il ne ferait pas seul.</li>
<li><b>Les intimidateurs ne sont pas tous à l'aise dans leur rôle.</b> Beaucoup suivent pour ne pas être exclus ou ciblés à leur tour.</li>
<li><b>La plupart souhaitent en sortir</b>, à condition de ne pas perdre la face.</li>
</ol>
<p>D'où le principe : rencontrer chaque élève <b>seul</b>, pour le sortir du groupe ; ne <b>pas l'accuser</b>, pour qu'il n'ait pas à se défendre ; lui faire <b>partager une inquiétude</b> pour la cible ; et lui demander ce qu'il peut faire. L'élève qui propose une solution s'engage davantage que celui à qui on impose une règle.</p>
<div class="two">
<div class="box"><h3>Pourquoi pas l'enquête ?</h3><p>Chercher des preuves pousse au déni et à la solidarité du groupe. Les élèves se mettent d'accord sur une version, et la cible est soupçonnée d'avoir parlé.</p></div>
<div class="box"><h3>Pourquoi pas la sanction d'emblée ?</h3><p>Elle ne fait pas changer le groupe, expose la cible à des représailles et transforme les auteurs en victimes à leurs propres yeux.</p></div>
</div>

<h2>4. Le déroulé</h2>
<div class="tbl"><table><thead><tr><th>Étape</th><th>Qui</th><th>Ce qui se passe</th></tr></thead><tbody>
<tr><td><b>0. Réunion de l'équipe</b></td><td>Équipe ressource</td><td>On analyse la situation, on vérifie que la MPP est adaptée (<a href="#g4">arbre de décision</a>), on répartit les élèves à rencontrer. Un intervenant par entretien, jamais plusieurs.</td></tr>
<tr><td><b>1. Rencontre avec la cible</b></td><td>Un membre de l'équipe</td><td>Accueillir, écouter, rassurer : « tu n'es pas seul, nous allons t'aider ». Mettre en place la protection. Ne pas donner de conseils (« ignore-les », « défends-toi »). Les parents sont informés et associés.</td></tr>
<tr><td><b>2. Entretiens avec les intimidateurs présumés</b></td><td>Un intervenant par élève</td><td>Entretiens individuels, très brefs (quelques minutes). Phase 1 : faire partager la préoccupation. Phase 2 : recueillir des suggestions. Des élèves témoins ou « neutres » peuvent aussi être reçus.</td></tr>
<tr><td><b>3. Deuxième série d'entretiens</b></td><td>Les mêmes intervenants</td><td>Quelques jours plus tard : les suggestions ont-elles été appliquées ? On valorise les efforts et on maintient la demande.</td></tr>
<tr><td><b>4. Suivi de la cible</b></td><td>Le même membre</td><td>Les brimades ont-elles cessé ? Comment va-t-elle ? On la prépare à une éventuelle rechute, qui est fréquente et se traite.</td></tr>
<tr><td><b>5. Suivi et clôture</b></td><td>Équipe ressource</td><td>Rencontres espacées sur plusieurs semaines ou mois. La situation est close quand la cible confirme que tout a cessé.</td></tr>
</tbody></table></div>
<p><b>Les conditions de réussite</b> : intervenir vite après le signalement ; des entretiens courts ; un traitement auprès des intimidateurs qui n'excède pas deux semaines ; des notes prises après chaque entretien, pas pendant.</p>

<h2>5. L'entretien avec un intimidateur, phrase par phrase</h2>
<div class="tbl"><table><thead><tr><th>Phase</th><th>Ce que dit l'adulte</th><th>Ce qu'il cherche</th></tr></thead><tbody>
<tr><td>Ouverture</td><td class="quote">Je suis préoccupé au sujet de X. Qu'est-ce que tu peux m'en dire ?</td><td>Poser l'inquiétude, pas l'accusation.</td></tr>
<tr><td>Si l'élève se braque</td><td class="quote">Rassure-toi, je ne suis pas là pour te juger ou te punir. Je suis inquiet pour lui.</td><td>Faire baisser la défense.</td></tr>
<tr><td>Fin de la phase 1</td><td class="quote">Donc toi aussi, tu vois qu'il ne va pas bien.</td><td>Obtenir la reconnaissance du malaise de la cible.</td></tr>
<tr><td>Phase 2</td><td class="quote">Je me demande ce qu'on pourrait faire pour qu'il se sente mieux. Tu aurais une idée ? Et toi, qu'est-ce que tu pourrais faire ?</td><td>Obtenir une proposition concrète de l'élève.</td></tr>
<tr><td>Conclusion</td><td class="quote">Très bien. Tu vas le faire ? On se revoit dans quelques jours pour voir comment ça se passe.</td><td>Un engagement et un rendez-vous.</td></tr>
</tbody></table></div>
<p><b>Face au déni</b> (« c'est pas moi », « on rigolait », « tout le monde fait pareil ») : on ne contredit pas, on ne cherche pas de preuve. On revient à la préoccupation : « Je ne te demande pas qui a fait quoi. Je te dis que X ne va pas bien, et je te demande de m'aider. »</p>
<div class="two">
<div class="box"><h3>À faire</h3><ul><li>Courtoisie, calme, bienveillance</li><li>Sobriété : peu de mots</li><li>Fermeté : l'élève repart avec une demande</li><li>Ténacité : on revoit l'élève autant que nécessaire</li></ul></div>
<div class="box"><h3>À éviter</h3><ul><li>S'adresser au groupe</li><li>Accuser, moraliser, menacer</li><li>Mener une enquête</li><li>Être plusieurs adultes face à l'élève</li><li>Forcer l'empathie ou exiger des excuses</li></ul></div>
</div>

<h2>6. Quand la MPP ne convient pas ou s'arrête</h2>
<ul>
<li><b>Pas de MPP</b> en cas de danger pour la cible, de violences à caractère sexuel ou de diffusion d'images intimes, ou de brimades racistes, antisémites, sexistes ou homophobes. Voir <a href="#g5">4.5</a>.</li>
<li><b>Arrêt de la méthode</b> si des faits graves apparaissent, si plusieurs intimidateurs refusent de coopérer, ou si rien ne s'améliore après deux semaines. La direction reprend alors la situation et la procédure disciplinaire prévue par le règlement intérieur s'applique.</li>
<li>Savoir ne pas utiliser la MPP est une compétence professionnelle (activité « MPP ou pas MPP » en <a href="#f8">7.8</a>).</li>
</ul>
<h2>7. Ce qu'il faut retenir</h2>
<div class="note"><b>La MPP en une phrase</b>On ne cherche pas un coupable ; on cherche des alliés pour faire cesser une situation. Ce n'est ni une enquête, ni une médiation, ni une sanction, ni une négociation : c'est une posture, un langage commun et une stratégie d'équipe pour protéger les élèves.</div>`,
tools:["t-resis","t-crestani","t-scenettes","t-charte-mpp","t-quandpas","t-atelier-mpp","t-mppoupas","t-versailles"], links:[["Approfondissement","Découvrir la méthode (site de la préoccupation partagée)","https://www.preoccupationpartagee.org/decouvrir-la-methode/"],["Approfondissement","Livret de formation à la MPP (académie de Normandie)","https://prim50.ac-normandie.fr/IMG/pdf/livret_de_formation_mpp-3.pdf"],["Approfondissement","« Agir contre le harcèlement, une préoccupation partagée », conférence de J.-P. Bellon (Réseau Canopé)","https://www.reseau-canope.fr/notice/agir-contre-le-harcelement-une-preoccupation-partagee.html"]], see:["g4","g5","g6","f8","c6"]},

// ---------- Utilitaires ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rubOf = id => RUBS.find(r => r.pages.includes(id));
const ORDER = RUBS.flatMap(r => r.pages);
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function isExt(u){ return /^https?:/.test(u); }
function a(href, label){ return isExt(href) ? `<a href="${href}" target="_blank" rel="noopener">${label}</a>` : `<a href="${href}">${label}</a>`; }
function pageLabel(id){
  if(id==="urgence") return {n:"!", t:"Une situation vient de m'être signalée"};
  if(id==="outils") return {n:"⌂", t:"Boîte à outils"};
  if(id==="ressources") return {n:"§", t:"Ressources institutionnelles"};
  if(SPACES[id]) return {n:"◎", t:SPACES[id].t};
  return {n:PAGES[id].n, t:PAGES[id].t};
}

// ---------- Menu ----------
function buildNav(){
  let h = `<a class="home-link" href="#accueil">Accueil</a><a class="urg-link" href="#urgence">● Une situation vient de m'être signalée</a>`;
  RUBS.forEach(r => {
    h += `<details class="rub${r.alert?" alert":""}" data-rub="${r.id}"><summary><span class="n">${r.n}</span>${esc(r.t)}</summary><div class="pages">`;
    r.pages.forEach(id => { h += `<a href="#${id}" data-id="${id}"><span class="n">${PAGES[id].n}</span>${esc(PAGES[id].t)}</a>`; });
    h += `</div></details>`;
  });
  h += `<div class="tail"><span style="display:block;font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 10px">Mon espace</span>${Object.entries(SPACES).map(([k,v])=>`<a href="#${k}" data-id="${k}">${esc(v.t.replace("Espace ",""))}</a>`).join("")}<div style="height:10px"></div><a href="#outils" data-id="outils">Boîte à outils</a><a href="#ressources" data-id="ressources">Ressources institutionnelles</a></div>`;
  $("#side").innerHTML = h;
}
function markNav(id){
  document.querySelectorAll("#side a").forEach(x => x.classList.toggle("on", x.dataset.id===id));
  const r = rubOf(id);
  document.querySelectorAll("#side details").forEach(d => { if(r && d.dataset.rub===r.id) d.open = true; });
}

rogramme de lutte contre le harcèlement à l'école"></div><div class="who"><b>Fehmi Klabi</b>Enseignant formateur (EF2D) Technologie<br>Référent climat scolaire et programme pHARe<br>Institut régional de formation, zone Europe du Sud-Est</div></div>
  <section class="hero">
    <div>
      <h1>Agir ensemble pour <em>un climat scolaire serein</em></h1>
      <p class="lead">Repères, méthodes et outils pour comprendre, prévenir et traiter le harcèlement dans le cadre du programme pHARe.</p>
      <p class="scope">Pour les personnels des établissements du réseau AEFE, du premier et du second degré. Chaque établissement adapte ces repères à sa culture et à la législation de son pays d'accueil.</p>
    </div>
    <a class="urg-card" href="#urgence">
      <span class="k">Accès direct</span>
      <h2>Une situation vient de m'être signalée : que faire ?</h2>
      <ol><li>Écouter sans minimiser</li><li>Rassurer sans promettre</li><li>Noter les faits</li><li>Transmettre le jour même</li><li>Ne pas agir seul</li></ol>
      <span class="go">Voir les premiers gestes →</span>
    </a>
  </section>
  <h2 class="h-sec">Par où commencer ?</h2>
  <div class="doors">${doors.map(d=>`<a class="door${d[3]?" hot":""}" href="${d[0]}"><b>${d[1]}</b><span>${d[2]}</span></a>`).join("")}</div>
  <h2 class="h-sec">De la prévention au suivi</h2>
  <p class="h-sub">La prévention concerne tous les élèves, tout le temps. Le traitement commence quand une situation est signalée ou suspectée. Les deux ne se mélangent pas.</p>
  <nav class="flow" aria-label="Étapes">${flow.map((f,i)=>`<a class="${f[2]}" href="#${f[0]}"><span class="n">${String(i+1).padStart(2,"0")}</span><b>${f[1]}</b></a>`).join("")}</nav>
  <div class="flow-legend"><span><i style="background:var(--accent)"></i>Prévention générale</span><span><i style="background:var(--alert)"></i>Situation identifiée ou suspectée</span></div>
  <h2 class="h-sec">Mon espace</h2>
  <p class="h-sub">Pages, outils et parcours rassemblés pour votre rôle.</p>
  <div class="doors" style="margin-top:12px">${Object.entries(SPACES).map(([k,v])=>`<a class="door" href="#${k}"><b>${esc(v.t.replace("Espace ",""))}</b><span>${esc(v.who)}</span></a>`).join("")}<a class="door" href="#f5"><b>Parcours en autonomie</b><span>Découverte, équipe ressource, MPP</span></a><a class="door" href="#pi7"><b>Autodiagnostic</b><span>Où en est notre établissement ?</span></a><a class="door" href="#c2"><b>Quiz</b><span>Conflit ou harcèlement ?</span></a></div>
  <h2 class="h-sec">Mon métier, mes pages</h2>
  <div class="profiles" role="group" aria-label="Choisir un profil">${Object.keys(PROFILES).map((p,i)=>`<button type="button" data-p="${esc(p)}" aria-pressed="${i===0}">${esc(p)}</button>`).join("")}</div>
  <ul class="plist" id="plist"></ul>
  <h2 class="h-sec">Le climat scolaire d'abord</h2>
  <p class="h-sub" style="max-width:65ch">pHARe n'est pas un dispositif à part : c'est le volet harcèlement d'une politique globale qui agit sur la justice scolaire, la coopération, la vie scolaire, les compétences psychosociales, la qualité des relations, la coéducation et le sentiment de sécurité. Le site suit désormais cette logique du primaire au lycée.</p>
  <div class="doors" style="margin-top:14px">${RUBS.map(r=>`<a class="door${r.alert?" hot":""}" href="#${r.pages[0]}"><span style="font-family:var(--f-mono)">${r.n}</span><b>${esc(r.t)}</b><span>${r.pages.length} pages</span></a>`).join("")}<a class="door" href="#outils"><span style="font-family:var(--f-mono)">+</span><b>Boîte à outils</b><span>${Object.keys(TOOLS).length} outils</span></a></div>
  ${footer()}
  </div>`;
  $("#main").innerHTML = h;
  const showP = p => {
    document.querySelectorAll(".profiles button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.p===p));
    $("#plist").innerHTML = PROFILES[p].map(id=>{const l=pageLabel(id); return `<li><a href="#${id}"><span class="n">${l.n}</span>${esc(l.t)}</a></li>`}).join("");
    store("cs-profile", p);
  };
  document.querySelectorAll(".profiles button").forEach(b=>b.addEventListener("click",()=>showP(b.dataset.p)));
  const saved = store("cs-profile");
  showP(saved && PROFILES[saved] ? saved : Object.keys(PROFILES)[0]);

function toPreview(u){
  let m = u.match(/^https:\/\/drive\.google\.com\/file\/d\/([^/]+)/); if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = u.match(/^https:\/\/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([^/]+)/); if(m) return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`;
  return null;
}
function toolCard(id, withUse){
  const t = TOOLS[id]; if(!t) return "";

function initTree(){

INDEX.forEach(x=>x.nt=norm(x.txt+" "+x.t.toLowerCase()));
function search(q){
  const box = $("#results"); q = norm(q.trim().toLowerCase());
  if(q.length<2){ box.hidden=true; return; }
  const words = q.split(/\s+/);
  const hits = INDEX.map(x=>({x, s:words.reduce((acc,w)=>acc+(x.nt.includes(w)?1:0)+(norm(x.t.toLowerCase()).includes(w)?2:0),0)})).filter(h=>words.every(w=>h.x.nt.includes(w))).sort((a,b)=>b.s-a.s).slice(0,8);
  box.innerHTML = hits.length ? hits.map(h=>`<a href="#${h.x.id}">${esc(h.x.t)}<small>${h.x.n==="!"?"Accès urgence":h.x.n}</small></a>`).join("") : `<div style="padding:10px;font-size:var(--s-sm);color:var(--muted)">Aucun résultat. Essayez « MPP », « signaux », « parents ».</div>`;
  box.hidden=false;
}

// ---------- Quiz conflit ou harcèlement ----------
