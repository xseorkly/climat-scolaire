<div class="tbl"><table><thead><tr><th>Axe</th><th>Questions</th></tr></thead><tbody>
<tr><td>1. Faits</td><td>Que se passe-t-il, concrètement, sans interprétation ?</td></tr>
<tr><td>2. Ressentis</td><td>Que vivent les élèves, les adultes, les familles concernés ?</td></tr>
<tr><td>3. Justice</td><td>Les règles sont-elles claires et appliquées de la même manière ?</td></tr>
<tr><td>4. Communication</td><td>Qui a été informé, comment, avec quel ton, dans quel délai ?</td></tr>
<tr><td>5. Postures</td><td>Quelles postures d'adultes aggravent ou apaisent la situation ?</td></tr>
<tr><td>6. Effets sur le collectif</td><td>Quels effets sur la classe, l'équipe, la confiance envers les adultes ?</td></tr>
<tr><td>7. Leviers</td><td>Que faire à court, moyen et long terme ?</td></tr>
</tbody></table></div>
<h2>Quelques questions d'autodiagnostic pour l'équipe</h2>
<ul>
<li>Avons-nous travaillé ensemble sur le sens et l'application des règles ?</li>
<li>Avons-nous harmonisé les réponses apportées au non-respect des règles ?</li>
<li>Avons-nous un protocole clair de détection et de prise en charge du harcèlement ?</li>
<li>Faisons-nous un retour d'expérience après un incident ?</li>
<li>Comment aidons-nous un nouvel élève ou une nouvelle famille à trouver sa place ?</li>
</ul>`,
tools:["t-elcs","t-cs360","t-grille7","t-guide-cs","t-cs-eduscol","t-elcs-fiche","t-autodiag1d","t-quest-nah"], links:[["Approfondissement","Académie de Nantes : enquêtes locales de climat scolaire","https://www.pedagogie.ac-nantes.fr/groupe-academique-climat-scolaire/enquetes-locales-de-climat-scolaire/"]], see:["c1","r4","pi5","f2"]},


r4:{rub:"reperer", n:"3.4", t:"Comment passer du diagnostic à un plan d'action ?", s:"Un bon diagnostic ne produit pas une liste de problèmes : il permet de choisir deux ou trois priorités sur lesquelles l'équipe peut réellement agir, avec un responsable, un indicateur et une date de revue.", pub:["Direction","Équipe ressource","Formateurs"], src:"Guide climat scolaire ; démarche de pilotage proposée à partir du corpus",
body:`
<h2>La règle : peu de priorités, mais suivies</h2>
<ol class="steps"><li><b>Trianguler</b> : croiser données, observations et paroles des acteurs.</li><li><b>Prioriser</b> : retenir deux ou trois enjeux maximum, en distinguant urgence et importance.</li><li><b>Formuler</b> un résultat observable : « réduire les tensions aux intercours » plutôt que « améliorer le climat ».</li><li><b>Agir à plusieurs niveaux</b> : pratiques adultes, organisation, élèves, familles, espaces.</li><li><b>Revoir à 90 jours</b> : conserver, ajuster ou arrêter les actions selon les effets.</li></ol>
<h2>Construire votre plan à 90 jours</h2>
<p>Complétez les trois priorités. Les données restent dans votre navigateur.</p>
<div id="plan90"></div>
<div class="note"><b>Indicateur utile</b>Un indicateur n'est pas forcément un chiffre. Une observation répétée, une courte question aux élèves ou un retour structuré des AED peut être plus pertinent qu'un tableau complexe.</div>`,
tools:["t-plan90","t-elcs","t-cs360","t-guide-cs"], see:["r3","pi4","pi5","f7"]},

// ===== 4. GÉRER UNE SITUATION =====
g1:{rub:"gerer", n:"4.1", t:"Comment accueillir la parole d'un élève ?", s:"L'objectif n'est pas de qualifier les faits mais de créer un climat de confiance. On écoute sans interrompre, on reformule, on valide les émotions et on vérifie que l'élève n'est pas en danger. On ne donne aucun conseil à ce stade.", pub:["Tous"], src:"Protocole national 2023 ; méthode de préoccupation partagée (Centre RéSIS, Bellon et Quartier)",
body:`
<p>Les cinq gestes de base sont sur la page <a href="#urgence">Une situation vient de m'être signalée</a>. Cette page détaille la posture d'écoute, utile à tout adulte et indispensable aux membres de l'équipe ressource.</p>
<h2>Construire une relation d'alliance</h2>
<ul>
<li><b>Accueillir les émotions</b> : <span class="quote">« Tu as de bonnes raisons de ressentir cela. À ta place, je ressentirais la même chose. »</span></li>
<li><b>Valoriser</b> : <span class="quote">« Je te trouve courageux d'en parler. Tu as une bonne analyse de la situation. »</span></li>
<li><b>Reprendre ses mots</b> : écouter comment il parle (« il ne me calcule pas ») et utiliser son vocabulaire.</li>
<li><b>S'intéresser aux détails</b> : <span class="quote">« Depuis quand ? Comment ça a commencé ? À partir de quand c'est devenu insupportable ? »</span></li>
<li><b>Reformuler</b> : <span class="quote">« Si je comprends bien… Corrige-moi si je me trompe. »</span></li>
</ul>
<h2>Vérifier la sécurité</h2>
<p><span class="quote">« Si cela continuait, ça pourrait aller jusqu'où ? Que ferais-tu si cela ne s'arrangeait pas ? »</span> Ces questions permettent de repérer un risque de geste désespéré ou de violence grave. En cas de danger, la protection devient l'urgence absolue.</p>
<h2>Les erreurs à éviter</h2>
<ul class="says ko">
<li>Créer de faux espoirs : « ça va s'arranger », « on va le punir ».</li>
<li>Donner des conseils au-dessus de ses forces : « ignore-le », « réponds-lui ».</li>
<li>Lui expliquer tout ce qui va être fait côté auteurs : l'adulte tient le cadre, pas l'élève.</li>
<li>Parler de sa situation sans son accord, hors de l'équipe, sauf urgence.</li>
<li>Lui laisser entendre qu'il est responsable de ce qui lui arrive.</li>
<li>Vouloir aller trop vite et agir seul.</li>
</ul>
<p>Si vous ne savez pas comment aider, dites-le : <span class="quote">« Pour le moment, je n'ai pas d'idée juste. Je vais en parler à des personnes qui m'aideront à réfléchir, et je reviendrai vers toi. »</span></p>
<h2>Après l'entretien</h2>
<p>Rédigez un résumé écrit, daté. Selon le choix de l'établissement, l'entretien peut s'appuyer sur un questionnaire rempli par l'élève ou servir de trame à un compte rendu. Transmettez le jour même.</p>`,
tools:["t-premiers","t-resis","t-versailles","t-charte-mpp"], links:[CT("a/methode-de-la-preoccupation-partagee-2-rencontres-avec-leleve-cible","MPP 2 : rencontres avec l'élève cible")], see:["urgence","g2","g3"]},

g2:{rub:"gerer", n:"4.2", t:"Qui prévenir et comment signaler ?", s:"Toute situation, même difficile à qualifier, est transmise le jour même à la personne prévue par le protocole de l'établissement. Les élèves doivent savoir, tout au long de l'année, à qui ils peuvent parler.", pub:["Tous"], src:"Protocole national 2023 ; circuit de signalement 2023",
body:`
<h2>Dans l'établissement</h2>
<ol class="steps">
<li><b>La personne informée en premier</b> rédige un résumé écrit des faits rapportés.</li>
<li><b>Elle transmet le jour même</b> au chef d'établissement ou au directeur d'école, ou au coordonnateur de l'équipe ressource.</li>
<li><b>La direction et le coordonnateur</b> partagent immédiatement les éléments : ce partage est systématique à chaque étape.</li>
<li><b>L'équipe ressource</b> est réunie pour analyser la situation (voir <a href="#g4">Analyser et choisir la réponse</a>).</li>
</ol>
<h2>Par où arrive un signalement</h2>
<ul>
<li>L'élève lui-même, un camarade témoin, un ambassadeur.</li>
<li>Un adulte de l'établissement.</li>
<li>La famille de l'élève.</li>
<li>Un canal extérieur, selon les dispositifs existant dans le pays.</li>
</ul>
<h2>Ce que fixe le protocole de votre établissement</h2>
<p>Dans le réseau AEFE, chaque établissement établit son propre protocole. Il précise notamment :</p>
<ul>
<li>la ou les personnes à qui transmettre, et dans quel délai ;</li>
<li>les canaux proposés aux élèves (adultes de confiance, ambassadeurs, adresse ou boîte dédiée…) ;</li>
<li>les obligations de signalement aux autorités prévues par la législation du pays d'accueil ;</li>
<li>la remontée d'information prévue dans le réseau, selon les consignes en vigueur.</li>
</ul>
<p>Voir <a href="#pi3">Écrire le protocole de l'établissement</a>.</p>
<div class="note"><b>Les dispositifs propres à la France</b>Le protocole national cite le 3018, l'application Faits établissement, les référents départementaux ou le procureur de la République. Ils ne s'appliquent pas tels quels à l'étranger. Vérifiez l'accès au 3018 depuis votre pays et indiquez dans votre protocole les ressources d'aide locales.</div>`,
tools:["t-circuit","t-protocole","t-trame-protocole"], see:["g1","g3","pi3","co4"]},

g3:{rub:"gerer", n:"4.3", t:"Comment protéger immédiatement l'élève ?", s:"Des mesures de protection sont mises en place dès le signalement, avant toute analyse approfondie : un adulte référent, une vigilance renforcée de tous les personnels sans stigmatiser l'élève, et des camarades proches mobilisés. Les parents sont prévenus et soutenus.", pub:["Équipe ressource","Direction","CPE"], src:"Protocole national 2023",
body:`
<h2>Mesures immédiates</h2>
<ul class="check">
<li><label><input type="checkbox" id="pr1"><span><b>Un adulte référent</b> identifié, que l'élève peut voir régulièrement : vie scolaire, enseignant, CPE.</span></label></li>
<li><label><input type="checkbox" id="pr2"><span><b>Une vigilance renforcée</b> : les personnels concernés sont informés, sans détails inutiles et sans stigmatiser l'élève.</span></label></li>
<li><label><input type="checkbox" id="pr3"><span><b>Des camarades proches</b> mobilisés pour ne pas laisser l'élève seul aux moments à risque.</span></label></li>
<li><label><input type="checkbox" id="pr4"><span><b>Les ambassadeurs</b> attentifs, sans intervenir dans la situation.</span></label></li>
<li><label><input type="checkbox" id="pr5"><span><b>Les parents de l'élève</b> prévenus, soutenus et assurés de la protection de leur enfant.</span></label></li>
<li><label><input type="checkbox" id="pr6"><span><b>Un point quotidien</b> de la direction sur l'état de l'élève, au début.</span></label></li>
</ul>
<h2>Protéger sans pénaliser</h2>
<p>Les aménagements (lieux, horaires, place en classe) ne doivent pas apparaître comme une sanction pour la cible. C'est à la situation de changer, pas à l'élève de disparaître.</p>
<h2>Si l'élève est en danger</h2>
<div class="warn"><b>Priorité absolue</b>Ne laissez pas l'élève seul. Alertez la direction et les personnels de santé. Appliquez la procédure d'urgence de votre protocole, y compris l'information des autorités compétentes du pays d'accueil lorsque la loi le prévoit. La méthode de préoccupation partagée n'est pas utilisée dans ce cas.</div>
<h2>Cyberharcèlement</h2>
<p>Conserver les preuves (captures datées), ne pas répondre, signaler les contenus aux plateformes. La famille est informée des démarches possibles.</p>`,
tools:["t-protocole","t-cyber"], see:["g4","g7","urgence"]},

g4:{rub:"gerer", n:"4.4", t:"Comment analyser la situation et choisir la réponse ?", s:"L'équipe ressource analyse collégialement la situation et décide de la réponse. Quatre critères guident ce choix : la gravité, la répétition, le type de violence et l'existence d'un danger immédiat. Savoir ne pas utiliser la MPP est une compétence.", pub:["Équipe ressource","Direction"], src:"Protocole national 2023 ; « Quand ne pas utiliser la MPP » ; activité « MPP ou pas MPP »",
body:`
<h2>Réunir l'équipe ressource</h2>
<p>Le chef d'établissement ou le coordonnateur réunit l'équipe pour analyser la situation à partir des éléments recueillis : résumé du signalement, entretien avec l'élève, observations croisées. La fiche d'évaluation aide à objectiver la gravité et l'impact.</p>
<h2>Arbre de décision : MPP ou pas MPP ?</h2>
<p>L'outil ci-dessous oriente l'analyse. Il ne remplace pas la décision collégiale de l'équipe, qui reste tracée par écrit.</p>
<div class="tree" id="tree" aria-live="polite"></div>
<h2>Quelle que soit la réponse</h2>
<ul>
<li>La protection de la cible est maintenue.</li>
<li>La décision et ses raisons sont notées dans le journal de la situation.</li>
<li>La réponse est réévaluée si la situation ne s'améliore pas : on peut passer de la MPP à une procédure disciplinaire.</li>
</ul>`,
tools:["t-eval","t-arbre","t-quandpas","t-mppoupas","t-harcelometre"], see:["g5","g3","pi2"]},

g5:{rub:"gerer", n:"4.5", t:"Comment traiter une situation de harcèlement ?", s:"Le traitement suit le protocole de l'établissement. La méthode de préoccupation partagée (MPP) est une manière de conduire les entretiens à l'intérieur de ce protocole : des entretiens individuels, non accusateurs et fermes, menés vite, pour faire cesser les brimades. Si cela ne suffit pas, la procédure disciplinaire prend le relais.", pub:["Équipe ressource","Direction"], src:"Protocole national 2023 ; MPP (Centre RéSIS) ; diaporama « Mise en œuvre de pHARe et de la MPP »",
body:`
<div class="note"><b>Comprendre la méthode</b>Les origines, les principes, le déroulé complet et quatre vidéos de Réseau Canopé sont dans la page <a href="#g8">4.8 La méthode de la préoccupation partagée expliquée</a>.</div>
<div class="note"><b>Comment s'articulent protocole et MPP</b>Le protocole fixe le cadre : signalement, protection, analyse, entretiens, information des familles, réponse disciplinaire, suivi. La MPP est une modalité de conduite des entretiens, choisie par l'équipe ressource quand la situation s'y prête. Elle ne dispense jamais du cadre.</div>
<h2>Les entretiens prévus par le protocole</h2>
<ul>
<li><b>Avec la cible</b>, par deux membres de l'équipe, si possible les mêmes à chaque fois.</li>
<li><b>Avec les témoins</b>, reçus séparément, en insistant sur la dimension éducative et en les rassurant.</li>
<li><b>Avec chaque auteur</b>, reçu séparément.</li>
<li><b>Avec les familles</b>, selon des règles précises (voir <a href="#g7">Les familles pendant la situation</a>).</li>
</ul>
<p>Chaque entretien est consigné par écrit : compte rendu ou fiche d'entretien.</p>
<h2>La MPP pas à pas</h2>
<ol class="steps">
<li><b>Entretien avec la cible (et ses parents).</b> Rassurer, écouter, construire l'alliance, sans conseil. Voir <a href="#g1">Accueillir la parole</a>.</li>
<li><b>Entretiens individuels avec les intimidateurs présumés.</b> Un par un, pour casser la dynamique de groupe. Autant d'entretiens que nécessaire pour que la préoccupation soit partagée. On leur demande ce qu'ils ont observé et ce qu'ils peuvent proposer.</li>
<li><b>Phases de suivi.</b> Rencontres de suivi avec chacun, jusqu'à l'arrêt des brimades. Voir <a href="#g6">Accompagner et suivre</a>.</li>
</ol>
<h2>L'entretien avec un intimidateur présumé</h2>
<p>Trois principes : <b>courtoisie</b> (pas de sanction à ce stade), <b>sobriété</b> (pas de longues palabres), <b>fermeté</b> (l'élève repart avec une demande). Il ne doit retenir que deux messages : les adultes sont inquiets, et ils lui demandent de faire quelque chose.</p>
<div class="tbl"><table><thead><tr><th>Moment</th><th>Répliques types</th></tr></thead><tbody>
<tr><td>Ouverture</td><td class="quote">Bonjour, je suis content de te rencontrer. Je fais partie d'une équipe qui s'occupe des élèves qui ne vont pas bien. Je suis inquiet pour X. Qu'est-ce que tu peux me dire à son sujet ?</td></tr>
<tr><td>S'il ne reconnaît pas le malaise</td><td class="quote">Tu ne vois pas ? Nous sommes plusieurs à être inquiets. Je te demande d'être attentif à sa situation, et nous nous reverrons très vite.</td></tr>
<tr><td>S'il le reconnaît</td><td class="quote">Je me demande ce qu'on pourrait faire pour que ça se passe mieux pour lui. Et toi, qu'est-ce que tu pourrais faire ?</td></tr>
<tr><td>S'il propose quelque chose</td><td class="quote">Très bien. Tu vas le faire ? Je suis content. On se revoit bientôt.</td></tr>
</tbody></table></div>
<h2>Ce que la MPP n'est pas</h2>
<p>Ni une enquête, ni une médiation, ni une sanction, ni une négociation. Face au déni, on ne contredit pas frontalement et on ne cherche pas de preuves : on revient à la préoccupation et à ce qui peut changer.</p>
<h2>Une temporalité rigoureuse</h2>
<ul>
<li>Intervenir rapidement après le signalement.</li>
<li>Des entretiens brefs avec les intimidateurs.</li>
<li>Un traitement auprès des intimidateurs qui n'excède pas deux semaines.</li>
</ul>
<p>Sans ces trois conditions, la méthode échoue.</p>
<h2>Quand on ne recourt pas à la MPP, ou quand elle ne suffit pas</h2>
<ul>
<li><b>Danger pour la cible</b>, brimades à caractère <b>raciste, antisémite, sexiste ou homophobe</b>, situations de <b>sexting</b> : prise en charge spécifique, messages clairs, sanctions et soutien renforcé de la cible par plusieurs adultes.</li>
<li><b>Persistance des faits</b> malgré la MPP : l'auteur est informé des conséquences disciplinaires, ses parents sont reçus, et la direction engage la procédure prévue par le règlement intérieur.</li>
<li><b>Faits graves</b> : application des obligations légales du pays d'accueil, définies dans le protocole.</li>
</ul>
<p>La sanction seule ne met pas fin aux brimades : quand une sanction est prononcée, la cible doit être d'autant plus accompagnée.</p>
<h2>L'action collective</h2>
<p>Selon la situation, une action est menée auprès des classes concernées, voire de tout l'établissement : rappeler où et comment se confier, les règles et les valeurs de l'école, les canaux de signalement et les adultes de confiance. Un point non nominatif est fait dans les instances.</p>`,
tools:["t-crestani","t-resis","t-versailles","t-quandpas","t-protocole","t-charte-mpp"], links:[CT("a/34105/methode-de-la-preoccupation-partagee-1-prise-en-charge-dun-cas-dintimidation","MPP 1 : prise en charge d'un cas d'intimidation"),CT("a/34106/methode-de-la-preoccupation-partagee-2-rencontres-avec-leleve-cible","MPP 2 : rencontres avec l'élève cible"),CT("a/34107/methode-de-la-preoccupation-partagee-3-rencontres-avec-les-intimidateurs","MPP 3 : rencontres avec les intimidateurs"),["Approfondissement","Découvrir la méthode (site de la préoccupation partagée)","https://www.preoccupationpartagee.org/decouvrir-la-methode/"],["Approfondissement","« Agir contre le harcèlement, une préoccupation partagée », conférence de J.-P. Bellon (Réseau Canopé)","https://www.reseau-canope.fr/notice/agir-contre-le-harcelement-une-preoccupation-partagee.html"],["Source","Portail Non au harcèlement",NAH]], see:["g8","g4","g6","g7","f2"]},

g6:{rub:"gerer", n:"4.6", t:"Comment accompagner et suivre jusqu'à la résolution ?", s:"Une situation n'est close que lorsque la cible confirme que les brimades ont cessé. Le suivi concerne la cible, les auteurs et le groupe, et il est tracé dans un journal. La vigilance se prolonge : un élève peut rester fragilisé pendant des mois.", pub:["Équipe ressource","Direction"], src:"Protocole national 2023 ; fiches de suivi MPP (Centre RéSIS)",
body:`
<h2>Suivre la cible</h2>
<ul>
<li>Au début, la direction s'informe chaque jour de l'état de l'élève ; la veille s'espace ensuite, en restant régulière, si l'amélioration est confirmée par l'élève lui-même.</li>
<li>L'adulte référent maintient le lien. Les personnels de santé et sociaux peuvent être sollicités, ou une aide extérieure conseillée à la famille.</li>
<li>La famille est informée régulièrement de l'évolution.</li>
<li>Un entretien de bilan avec la cible conclut le traitement.</li>
</ul>
<h2>Suivre les auteurs et les témoins</h2>
<ul>
<li>Rencontres de suivi rapprochées avec chaque élève rencontré en MPP : a-t-il fait ce qu'il avait proposé ?</li>
<li>Observation de l'attitude des auteurs par l'ensemble des personnels, échanges réguliers dans l'équipe.</li>
<li>Accompagnement éducatif des auteurs après une sanction.</li>
</ul>
<h2>Tenir le journal de la situation</h2>
<p>Pendant toute la prise en charge, la journalisation des faits et des actions assure la traçabilité : date, action, personne, résultat. Ce journal est conservé après la résolution.</p>
<h2>Clore</h2>
<ol class="steps">
<li>La cible confirme que les brimades ont cessé.</li>
<li>Les observations des adultes vont dans le même sens.</li>
<li>L'équipe acte la clôture et la note dans le journal.</li>
<li>Une vigilance est maintenue dans la durée, notamment aux changements de classe ou d'établissement.</li>
</ol>`,
tools:["t-resis","t-eval"], see:["g5","g7","pi5"]},

g7:{rub:"gerer", n:"4.7", t:"Comment communiquer avec les familles pendant une situation ?", s:"Les parents de la cible sont informés, soutenus et associés : on leur demande de laisser deux à trois semaines à l'équipe et de ne rien entreprendre sans l'en informer. Les parents des auteurs sont reçus selon la réponse choisie. On ne communique jamais à une famille les informations concernant d'autres élèves.", pub:["Direction","Équipe ressource","CPE"], src:"Protocole national 2023 ; MPP (Centre RéSIS) ; module « communication » de la formation pHARe",
body:`
<h2>Les parents de la cible</h2>
<ul>
<li>Les informer de la situation, de la protection mise en place et de la manière dont l'équipe va agir.</li>
<li>Leur rappeler qu'ils ne peuvent pas régler le problème eux-mêmes et que la protection de leur enfant relève de l'établissement.</li>
<li>Savoir ce qu'ils ont déjà fait ou comptent faire (plainte, contact avec d'autres familles), et s'accorder sur une stratégie commune.</li>
<li>Les tenir informés régulièrement.</li>
</ul>
<div class="box"><h3>Une formulation possible</h3><p class="quote">« Vous êtes les mieux placés pour savoir comment va votre enfant ; nous avons besoin de vous pour ajuster nos actions. Merci de ne rien entreprendre sans nous en informer. Donnez-nous quinze jours, trois semaines au plus, pour mener notre protocole ; pendant ce temps, nous restons en contact avec vous. »</p></div>
<p>Si les parents pensent que leur enfant « doit apprendre à se défendre », on peut leur expliquer que se défendre n'est possible que lorsqu'on a retrouvé confiance en soi : l'enfant a d'abord besoin d'être valorisé et soutenu.</p>
<h2>Les parents des auteurs</h2>
<ul>
<li><b>Dans le cadre de la MPP</b>, les parents de l'intimidateur ne sont pas contactés tant qu'aucune sanction n'est envisagée.</li>
<li><b>Si une sanction est envisagée</b> ou si les faits persistent, ils sont reçus : conséquences des actes pour la cible, sanctions possibles, mesures de réparation et d'accompagnement. Leur concours est nécessaire à une résolution durable.</li>
</ul>
<h2>Les parents des témoins</h2>
<p>Le harcèlement est un phénomène de groupe : l'accueil et le dialogue avec les familles des témoins peuvent être utiles, en rappelant le rôle protecteur de l'établissement.</p>
<h2>Ce qui ne se dit pas</h2>
<ul class="says ko">
<li>Le nom d'autres élèves à une famille qui n'est pas la leur.</li>
<li>Les sanctions prononcées à l'égard d'un autre élève.</li>
<li>Des promesses sur l'issue (« il sera exclu »).</li>
<li>Des jugements sur l'éducation donnée par une famille.</li>
</ul>`,
tools:["t-resis","t-protocole"], see:["co1","g5","g3"]},

// ===== 5. PILOTER =====
pi1:{rub:"piloter", n:"5.1", t:"Comment fonctionne le programme pHARe ?", s:"pHARe est le programme français de prévention du harcèlement : une équipe ressource formée, des élèves ambassadeurs, 10 heures d'apprentissage par an, des temps forts et l'implication des familles. Dans le réseau AEFE, il ne peut pas être imposé mais il constitue une priorité.", pub:["Direction","Équipe ressource"], src:"Programme pHARe en 4 pages (2023) ; réponses ministérielles aux questions parlementaires (2023)",
body:`
<h2>Cinq piliers</h2>
<ol>
<li>Éduquer pour prévenir les phénomènes de harcèlement.</li>
<li>Former une communauté protectrice de professionnels et de personnels autour des élèves.</li>
<li>Intervenir efficacement sur les situations de harcèlement.</li>
<li>Associer les parents et les partenaires, et communiquer sur le programme.</li>
<li>Mobiliser les instances de démocratie scolaire et le comité d'éducation à la santé, à la citoyenneté et à l'environnement.</li>
</ol>
<div class="note"><b>Cinq piliers</b>Éduscol confirme cette structure en cinq piliers (mise à jour de juin 2026). Les anciens supports qui parlent de « huit piliers » sont à mettre à jour.</div>
<h2>Trois niveaux de labellisation</h2>
<div class="tbl"><table><thead><tr><th>Niveau</th><th>Engagements</th></tr></thead><tbody>
<tr><td><b>1. Engagement</b></td><td>Équipe ressource de 5 personnels formés ; atelier de sensibilisation des parents ; un temps fort ; 10 heures d'apprentissage du CP à la terminale ; au moins 10 élèves ambassadeurs au collège et au lycée</td></tr>
<tr><td><b>2. Approfondissement</b></td><td>Un deuxième temps fort</td></tr>
<tr><td><b>3. Expertise</b></td><td>Un troisième temps fort et l'engagement dans un processus d'amélioration du climat scolaire</td></tr>
</tbody></table></div>
<h2>pHARe dans le réseau AEFE</h2>
<p>Le programme ne peut pas être imposé à des établissements qui ne relèvent pas du même cadre juridique qu'en France. L'AEFE a fait de son déploiement une priorité : formation de formateurs climat scolaire, accompagnement des établissements dans le diagnostic et la formalisation de leur protocole. Le bien-être des élèves est par ailleurs un critère d'homologation.</p>
<p>Concrètement, chaque établissement adapte les composantes de pHARe à sa taille, à sa culture et surtout à la législation du pays d'accueil, en commençant par son <a href="#pi3">protocole</a>.</p>
<h2>Où se range chaque composante dans ce site</h2>
<ul>
<li>10 heures, ambassadeurs, temps forts : <a href="#p3">Prévenir</a>.</li>
<li>Repérage et diagnostic : <a href="#r1">Repérer</a>.</li>
<li>Protocole et MPP : <a href="#g5">Gérer une situation</a>.</li>
<li>Équipe ressource, plan d'action, évaluation : cette rubrique.</li>
</ul>`,
tools:["t-4pages"], links:[CT("serie/lutter-contre-le-harcelement-au-1er-degre-le-programme-phare","Série : pHARe au premier degré"),CT("serie/lutter-contre-le-harcelement-au-2nd-degre-le-programme-phare","Série : pHARe au second degré"),["Outil","Guide de présentation de pHARe (Genially)","https://view.genial.ly/62b85862fe601e00116fa30e/guide-presentation-phare"],["Vidéo","Les enjeux du programme pHARe (CanoTech)","https://www.canotech.fr/a/32052/les-enjeux-du-programme-phare"],["Source","Éduscol : lutter contre le harcèlement entre élèves",EDU_PHARE],["Source","Sénat, question écrite sur pHARe dans le réseau AEFE (2023)","https://www.senat.fr/questions/base/2023/qSEQ231008520.html"]], see:["c1","pi2","pi3","pi4"]},

pi2:{rub:"piloter", n:"5.3", t:"Comment constituer l'équipe ressource ?", s:"L'équipe ressource réunit au moins cinq personnels formés, de métiers différents, autour d'un coordonnateur. Elle repère, analyse et traite les situations et accompagne les ambassadeurs. Elle ne prononce ni punition ni sanction : c'est le rôle de la direction.", pub:["Direction","Équipe ressource"], src:"Programme pHARe en 4 pages ; protocole national 2023 ; guide des ambassadeurs",
body:`
<h2>Composition</h2>
<ul>
<li>Au moins cinq personnels, volontaires, formés à la prise en charge des situations.</li>
<li>Des métiers complémentaires : personnel de direction, CPE ou vie scolaire, enseignants, personnels de santé, psychologue lorsqu'il en existe un.</li>
<li>Au premier degré, l'équipe peut être constituée à l'échelle de plusieurs écoles.</li>
<li>Pour la MPP, une équipe resserrée de cinq à huit personnes, clairement identifiée, garantit une mise en œuvre cohérente.</li>
</ul>
<h2>Le coordonnateur</h2>
<ul>
<li>Il reçoit les signalements et réunit l'équipe.</li>
<li>Il partage systématiquement les informations avec la direction.</li>
<li>Il veille au suivi et à la tenue du journal de chaque situation.</li>
<li>Il fait le lien avec les adultes référents des ambassadeurs.</li>
</ul>
<h2>Missions de l'équipe</h2>
<div class="two">
<div class="box"><h3>Prévention</h3><ul><li>Information des classes</li><li>Formation des délégués</li><li>Appui aux ambassadeurs</li><li>Participation aux temps forts</li></ul></div>
<div class="box"><h3>Traitement</h3><ul><li>Collecte des informations</li><li>Entretiens individuels</li><li>Information des équipes</li><li>Solutions avec les élèves concernés</li><li>Suivis individuels</li></ul></div>
</div>
<h2>Fonctionnement</h2>
<ul>
<li><b>Confidentialité</b> : ce qui est dit en équipe reste en équipe ; on ne partage à l'extérieur que l'utile.</li>
<li><b>Régularité</b> : des réunions programmées, pas seulement en cas de crise.</li>
<li><b>Cohérence</b> : les mêmes outils et les mêmes fiches pour toutes les situations.</li>
<li><b>Temps dédié</b> : prévu dans l'organisation de l'établissement.</li>
</ul>
<p>Si le harcèlement persiste malgré l'intervention de l'équipe, le chef d'établissement prend le relais et peut apporter une réponse disciplinaire.</p>`,
tools:["t-qui","t-livret-ref","t-4pages","t-crestani"], links:[["Vidéo","Lutter contre le harcèlement : un enjeu pour toute la communauté éducative (CanoTech)","https://www.canotech.fr/a/31383/lutter-contre-le-harcelement-un-enjeu-pour-toute-la-communaute-educative"]], see:["pi3","pi6","g4","f1"]},

pi3:{rub:"piloter", n:"5.4", t:"Comment écrire le protocole de l'établissement ?", s:"Dans le réseau AEFE, chaque établissement établit son protocole en fonction de sa culture, de ses choix internes et surtout de la législation du pays d'accueil. Le protocole national français sert de référence de méthode. Cette trame vous aide à le rédiger en équipe.", pub:["Direction","Équipe ressource"], src:"Protocole national 2023 (méthode) ; législation du pays d'accueil (obligations)",
body:`
<h2>Les étapes de rédaction</h2>
<ol class="steps">
<li><b>Réunir</b> la direction, le coordonnateur et l'équipe ressource.</li>
<li><b>Recenser</b> les obligations légales du pays d'accueil : protection des mineurs, signalement aux autorités, données personnelles, droit à l'image. Faire valider ce point par une personne compétente.</li>
<li><b>Remplir la trame</b> ci-dessous à partir du protocole national, adapté.</li>
<li><b>Présenter</b> le protocole aux instances de l'établissement et l'annexer au règlement intérieur si c'est l'usage.</li>
<li><b>Diffuser</b> à tous les personnels, aux familles et aux élèves sous une forme adaptée.</li>
<li><b>Réviser</b> chaque année, à la rentrée.</li>
</ol>
<h2>Trame à remplir</h2>
<p>Vos réponses sont conservées dans ce navigateur. Le bouton « Copier la trame » rassemble le texte pour le coller dans un document.</p>
<form class="form" id="protoForm"></form>
<div class="act" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn pri" type="button" id="protoCopy">Copier la trame</button><button class="btn" type="button" id="protoClear">Effacer mes réponses</button></div>
<div id="protoConfirm" hidden class="warn" style="margin-top:10px"><b>Effacer toutes les réponses ?</b><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" type="button" id="protoYes">Oui, effacer</button><button class="btn" type="button" id="protoNo">Annuler</button></div></div>`,
tools:["t-protocole","t-circuit","t-trame-protocole"], links:[["Source","Portail Non au harcèlement",NAH]], see:["g2","g5","pi2","co2"]},

pi4:{rub:"piloter", n:"5.5", t:"Comment programmer l'année ?", s:"Un plan d'action annuel cale les grandes étapes : constitution de l'équipe et appel aux ambassadeurs en septembre, formation en octobre et novembre, temps forts, 10 heures réparties dans l'année, bilan en fin d'année.", pub:["Direction","Équipe ressource"], src:"Guide des ambassadeurs (feuille de route) ; programme pHARe en 4 pages",
body:`
<h2>Calendrier type</h2>
<div class="tbl"><table><thead><tr><th>Période</th><th>Actions</th></tr></thead><tbody>
<tr><td><b>Septembre</b></td><td>Mise à jour de l'équipe ressource et du protocole ; appel à candidatures des ambassadeurs ; désignation des adultes référents ; présentation du programme et du protocole aux familles lors des réunions de rentrée</td></tr>
<tr><td><b>Octobre</b></td><td>Programmation des formations (personnels, ambassadeurs) ; trombinoscope ; planification des 10 heures par niveau</td></tr>
<tr><td><b>Novembre</b></td><td>Journée Non au harcèlement ; premier module des ambassadeurs</td></tr>
<tr><td><b>1er trimestre</b></td><td>Prix Non au harcèlement ; atelier de sensibilisation des parents</td></tr>
<tr><td><b>Février</b></td><td>Safer Internet Day</td></tr>
<tr><td><b>Printemps</b></td><td>Enquête de climat si elle est prévue ; actions des ambassadeurs</td></tr>
<tr><td><b>Juin</b></td><td>Bilan : situations traitées, actions, indicateurs ; priorités pour l'année suivante</td></tr>
</tbody></table></div>
<h2>Thèmes d'action à l'échelle de l'établissement</h2>
<ul>
<li>Formation des ambassadeurs.</li>
<li>Participation au prix Non au harcèlement.</li>
<li>Journée Safer Internet Day.</li>
<li>Mallette des parents et atelier de sensibilisation.</li>
<li>Accueil des nouveaux élèves (« Bienvenue en 6e », arrivées en cours d'année).</li>
<li>10 heures d'apprentissage, dans le temps scolaire.</li>
<li>Travail de l'empathie avec les élèves.</li>
</ul>
<h2>Faire vivre le programme dans les instances</h2>
<p>Un point d'information non nominatif aux instances de l'établissement (conseil d'établissement, conseils des élèves, comité d'éducation à la santé et à la citoyenneté lorsqu'il existe) maintient la mobilisation et associe élèves et familles.</p>`,
tools:["t-4pages","t-mallette","t-livret-amb"], see:["p3","p4","p5","pi5"]},

pi5:{rub:"piloter", n:"5.6", t:"Comment évaluer les actions conduites ?", s:"Les ressources actuelles parlent d'évaluer les actions mais proposent peu d'indicateurs. Cette page propose une base à adapter : des indicateurs de mise en œuvre, de traitement des situations et de perception, mesurés chaque année.", pub:["Direction","Équipe ressource"], src:"Guide DGESCO (évaluation des projets) ; questionnaires AEFE ELCS",
body:`
<div class="note"><b>Une proposition</b>Les indicateurs ci-dessous ne sont pas issus d'un texte officiel. Ils traduisent le principe du guide climat scolaire : évaluer les actions de façon partagée et ajuster en fonction des résultats.</div>
<h2>Trois familles d'indicateurs</h2>
<div class="tbl"><table><thead><tr><th>Famille</th><th>Exemples d'indicateurs</th><th>Source</th></tr></thead><tbody>
<tr><td><b>Mise en œuvre</b></td><td>Personnels formés ; ambassadeurs formés et actifs ; heures des 10 heures réalisées par niveau ; temps forts organisés ; atelier parents tenu</td><td>Plan d'action annuel</td></tr>
<tr><td><b>Situations</b></td><td>Nombre de situations signalées et traitées ; délai entre signalement et premier entretien ; situations closes ; reprises des faits</td><td>Journal des situations</td></tr>
<tr><td><b>Perception</b></td><td>Sentiment de sécurité, qualité des relations, sentiment de justice chez les élèves, les parents et les personnels</td><td>Enquête ELCS, avant et après</td></tr>
</tbody></table></div>
<h2>Lire les chiffres avec prudence</h2>
<p>Une hausse des signalements peut traduire une meilleure confiance dans les adultes et non une dégradation. Croisez toujours les trois familles d'indicateurs.</p>
<h2>Le bilan annuel</h2>
<ol class="steps">
<li>Rassembler les indicateurs en fin d'année.</li>
<li>Les analyser en équipe, avec les ambassadeurs pour la partie prévention.</li>
<li>Retenir deux ou trois priorités pour l'année suivante.</li>
<li>Restituer le bilan aux instances, sans aucune donnée nominative.</li>
</ol>`,
tools:["t-elcs","t-guide-cs"], see:["r3","pi4","g6"]},

pi6:{rub:"piloter", n:"5.7", t:"Quel est le rôle de chacun ?", s:"La direction décide et sanctionne, le coordonnateur organise, l'équipe ressource traite, chaque adulte repère et transmet, les ambassadeurs sensibilisent et alertent, les familles sont associées.", pub:["Tous"], src:"Protocole national 2023 ; guide des ambassadeurs ; programme pHARe en 4 pages",
body:`
<div class="tbl"><table><thead><tr><th>Qui</th><th>Prévention</th><th>Situation</th><th>Ne fait pas</th></tr></thead><tbody>
<tr><td><b>Chef d'établissement, directeur d'école</b></td><td>Pilote le plan d'action, garantit le protocole, constitue l'équipe</td><td>Est informé de toutes les situations ; décide des mesures de protection ; seul à décider des sanctions ; applique les obligations légales</td><td>Traiter seul, sans l'équipe</td></tr>
<tr><td><b>Coordonnateur</b></td><td>Anime l'équipe, fait le lien avec les ambassadeurs</td><td>Reçoit les signalements, réunit l'équipe, tient le journal, assure le suivi</td><td>Décider des sanctions</td></tr>
<tr><td><b>Équipe ressource</b></td><td>Informe, forme les délégués, appuie les temps forts</td><td>Analyse, conduit les entretiens (dont MPP), suit les élèves</td><td>Prononcer punitions ou sanctions</td></tr>
<tr><td><b>Enseignants</b></td><td>Gestes protecteurs en classe, 10 heures</td><td>Repèrent, accueillent la parole, transmettent le jour même</td><td>Enquêter, confronter les élèves</td></tr>
<tr><td><b>Vie scolaire, CPE</b></td><td>Présence dans les lieux à risque, référents des ambassadeurs</td><td>Repèrent, transmettent, adulte référent de la cible</td><td>Agir hors protocole</td></tr>
<tr><td><b>Personnels de santé</b></td><td>Éducation à la santé, compétences psychosociales</td><td>Repèrent, soutiennent, orientent</td><td>—</td></tr>
<tr><td><b>Élèves ambassadeurs</b></td><td>Sensibilisent, conduisent des projets</td><td>Repèrent, soutiennent la cible, alertent un adulte</td><td>Intervenir, juger, servir de médiateur</td></tr>
<tr><td><b>Parents ambassadeurs</b> (si mis en place)</td><td>Relaient la prévention, informent les familles</td><td>Écoutent, orientent, signalent à la direction</td><td>Participer au traitement</td></tr>
<tr><td><b>Familles</b></td><td>Sont informées du programme et du protocole, participent aux ateliers</td><td>Signalent, sont associées au traitement</td><td>Régler la situation elles-mêmes</td></tr>
</tbody></table></div>`,
tools:["t-qui","t-livret-amb","t-protocole"], see:["pi2","pi3","g2"]},

// ===== 6. COMMUNIQUER =====
co1:{rub:"communiquer", n:"6.1", t:"Comment associer les familles en prévention ?", s:"Les familles sont co-éducatrices : elles connaissent le programme, le protocole et les personnes à contacter avant qu'une situation ne survienne. Un atelier de sensibilisation des parents fait partie du premier niveau de pHARe.", pub:["Direction","Enseignants","1er degré"], src:"Guide DGESCO (coéducation) ; programme pHARe en 4 pages",
body:`
<h2>Ce que les familles doivent savoir dès la rentrée</h2>
<ul>
<li>L'établissement agit contre le harcèlement et dispose d'un protocole.</li>
<li>À qui s'adresser, comment, et dans quel délai on leur répond.</li>
<li>Ce que l'établissement fera, et ce qu'on leur demande de ne pas faire seules.</li>
</ul>
<h2>Actions possibles</h2>
<ul>
<li>Présentation du programme et du protocole aux réunions de rentrée.</li>
<li>Atelier de sensibilisation des parents, par exemple autour des usages numériques.</li>
<li>Livret d'accueil des nouvelles familles, avec les contacts utiles, traduit si nécessaire.</li>
<li>Recours à des traducteurs ou à des parents relais.</li>
<li>Espaces et temps de rencontre au-delà des réunions institutionnelles.</li>
<li>Associer les représentants des parents à la rédaction des documents d'information.</li>
</ul>
<p>Depuis septembre 2026, le ministère présente la possibilité de constituer des groupes de <a href="#co5">parents ambassadeurs</a>, chargés de prévenir, repérer et orienter les familles, sans traiter les situations.</p>
<h2>Une communication qui rassure</h2>
<ul>
<li>Répondre aux messages dans un délai annoncé, avec un ton courtois et des éléments précis.</li>
<li>Expliquer une décision plutôt que d'opposer « les règles sont claires, point ».</li>
<li>Éviter que l'élève se sente responsable de la colère de ses parents envers l'école.</li>
</ul>`,
tools:["t-guide-cs","t-cyber","t-parents-amb"], links:[["Outil","Internet Sans Crainte : kits parents (Safer Internet Day)","https://www.internetsanscrainte.fr/sid"]], see:["g7","p5","co2"]},

co2:{rub:"communiquer", n:"6.3", t:"Comment communiquer au sein de l'établissement ?", s:"Tous les personnels connaissent le protocole et les personnes ressources, y compris les nouveaux arrivants. Les remontées des équipes reçoivent une réponse. Le discours de l'établissement est cohérent et rassurant.", pub:["Direction","Équipe ressource"], src:"Protocole national 2023 ; module « communication » de la formation pHARe",
body:`
<h2>Diffuser le cadre</h2>
<ul>
<li>Présenter le protocole à la prérentrée et à chaque nouvel arrivant, y compris aux personnels non enseignants.</li>
<li>Afficher le trombinoscope de l'équipe ressource et des ambassadeurs.</li>
<li>Mettre les fiches et outils à disposition au même endroit.</li>
</ul>
<h2>Informer sans exposer</h2>
<ul>
<li>Pendant une situation, les adultes concernés sont informés de son évolution, dans la limite de ce qui est utile.</li>
<li>Un point non nominatif est fait régulièrement dans les instances.</li>
</ul>
<h2>Répondre aux équipes</h2>
<p>Des messages restés sans réponse donnent aux équipes le sentiment d'être invisibles et découragent les remontées. Accuser réception, dire ce qui sera fait et quand, même lorsque la réponse prend du temps.</p>`,
tools:["t-protocole","t-qui"], see:["pi3","pi6","co3"]},

co3:{rub:"communiquer", n:"6.4", t:"Comment valoriser les actions, y compris sur les réseaux sociaux ?", s:"Valoriser les actions mobilise la communauté et montre l'engagement de l'établissement. Une règle ne souffre aucune exception : on communique sur les actions, jamais sur une situation.", pub:["Direction","Ambassadeurs"], src:"Module « communication » de la formation pHARe ; recommandations proposées",
body:`
<h2>Quoi valoriser</h2>
<ul>
<li>Les temps forts, les productions des élèves, le prix Non au harcèlement.</li>
<li>L'engagement des ambassadeurs et des équipes.</li>
<li>Les canaux d'écoute et les personnes ressources.</li>
</ul>
<h2>Où</h2>
<p>Site de l'établissement, espace numérique de travail, lettre aux familles, presse locale, réseaux sociaux de l'établissement.</p>
<h2>Règles pour les réseaux sociaux</h2>
<div class="note"><b>Recommandations proposées</b>Les ressources actuelles ne détaillent pas ce point. Ces règles sont à valider par la direction et à confronter à la législation du pays d'accueil.</div>
<ul>
<li>Jamais d'évocation d'une situation réelle, même anonymisée.</li>
<li>Aucun élève identifiable sans les autorisations requises, selon le droit à l'image applicable.</li>
<li>Des messages positifs, centrés sur ce que chacun peut faire.</li>
<li>La modération des commentaires prévue avant publication.</li>
<li>Les numéros et canaux d'aide rappelés dans les publications sur le harcèlement.</li>
</ul>`,
tools:["t-trame-evt","t-mallette"], see:["p5","co2","co4"]},

co4:{rub:"communiquer", n:"6.5", t:"Comment communiquer avec les élèves ?", s:"Chaque élève doit savoir, tout au long de l'année, à qui parler s'il est victime ou témoin. Ce rappel est permanent, à tous les niveaux : affichage, heures de vie de classe, ambassadeurs.", pub:["Enseignants","Vie scolaire"], src:"Protocole national 2023",
body:`
<h2>Un message répété toute l'année</h2>
<ul>
<li>Affichage des canaux d'écoute et des adultes de confiance.</li>
<li>Rappel en heure de vie de classe, à la rentrée et après chaque vacances.</li>
<li>Trombinoscope des ambassadeurs et des référents.</li>
<li>Information dans les supports numériques de l'établissement.</li>
</ul>
<h2>Les messages clés</h2>
<ul class="says ok">
<li>Parler à un adulte, ce n'est pas « balancer » : c'est aider quelqu'un qui souffre.</li>
<li>Le harcèlement ne vit que parce que le groupe le laisse vivre.</li>
<li>Un témoin peut changer la situation sans se mettre en danger.</li>
<li>Ce n'est jamais la faute de la victime.</li>
</ul>
<h2>Après une situation</h2>
<p>Une intervention dans la classe concernée rappelle où et comment se confier, les règles et les valeurs de l'établissement, et les droits de l'enfant, sans jamais revenir sur la situation elle-même.</p>`,
tools:["t-circuit","t-amb1d"], see:["p4","g2","g5"]},


co5:{rub:"communiquer", n:"6.2", t:"Quelle place pour les parents ambassadeurs ?", s:"Depuis septembre 2026, le ministère présente la possibilité de constituer des groupes de parents ambassadeurs : ils contribuent à prévenir, repérer et orienter. Ils ne traitent pas les situations et n'accèdent pas aux informations confidentielles.", pub:["Direction","Familles","Équipe ressource"], src:"Ministère de l'Éducation nationale, 22 septembre 2026",
body:`
<h2>Trois missions</h2>
<div class="two"><div class="box"><h3>Prévenir</h3><p>Relayer les actions, expliquer le harcèlement et le cyberharcèlement, diffuser les ressources et les contacts utiles.</p></div><div class="box"><h3>Repérer</h3><p>Écouter les familles et les orienter vers les personnes ressources de l'établissement quand des signes de harcèlement apparaissent.</p></div><div class="box"><h3>Orienter</h3><p>Indiquer le bon interlocuteur : direction, équipe ressource, professionnels de santé ou services compétents.</p></div></div>
<h2>Ce qu'ils ne font pas</h2>
<ul class="says ko"><li>Enquêter sur une situation.</li><li>Contacter la famille d'un autre élève pour « régler » le problème.</li><li>Recevoir le détail d'une situation suivie par l'équipe ressource.</li><li>Se substituer à la direction ou aux professionnels.</li></ul>
<h2>Mise en place</h2>
<p>À l'initiative de la direction, avec des responsables légaux volontaires qui adhèrent à la politique de l'établissement ; formation obligatoire ; charte d'engagement réciproque (confidentialité, limites du rôle) ; au moins deux parents par groupe.</p>
<h2>Dans le réseau AEFE</h2>
<p>Cette évolution peut inspirer la coéducation, mais sa mise en œuvre doit être adaptée au contexte de l'établissement et au droit du pays d'accueil. L'enjeu n'est pas de créer une fonction de plus : c'est de rendre le parcours des familles plus lisible et de renforcer la confiance.</p>`,
tools:["t-parents-amb","t-guide-cs"], see:["co1","co2","g7","pi6"]},

// ===== 7. FORMER =====
f1:{rub:"former", n:"7.1", t:"Quel parcours de formation proposer ?", s:"Une formation complète suit une progression : comprendre le climat scolaire, diagnostiquer, agir au quotidien, prévenir, repérer, traiter puis piloter. Trois formats — 6 h, 12 h ou 18 h — permettent d'adapter cette logique au temps disponible.", pub:["Formateurs","Direction"], src:"Déroulés Sofia, Milan, Turin, Bucarest ; Éduscol climat scolaire et pHARe ; ressources 2026",
body:`
<h2>Trois formats cohérents</h2>
<div class="format-grid"><div class="format-card"><b>6 h · Sensibilisation structurée</b><p>Culture commune du climat scolaire, 7 facteurs, mécanismes du harcèlement, pHARe, repérage et conduite à tenir.</p><span>Tous personnels · 1er et 2d degrés</span></div><div class="format-card"><b>12 h · Approfondissement</b><p>Ajoute diagnostic, vie scolaire, CPS, 10 h, ambassadeurs, familles, études de cas et premières priorités d'action.</p><span>Équipes éducatives · pilotage</span></div><div class="format-card"><b>18 h · Parcours complet</b><p>Trois journées avec analyse de l'établissement, entraînement au traitement et à la MPP, puis construction d'un plan local.</p><span>Équipe ressource · formateurs</span></div></div>
<h2>Dix modules qui s'enchaînent</h2>
<div class="pathway">
<div class="pathstep"><span class="pnumb">01</span><div><h3>Construire une représentation commune du climat scolaire</h3><p>Définition systémique, effets sur les apprentissages et le bien-être, 7 facteurs.</p></div></div>
<div class="pathstep"><span class="pnumb">02</span><div><h3>Lire l'établissement comme un système</h3><p>Pratiques, relations, justice, espaces, stratégie d'équipe, coéducation et partenariats.</p></div></div>
<div class="pathstep"><span class="pnumb">03</span><div><h3>Diagnostiquer</h3><p>ELCS, Climat scolaire 360 lorsqu'il est accessible, observations et données locales.</p></div></div>
<div class="pathstep"><span class="pnumb">04</span><div><h3>Agir au quotidien</h3><p>Relation éducative, vie scolaire, règles, transitions, espaces et cohérence des adultes.</p></div></div>
<div class="pathstep"><span class="pnumb">05</span><div><h3>Développer CPS, empathie, coopération et appartenance</h3><p>Prévention universelle et progression de la maternelle au lycée.</p></div></div>
<div class="pathstep"><span class="pnumb">06</span><div><h3>Comprendre le harcèlement et le cyberharcèlement</h3><p>Répétition, asymétrie, isolement, rôle des pairs et loi du silence.</p></div></div>
<div class="pathstep"><span class="pnumb">07</span><div><h3>Déployer pHARe</h3><p>5 piliers, équipe ressource, 10 h, temps forts, ambassadeurs, parents et communication.</p></div></div>
<div class="pathstep"><span class="pnumb">08</span><div><h3>Réagir à un signalement</h3><p>Accueillir, protéger, tracer, analyser et choisir la réponse sans agir seul.</p></div></div>
<div class="pathstep"><span class="pnumb">09</span><div><h3>Traiter, dont la MPP lorsqu'elle est adaptée</h3><p>Posture, entretiens, limites, situations complexes, familles et suivi jusqu'à résolution.</p></div></div>
<div class="pathstep"><span class="pnumb">10</span><div><h3>Transformer la formation en stratégie durable</h3><p>Deux ou trois priorités, calendrier, indicateurs, communication, revue à 90 jours et évaluation annuelle.</p></div></div>
</div>
<h2>Scénario recommandé sur trois jours</h2>
<div class="tbl"><table><thead><tr><th>Jour</th><th>Fil conducteur</th><th>Contenu</th></tr></thead><tbody><tr><td><b>1</b></td><td>Comprendre & diagnostiquer</td><td>Représentations, 7 facteurs, vie scolaire, ELCS/diagnostic croisé, cartographie des espaces et temps.</td></tr><tr><td><b>2</b></td><td>Prévenir & mobiliser</td><td>CPS, progression interdegrés, mécanismes du harcèlement, 10 h, pHARe, ambassadeurs, familles.</td></tr><tr><td><b>3</b></td><td>Traiter & piloter</td><td>Signalement, protection, choix de réponse, MPP, cas complexes, communication et plan d'action à 90 jours.</td></tr></tbody></table></div>
<h2>Productions attendues</h2>
<ul><li>Une lecture de l'établissement selon les 7 facteurs.</li><li>Une carte des espaces, temps et moments à risque ou protecteurs.</li><li>Une séquence ou un parcours 10 h adapté à un niveau.</li><li>Un protocole local lisible : qui alerter, qui protège, qui suit, qui communique.</li><li>Un plan d'action à 90 jours avec responsables et indicateurs.</li></ul>
<h2>Principes de conception</h2>
<ul>
<li>Partir de situations professionnelles : chaque apport est relié à un cas ou à une décision.</li>
<li><b>Règle 30/70</b> : les apports descendants ne dépassent pas un tiers du temps ; le reste sert à analyser, débattre, simuler et produire.</li>
<li>Travailler l'interdegrés : même logique de prévention et de protection, supports adaptés à l'âge.</li>
<li>Toujours distinguer conflit, violence et harcèlement : médiation, MPP et procédure disciplinaire ne répondent pas aux mêmes situations.</li>
</ul>
<h2>Démarrer en établissement : trois modules courts</h2>
<div class="tbl"><table><thead><tr><th>Module</th><th>Public</th><th>Durée</th><th>Pages</th></tr></thead><tbody>
<tr><td><b>Comprendre, prévenir, détecter</b></td><td>Tous les personnels</td><td>2 h à 3 h</td><td><a href="#c1">1.1</a>, <a href="#c2">1.2</a>, <a href="#r1">3.1</a>, <a href="#g2">4.2</a></td></tr>
<tr><td><b>L'équipe ressource</b></td><td>Équipe ressource, direction</td><td>1 h à 2 h</td><td><a href="#pi2">5.3</a>, <a href="#pi3">5.4</a>, <a href="#co2">6.2</a></td></tr>
<tr><td><b>La MPP</b></td><td>Équipe resserrée de 5 à 8 personnes</td><td>2 h à 3 h</td><td><a href="#g4">4.4</a>, <a href="#g5">4.5</a>, <a href="#g6">4.6</a></td></tr>
</tbody></table></div>
<p>Pour limiter les absences devant élèves, ces modules peuvent être répétés en petits groupes, sur la pause méridienne, en fin de journée ou le mercredi après-midi au premier degré. Pour les personnels de l'Éducation nationale, le parcours Magistère « Prévenir et lutter contre le harcèlement à l'école » constitue un premier temps de formation.</p>`,
tools:["t-cs-eduscol","t-whole","t-cps-spf","t-15sit","t-atelier-mpp","t-anim","t-plan90","t-gamma","t-scenettes","t-padlets"], links:[["Source","Parcours Magistère « Prévenir et lutter contre le harcèlement à l'École »","https://magistere.education.fr/dgesco/course/view.php?id=2875"]], see:["f8","f5","f2","f7","r4","p8"]},

f2:{rub:"former", n:"7.3", t:"Quels ateliers et études de cas utiliser ?", s:"Une formation de qualité fait décider, observer, argumenter et rejouer. Les ateliers ci-dessous couvrent le diagnostic, la prévention, le signalement, la MPP, la communication et le transfert dans l'établissement.", pub:["Formateurs"], src:"Supports de formation du corpus ; enrichissements didactiques proposés",
body:`
<div class="tbl"><table><thead><tr><th>Atelier</th><th>Objectif</th><th>Durée</th></tr></thead><tbody>
<tr><td><b>1. Photolangage « mon climat scolaire »</b></td><td>Faire émerger les représentations avant tout apport théorique.</td><td>30–45 min</td></tr>
<tr><td><b>2. 15 situations de climat dégradé</b></td><td>Passer d'un cas particulier aux causes systémiques et aux leviers.</td><td>1 h 30</td></tr>
<tr><td><b>3. Cartographie sensible de l'établissement</b></td><td>Identifier lieux, temps et transitions protecteurs ou à risque.</td><td>45 min</td></tr>
<tr><td><b>4. World café des 7 facteurs</b></td><td>Construire une lecture partagée des forces et fragilités de l'établissement.</td><td>60 min</td></tr>
<tr><td><b>5. Continuum conflit / violence / harcèlement</b></td><td>Distinguer les situations et éviter les réponses automatiques.</td><td>45 min</td></tr>
<tr><td><b>6. Repérer et agir sur 4 situations</b></td><td>Croiser signaux faibles, grille de repérage et regards professionnels.</td><td>45 min</td></tr>
<tr><td><b>7. Construire 2 h des 10 h</b></td><td>Concevoir une séance liée à une CPS précise, adaptée à un niveau.</td><td>60 min</td></tr>
<tr><td><b>8. Ambassadeur : rôle / non-rôle</b></td><td>Travailler les limites : sensibiliser, repérer, alerter, mais ne pas traiter.</td><td>30 min</td></tr>
<tr><td><b>9. Les 15 premières minutes après un signalement</b></td><td>S'entraîner à écouter, protéger, noter et transmettre sans enquêter.</td><td>45 min</td></tr>
<tr><td><b>10. MPP ou pas MPP ?</b></td><td>Décider à partir de la gravité, de la répétition, du type de violence et du danger.</td><td>45 min</td></tr>
<tr><td><b>11. Simulation MPP + rejouage</b></td><td>Observer la posture, reformuler, puis rejouer l'entretien en améliorant un point précis.</td><td>1 h 30</td></tr>
<tr><td><b>12. Entretien avec une famille en tension</b></td><td>Maintenir l'alliance, expliquer ce qui peut être dit, annoncer le suivi et poser les limites.</td><td>45 min</td></tr>
</tbody></table></div>
<div class="note"><b>Consignes détaillées</b>Les déroulés complets, minutés et documentés, sont dans les <a href="#f8">fiches d'activités (7.8)</a>.</div>
<h2>Une règle didactique simple</h2><p>Chaque atelier se conclut par trois questions : <b>qu'avons-nous compris ? qu'est-ce que cela change dans notre pratique ? quel outil ou quelle décision emportons-nous ?</b></p>
<h2>Pour les scénettes MPP</h2><p>Faire une première tentative courte, débriefer uniquement sur des faits observables, choisir une phrase ou une posture à améliorer, puis rejouer. Le rejouage est plus formateur qu'un long commentaire.</p>
<h2>Les scénettes d'entretien MPP</h2>
<p>Trois rôles, en rotation : A mène l'entretien, B joue l'élève (cible ou intimidateur), C observe avec la grille. Une première tentative courte, un débriefing sur des faits observables, puis un rejouage.</p>
<p><b>L'entretien raté</b> (30 min) : le formateur joue un entretien qui accumule les erreurs ; le groupe les relève avant la première scénette.</p>
<h2>Les pièges à travailler en scénettes</h2>
<ul>
<li>Questions accusatrices : « Pourquoi as-tu fait ça ? », « Tu nies les faits ? »</li>
<li>Jugements de valeur : « C'est lâche », « Tu n'as pas honte ? »</li>
<li>Recherche de preuves face au déni.</li>
<li>Menace de sanction dès le premier entretien.</li>
</ul>
<h2>Les réactions types d'un élève</h2>
<p>Minimiser (« c'est pour rire »), banaliser (« on se bouscule tous »), se dédouaner (« il a qu'à se défendre »), diluer (« c'est les autres »). Les dialogues « difficiles » de l'atelier MPP (mutisme de la cible, déni de l'intimidateur) permettent de s'y entraîner.</p>`,
tools:["t-15sit","t-atelier-dgesco","t-3sit","t-atelier-mpp","t-mppoupas","t-reperage","t-cas-aed","t-scenettes","t-gamma"], see:["f8","f1","f6","g4","g5","r4"]},

f3:{rub:"former", n:"7.5", t:"Quelles techniques d'animation ?", s:"Douze techniques couvrent les trois besoins d'une séance : faire connaissance, exprimer un ressenti, débattre et argumenter. Elles servent aussi bien en formation d'adultes qu'avec les ambassadeurs.", pub:["Formateurs","Vie scolaire"], src:"Fiches « techniques d'animation » (formation des élèves ambassadeurs)",
body:`
<div class="tbl"><table><thead><tr><th>Technique</th><th>Objectif</th><th>Durée</th></tr></thead><tbody>
<tr><td colspan="3"><b>Se présenter, connaître les autres</b></td></tr>
<tr><td>Le cercle des prénoms accumulés</td><td>Mémoriser les prénoms</td><td>15 min</td></tr>
<tr><td>Des prénoms et des lettres</td><td>Se présenter par ses qualités</td><td>1 min par personne</td></tr>
<tr><td>Le blason</td><td>Exprimer ses motivations</td><td>1 min par personne</td></tr>
<tr><td>Tirons les ficelles</td><td>Motivations et prénoms, avec une pelote</td><td>10 min</td></tr>
<tr><td colspan="3"><b>Exprimer son ressenti</b></td></tr>
<tr><td>Bilan météo</td><td>Dire son état d'esprit d'un geste</td><td>2 à 10 min</td></tr>
<tr><td>Tête, main, cœur</td><td>Ce que j'ai appris, ressenti, ce que je vais faire</td><td>5 min</td></tr>
<tr><td>Ma place dans mes groupes</td><td>Identifier ses groupes d'appartenance</td><td>15 min</td></tr>
<tr><td>Photolangage</td><td>Exprimer ses représentations</td><td>40 à 60 min</td></tr>
<tr><td colspan="3"><b>Débattre, argumenter</b></td></tr>
<tr><td>Débat des 4 coins</td><td>Se positionner et justifier</td><td>5 min par question</td></tr>
<tr><td>Brainstorming</td><td>Produire un maximum d'idées</td><td>Variable</td></tr>
<tr><td>Banque de questions</td><td>Approfondir une situation</td><td>30 à 45 min</td></tr>
<tr><td>Théâtre forum</td><td>Chercher des solutions en rejouant une scène</td><td>60 min</td></tr>
</tbody></table></div>
<h2>Cadre de sécurité de toute séance</h2>
<ul>
<li>On ne juge pas ; personne n'est interrompu ; pas de moquerie ni de propos injurieux.</li>
<li>Tout le monde peut prendre la parole, personne n'y est obligé.</li>
<li>Ce qui est dit pendant l'atelier, surtout sur la vie privée, n'est pas répété.</li>
</ul>`,
tools:["t-anim","t-fiches-amb","t-scenettes"], links:[["Approfondissement","Répertoire d'activités brise-glace (CEDIP)","http://www.cedip.developpement-durable.gouv.fr/IMG/pdf/repertoire_dactivites_brise-glace_cle0a2d4a.pdf"]], see:["f1","f4","p2"]},

f4:{rub:"former", n:"7.6", t:"Comment préparer la formation des ambassadeurs ?", s:"La formation est obligatoire et suit les trois modules du guide ministériel. L'adulte qui l'anime prépare chaque séquence, garde une posture neutre et ne présente aucune typologie de victimes ou d'auteurs.", pub:["Formateurs","Vie scolaire"], src:"Guide des ambassadeurs pHARe (ministère, 2021)",
body:`
<h2>Préparer</h2>
<ul>
<li>Lire le guide et les fiches d'activités ; choisir les vidéos et vérifier qu'elles sont accessibles.</li>
<li>Analyser les modules avec la grille d'analyse (version vierge et corrigé).</li>
<li>Prévoir un module commun avec les délégués de classe : il clarifie le rôle de chacun.</li>
</ul>
<h2>Le code d'honneur des séances</h2>
<ol>
<li>On ne juge pas son camarade.</li>
<li>Chacun formule ses impressions et ses questions sans être interrompu.</li>
<li>On respecte les limites de la liberté d'expression : pas d'injure, pas de moquerie.</li>
<li>On écoute : tout le monde doit pouvoir parler.</li>
<li>On ne répète pas ce qui a été dit, en particulier sur la vie privée.</li>
</ol>
<h2>Pendant le module 2</h2>
<p>Les animateurs consignent les observations des élèves dans un tableau en cinq colonnes : les faits, la durée, les caractéristiques supposées de la victime, celles des auteurs, les conséquences. Les séquences suivantes s'appuient sur ce tableau. On s'en tient aux faits, sans posture morale.</p>
<h2>Adapter</h2>
<ul>
<li><b>Premier degré</b> : séances courtes, beaucoup de jeu (émotions, vrai/faux, jeu de rôle), charte de classe.</li>
<li><b>Lycée</b> : davantage d'autonomie, participation à la formation des collégiens.</li>
</ul>`,
tools:["t-livret-amb","t-pres-amb","t-fiches-amb","t-amb1d","t-anim"], see:["p4","f3","f1"]},

f7:{rub:"former", n:"7.7", t:"Comment assurer le transfert après la formation ?", s:"Une formation utile se termine par des décisions réalistes et un suivi. Chaque équipe repart avec peu de priorités, des responsables identifiés et une première date de revue à 90 jours.", pub:["Formateurs","Direction","Équipe ressource"], src:"Ingénierie de formation proposée à partir du corpus",
body:`
<h2>Les cinq productions minimales</h2>
<ul class="check"><li><label><input type="checkbox" id="tr1"><span><b>Une lecture partagée du climat scolaire</b> à partir des 7 facteurs.</span></label></li><li><label><input type="checkbox" id="tr2"><span><b>Une carte des lieux et temps sensibles</b>, construite avec la vie scolaire et les élèves.</span></label></li><li><label><input type="checkbox" id="tr3"><span><b>Un parcours de prévention</b> : CPS + 10 h + temps forts, adapté aux niveaux.</span></label></li><li><label><input type="checkbox" id="tr4"><span><b>Un protocole de traitement lisible</b> : signalement, protection, équipe ressource, MPP si adaptée, familles, suivi.</span></label></li><li><label><input type="checkbox" id="tr5"><span><b>Deux ou trois priorités à 90 jours</b> avec un responsable et un indicateur.</span></label></li></ul>
<h2>Le rendez-vous de suivi</h2><p>Programmer dès la fin de la formation un retour à 6–12 semaines : ce qui a été réellement mis en œuvre, ce qui a bloqué, les effets observés, et l'ajustement à décider. Sans ce rendez-vous, le plan d'action risque de rester déclaratif.</p>
<div class="note"><b>Conseil au formateur</b>Ne terminez pas sur « des idées ». Faites formuler une première action réalisable dans les quinze jours, une personne responsable et une preuve simple que l'action a commencé.</div>`,
tools:["t-plan90","t-cs360","t-elcs"], see:["r4","pi4","pi5","f1","f8"]},

f8:{rub:"former", n:"7.8", t:"Fiches d'activités prêtes à animer", s:"Vingt-deux activités tirées des déroulés de formation, avec leurs consignes, leurs durées et leurs documents : brise-glace, analyse de situations, photolangage, World Café, signaux faibles, MPP ou pas MPP, micro-scénettes, ambassadeurs, mise en œuvre de pHARe, bilans.", pub:["Formateurs"], src:"Déroulés Modulo des AFE de Sofia (mars 2026) et de Milan (janvier 2026)",
body:`
<p>Ces fiches reprennent les activités des déroulés de formation des AFE de Sofia (30–31 mars 2026) et de Milan (12–13 janvier 2026), avec leurs consignes, leurs durées et leurs documents. Elles complètent la liste des ateliers (<a href="#f2">7.3</a>) et les techniques d'animation (<a href="#f3">7.5</a>).</p>
<h2>Le déroulé de référence sur deux jours</h2>
