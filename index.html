<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Repères, méthodes et outils sur le climat scolaire et le programme pHARe pour les personnels du réseau AEFE. Fehmi Klabi, IRF Europe du Sud-Est.">
<style>*{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Climat scolaire &amp; pHARe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page : barre haute fixe (nom, recherche, urgence) · menu des 7 rubriques à gauche · colonne de lecture de 46rem. Le phare : un bleu ardoise calme, un faisceau ambré rare, un rouge réservé à l'urgence. */
:root{
  --ground:#F4F7F8; --surface:#FFFFFF; --ink:#14212A; --muted:#51626D; --line:#D7E0E5;
  --accent:#1C5B72; --accent-ink:#FFFFFF; --accent-soft:#E2EEF2;
  --beam:#D9981F; --beam-soft:#FBF1DC;
  --alert:#B3262B; --alert-soft:#FBE8E8; --ok:#2C7656; --ok-soft:#E3F2EA;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-xs:.8125rem; --s-sm:.9375rem; --s-md:1.0625rem; --s-lg:1.3rem; --s-xl:1.75rem; --s-2xl:2.35rem;
  --radius:10px; --bar:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E161B; --surface:#15212A; --ink:#E5EDF1; --muted:#9BAAB4; --line:#283843;
  --accent:#7DB7CB; --accent-ink:#0E161B; --accent-soft:#1A323E;
  --beam:#E8B44A; --beam-soft:#33290F;
  --alert:#F07B7E; --alert-soft:#3B1C1F; --ok:#6CC59B; --ok-soft:#16302A; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0E161B; --surface:#15212A; --ink:#E5EDF1; --muted:#9BAAB4; --line:#283843;
  --accent:#7DB7CB; --accent-ink:#0E161B; --accent-soft:#1A323E;
  --beam:#E8B44A; --beam-soft:#33290F;
  --alert:#F07B7E; --alert-soft:#3B1C1F; --ok:#6CC59B; --ok-soft:#16302A; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 16px)}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:var(--s-md);line-height:1.6}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--beam);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding-left:1.25rem}
li+li{margin-top:.3rem}
button{font:inherit;color:inherit}

/* Barre haute */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar);display:flex;align-items:center;gap:12px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:750;font-size:1.05rem;white-space:nowrap}
.brand span{font-size:var(--s-xs);color:var(--muted);white-space:nowrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;font:inherit;font-size:var(--s-sm);padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--ground);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:60vh;overflow:auto;padding:6px}
.results a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink)}
.results a:hover,.results a:focus{background:var(--accent-soft)}
.results small{display:block;color:var(--muted);font-size:var(--s-xs)}
.urg-btn{flex:none;display:flex;align-items:center;gap:8px;background:var(--alert);color:#fff;text-decoration:none;font-weight:700;font-size:var(--s-sm);padding:8px 14px;border-radius:999px}
:root[data-theme="dark"] .urg-btn{color:#1a0b0c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .urg-btn{color:#1a0b0c}}
.urg-btn .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* Grille */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 40px;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar));overflow:auto}
.side a{display:block;text-decoration:none;color:var(--ink);border-radius:6px;padding:5px 10px;font-size:var(--s-sm)}
.side a:hover{background:var(--ground)}
.side a.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
.side .home-link{font-weight:700;margin-bottom:6px}
.side .urg-link{color:var(--alert);font-weight:700;margin-bottom:10px}
.rub{margin-top:10px}
.rub summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:6px;font-family:var(--f-display);font-weight:650;font-size:.98rem}
.rub summary::-webkit-details-marker{display:none}
.rub summary:hover{background:var(--ground)}
.rub summary .n{font-family:var(--f-mono);font-size:var(--s-xs);color:var(--muted);min-width:1rem}
.rub.alert summary{color:var(--alert)}
.rub .pages{padding-left:18px;border-left:1px solid var(--line);margin-left:16px}
.rub .pages a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-right:6px}
.side .tail{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

main{padding-block:32px 80px;padding-inline:24px;min-width:0}
.col{max-width:46rem;margin-inline:auto}
.wide{max-width:64rem;margin-inline:auto}

/* Page */
.crumb{font-size:var(--s-xs);color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-family:var(--f-mono);letter-spacing:.02em}
.crumb a{color:var(--muted)}
.page h1{font-size:var(--s-2xl);font-weight:750;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-block;font-size:var(--s-xs);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.src{border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.short{margin-top:22px;padding:16px 18px;border-radius:var(--radius);background:var(--beam-soft);border-left:4px solid var(--beam)}
.short .lbl{display:block;font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:4px}
.body{margin-top:28px;display:grid;gap:18px}
.body h2{font-size:var(--s-lg);font-weight:650;margin-top:16px}
.body h3{font-size:1.05rem;font-weight:650;margin-top:6px;font-family:var(--f-body)}
.body p,.body li{max-width:65ch}
.vid{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vid video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.vid figcaption{display:flex;flex-direction:column;gap:2px;padding:10px 14px;font-size:var(--s-sm)}
.vid figcaption span{color:var(--muted)}
.vid figcaption a{font-size:var(--s-xs);margin-top:4px}
.vid-off{display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;text-align:center;aspect-ratio:16/9;background:var(--accent);color:var(--accent-ink);text-decoration:none;padding:20px}.vid-off b{font-size:1.2rem}.vid-off span{font-size:var(--s-sm);max-width:46ch;opacity:.9}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.vids .vid{margin:0}
.def{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:12px 0}
.def p{margin:6px 0}.def .who{font-size:var(--s-xs);color:var(--muted)}
.projbtn{float:right;margin-left:12px;font:inherit;font-size:var(--s-xs);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.projbtn:hover{background:var(--accent-soft)}
body.proj .bar,body.proj .side,body.proj .crumb,body.proj .tools,body.proj .section-lbl,body.proj .links,body.proj .see,body.proj .pn,body.proj .site-foot,body.proj footer{display:none!important}
body.proj .layout{display:block!important}
body.proj #main .page{max-width:1100px;margin:0 auto;font-size:1.28rem;line-height:1.55}
body.proj #main h1{font-size:2.4rem}
body.proj .projbtn{position:fixed;top:12px;right:16px;z-index:50;font-size:.9rem}
.fiches{display:flex;flex-direction:column;gap:8px}
.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.fiche>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;align-items:baseline}
.fiche>summary::-webkit-details-marker{display:none}
.fiche>summary:hover{background:var(--accent-soft);border-radius:var(--radius)}
.fiche .fnum{grid-row:span 2;font-family:var(--f-mono);font-size:.8rem;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 7px}
.fiche .ftit{font-weight:700}
.fiche .fmeta{font-size:var(--s-xs);color:var(--muted)}
.fiche[open]>summary{border-bottom:1px solid var(--line)}
.fiche .fbody{padding:4px 16px 14px;min-width:0}
.fiche .fbody>p,.fiche .fbody>ul,.fiche .fbody>ol,.fiche .fbody>.note,.fiche .fbody>.tbl{margin:10px 0}
.fiche .fsteps li{margin-bottom:6px}
.fiche .fdocs{font-size:var(--s-sm);border-top:1px dashed var(--line);padding-top:8px;margin-top:12px}
.fiche .fdocs b{margin-right:6px}
@media print{.fiche>summary{border-bottom:1px solid #999}.fiche .fbody{display:block}}
.note{padding:12px 16px;border-radius:var(--radius);background:var(--accent-soft);font-size:var(--s-sm)}
.warn{padding:12px 16px;border-radius:var(--radius);background:var(--alert-soft);font-size:var(--s-sm)}
.warn b,.note b{display:block;margin-bottom:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:var(--s-sm)}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-weight:700;background:var(--ground);font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.box h3{margin:0 0 6px}
.box.yes{border-top:3px solid var(--ok)}
.box.no{border-top:3px solid var(--alert)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
.steps>li{counter-increment:s;position:relative;padding:12px 14px 12px 52px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0}
.steps>li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.8rem;display:grid;place-items:center}
.quote{font-style:italic;color:var(--ink)}
.says{display:grid;gap:6px}
.says li{list-style:none;margin:0;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.says.ok li::before{content:"✓ ";color:var(--ok);font-weight:700;font-style:normal}
.says.ko li::before{content:"✗ ";color:var(--alert);font-weight:700;font-style:normal}
.says{padding:0}

/* Blocs de fin de page */
.section-lbl{font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:40px 0 10px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tool b{font-size:var(--s-sm);line-height:1.35}
.tool p{font-size:var(--s-xs);color:var(--muted)}
.tool .tlinks{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;font-size:var(--s-xs);font-weight:700}
.lvl{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:4px;background:var(--ground);color:var(--muted);align-self:flex-start}
.lvl.n1{background:var(--accent-soft);color:var(--ink)}
.links{list-style:none;padding:0;display:grid;gap:6px}
.links li{margin:0;font-size:var(--s-sm)}
.links .kind{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-right:6px;text-transform:uppercase}
.see{display:flex;flex-wrap:wrap;gap:8px}
.see a{text-decoration:none;font-size:var(--s-sm);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.see a:hover{border-color:var(--accent)}
.see a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-right:6px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.pn a{text-decoration:none;font-size:var(--s-sm);max-width:48%}
.pn small{display:block;color:var(--muted);font-size:var(--s-xs)}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:stretch}
.hero h1{font-size:clamp(2rem,4.2vw,3.1rem);font-weight:750;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin-top:14px;font-size:1.12rem;color:var(--muted);max-width:40ch}
.hero .scope{margin-top:14px;font-size:var(--s-sm);color:var(--muted)}
.urg-card{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:14px;background:var(--alert-soft);border:1px solid var(--alert);text-decoration:none;color:var(--ink)}
.urg-card .k{font-size:var(--s-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--alert)}
.urg-card h2{font-size:1.45rem}
.urg-card ol{font-size:var(--s-sm)}
.urg-card .go{margin-top:auto;font-weight:700;color:var(--alert)}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.door{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.door:hover{border-color:var(--accent)}
.door b{font-family:var(--f-display);font-weight:650;font-size:1.02rem;line-height:1.25}
.door span{font-size:var(--s-xs);color:var(--muted)}
.door.hot{border-color:var(--alert)}
.flow{display:flex;flex-wrap:wrap;gap:0;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.flow a{flex:1 1 8.5rem;display:flex;flex-direction:column;gap:2px;padding:10px 12px;text-decoration:none;color:var(--ink);border-radius:8px;position:relative}
.flow a:hover{background:var(--ground)}
.flow a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.flow a b{font-size:var(--s-sm)}
.flow a.prev b{color:var(--accent)}
.flow a.treat b{color:var(--alert)}
.flow-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--s-xs);color:var(--muted);margin-top:8px}
.flow-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.profiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.profiles button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:var(--s-sm)}
.profiles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plist{list-style:none;padding:0;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:8px}
.plist li{margin:0}
.plist a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:var(--s-sm)}
.plist a .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:2rem}
.h-sec{font-family:var(--f-display);font-size:var(--s-lg);font-weight:650;margin-top:44px}
.h-sub{font-size:var(--s-sm);color:var(--muted);margin-top:4px}

/* Outils interactifs */
.check{list-style:none;padding:0;display:grid;gap:8px}
.check li{margin:0}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok);flex:none}
.check label:has(input:checked){background:var(--ok-soft);border-color:var(--ok)}
.check b{display:block}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.tree .q{font-family:var(--f-display);font-size:1.15rem;font-weight:650}
.tree .hint{font-size:var(--s-sm);color:var(--muted);margin-top:4px}
.tree .act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:var(--s-sm)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.tree .path{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:var(--s-xs);color:var(--muted)}
.tree .res{padding:14px 16px;border-radius:var(--radius);margin-top:4px}
.tree .res.r-ok{background:var(--ok-soft)}
.tree .res.r-stop{background:var(--alert-soft)}
.tree .res.r-info{background:var(--accent-soft)}
.tree .res h3{margin:0 0 6px;font-family:var(--f-display)}
.form{display:grid;gap:14px}
.form label{display:block;font-weight:700;font-size:var(--s-sm)}
.form .help{font-weight:400;color:var(--muted);font-size:var(--s-xs);display:block;margin-top:2px}
.form textarea{width:100%;margin-top:6px;font:inherit;font-size:var(--s-sm);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:4.5rem;resize:vertical}
.form fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:12px;background:var(--surface);min-width:0}
.form legend{font-family:var(--f-display);font-weight:650;padding:0 6px}
.form fieldset.law{border-color:var(--beam);background:var(--beam-soft)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:var(--s-sm);z-index:50}
.filters{display:grid;gap:10px;margin-top:18px}
.filters .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .row span{font-size:var(--s-xs);color:var(--muted);min-width:4.5rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:var(--s-xs)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:var(--s-sm);color:var(--muted);margin-top:14px}
.tool .used{font-size:var(--s-xs);color:var(--muted)}
.tool .used a{color:var(--muted)}
footer{margin-top:60px;font-size:var(--s-xs);color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

@media (max-width:1000px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:block}
  .side{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(86vw,320px);height:auto;z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .brand span{display:none}
  main{padding-inline:16px}
}
@media (max-width:620px){
  .search{display:none}
  .search.show{display:block;position:absolute;left:12px;right:12px;top:calc(var(--bar) + 6px);max-width:none}
  .s-toggle{display:block!important}
  .urg-btn .t-long{display:none}
  .page h1{font-size:1.85rem}
  .doors{grid-template-columns:1fr}
  .brand{flex:1}
  .brand>span{min-width:0}
  .brand b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;display:block}
  .s-toggle{margin-left:0}
}
.urg-btn .t-short{display:none}
@media (max-width:620px){.urg-btn .t-short{display:inline}}
main:focus{outline:none}
.s-toggle{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;cursor:pointer;margin-left:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* V4 · enrichissements formation et aperçu des ressources */
.pathway{display:grid;gap:10px}
.pathstep{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.pathstep .pnumb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.78rem;font-weight:700}
.pathstep h3{font-family:var(--f-display);font-size:1.02rem;margin:0 0 3px}
.pathstep p{font-size:var(--s-sm);color:var(--muted)}
.format-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:10px}
.format-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);padding:14px 16px}
.format-card b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.format-card span{font-size:var(--s-xs);color:var(--muted)}
.pdf-btn{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;font-size:var(--s-xs);font-weight:700;color:var(--accent)}
.pdf-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logos img{display:block;height:64px;width:auto;border-radius:8px}
.logos .chip-w{background:#fff;padding:6px 8px;border-radius:8px;border:1px solid var(--line)}
.logos .chip-w img{height:52px;border-radius:0}
.inst{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.inst .who{font-size:var(--s-sm);color:var(--muted);line-height:1.45}
.inst .who b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.08rem}
@media (max-width:620px){.logos img{height:46px}.logos .chip-w img{height:36px}}
.brand img{height:36px;width:auto;border-radius:6px;display:block;flex:none}
footer .logos img{height:40px}
footer .logos .chip-w img{height:32px}
footer .credit{margin-top:10px;color:var(--ink)}
.pdf-note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;font-size:var(--s-xs);color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.pdf-modal{position:fixed;inset:0;z-index:80;background:rgba(7,16,22,.72);display:grid;place-items:center;padding:24px}
.pdf-modal[hidden]{display:none}
.pdf-dialog{width:min(1100px,96vw);height:min(88vh,900px);display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.35)}
.pdf-head{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pdf-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-head button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.pdf-frame{border:0;width:100%;height:100%;background:var(--ground)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:var(--s-xs);padding:3px 8px;border-radius:999px;background:var(--accent-soft);border:1px solid transparent}
@media (max-width:620px){.pdf-modal{padding:0}.pdf-dialog{width:100vw;height:100vh;border-radius:0}}
</style>
</head>

urgence:{rub:null, t:"Une situation vient de m'être signalée", s:"Vous n'avez ni à qualifier les faits ni à régler la situation seul. Votre rôle : accueillir la parole, garder une trace écrite et transmettre le jour même à la direction ou au coordonnateur pHARe.", pub:["Tous les personnels"], src:"Protocole national 2023 ; méthode de préoccupation partagée (Centre RéSIS)",
body:`
<h2>Les 5 premiers gestes</h2>
<ul class="check" id="urgCheck">
<li><label><input type="checkbox" id="u1"><span><b>Écouter sans minimiser.</b> Prenez le temps, au calme. Ne mettez pas sa parole en doute. Ne parlez pas de « querelles d'enfants ».</span></label></li>
<li><label><input type="checkbox" id="u2"><span><b>Rassurer sans promettre.</b> Dites-lui qu'il a bien fait de parler et que ce qui lui arrive n'est pas de sa faute. Ne promettez ni le secret absolu ni une punition.</span></label></li>
<li><label><input type="checkbox" id="u3"><span><b>Noter les faits.</b> Avec ses mots : quoi, qui, où, depuis quand, à quelle fréquence. Datez. La première personne informée rédige ce résumé.</span></label></li>
<li><label><input type="checkbox" id="u4"><span><b>Transmettre le jour même</b> au chef d'établissement, au directeur d'école ou au coordonnateur de l'équipe ressource, selon le protocole de votre établissement.</span></label></li>
<li><label><input type="checkbox" id="u5"><span><b>Ne pas agir seul.</b> Ne confrontez pas les élèves entre eux et ne convoquez pas les élèves mis en cause. L'équipe ressource prend le relais.</span></label></li>
</ul>
<div class="warn"><b>Si l'élève est en danger</b>Violence physique grave, violence à caractère sexuel, menace, propos inquiétants sur lui-même : ne le laissez pas seul, alertez immédiatement la direction et les personnels de santé, puis appliquez la procédure d'urgence prévue par le protocole de votre établissement, y compris le recours aux autorités du pays d'accueil.</div>
<h2>Ce que vous pouvez dire</h2>
<ul class="says ok">
<li class="quote">Tu as bien fait d'en parler, même si c'était difficile.</li>
<li class="quote">Ce qui t'arrive n'est pas de ta faute.</li>
<li class="quote">Je vais en parler à des collègues qui vont m'aider à réfléchir, et je reviens vers toi.</li>
<li class="quote">Qu'est-ce que tu ne voudrais surtout pas que l'on fasse ?</li>
</ul>
<h2>Ce qu'il vaut mieux éviter</h2>
<ul class="says ko">
<li class="quote">Ne t'inquiète pas, ça va s'arranger.</li>
<li class="quote">On va le punir, il va arrêter.</li>
<li class="quote">Tu n'as qu'à l'ignorer, ou lui répondre.</li>
<li class="quote">Pourquoi tu n'en as pas parlé avant ?</li>
</ul>
<p>Une punition seule ne garantit pas l'arrêt des brimades et peut les déplacer hors de la vue des adultes. Un conseil que l'élève ne peut pas suivre le renvoie à sa solitude.</p>
<h2>En cas de cyberharcèlement</h2>
<ul>
<li>Conseiller à l'élève de ne pas répondre et de ne pas supprimer : faire des captures d'écran datées.</li>
<li>Ne pas diffuser soi-même les contenus, même pour alerter.</li>
<li>Transmettre comme pour toute autre situation ; l'équipe ressource informe la famille des démarches de signalement auprès des plateformes.</li>
</ul>`,
tools:["t-premiers","t-circuit","t-cyber"], see:["g1","g2","g3","g4"]},

// ===== 1. COMPRENDRE =====
c1:{rub:"comprendre", n:"1.1", t:"Qu'est-ce que le climat scolaire ?", s:"Le climat scolaire est la qualité du vécu quotidien dans l'établissement, pour les élèves comme pour les adultes. Il ne se décrète pas : il se construit par des pratiques partagées, sur lesquelles on peut agir.", pub:["Tous"], src:"Guide DGESCO « Agir sur le climat scolaire » ; mémo climat scolaire 2018",
body:`
<p>Le climat scolaire concerne toute la communauté éducative. Il renvoie au contexte d'apprentissage et de vie, et à la construction du bien vivre et du bien-être, pour les élèves et pour les personnels. Il repose sur un sentiment de sécurité, mais ce qui compte surtout, ce sont l'engagement, la motivation et le plaisir d'apprendre et de travailler ensemble.</p>
<p>C'est une expérience subjective et collective : elle reflète le jugement que les élèves, les parents et les personnels portent sur leur vie dans l'établissement. Elle se mesure (voir <a href="#r3">Diagnostiquer le climat</a>) plutôt qu'elle ne se suppose.</p>
<h2>Cinq dimensions</h2>
<div class="tbl"><table><thead><tr><th>Dimension</th><th>La question qu'elle pose</th></tr></thead><tbody>
<tr><td><b>Relationnelle</b></td><td>Les relations entre élèves, entre adultes, entre élèves et adultes sont-elles respectueuses ?</td></tr>
<tr><td><b>Sécurité</b></td><td>Chacun se sent-il en sécurité, physiquement et psychologiquement, dans tous les lieux et à tous les moments ?</td></tr>
<tr><td><b>Éducative</b></td><td>Les conditions d'enseignement et d'apprentissage permettent-elles à chacun de progresser ?</td></tr>
<tr><td><b>Justice</b></td><td>Les règles sont-elles claires, expliquées et appliquées de la même manière par tous les adultes ?</td></tr>
<tr><td><b>Appartenance</b></td><td>Les élèves et les personnels se sentent-ils membres de la communauté ?</td></tr>
</tbody></table></div>
<h2>Sept facteurs sur lesquels agir</h2>
<p>Formulation d'éduscol, mise à jour en février 2026 :</p>
<ol>
<li>Les stratégies collectives : une culture commune et des adultes cohérents.</li>
<li>Les pratiques pédagogiques et la relation éducative.</li>
<li>La qualité de vie à l'école : les temps et les espaces.</li>
<li>La coéducation avec les familles.</li>
<li>L'environnement partenarial.</li>
<li>La justice scolaire : des règles explicites, appliquées avec équité.</li>
<li>La prévention et la gestion des violences et du harcèlement.</li>
</ol>
<p>Ces facteurs sont interdépendants : agir sur le climat, c'est agir sur l'ensemble de l'organisation, en combinant plusieurs leviers. Plus que des actions exceptionnelles, ce sont des pratiques quotidiennes qui font la différence. Le détail des leviers est dans <a href="#p1">Agir sur le climat au quotidien</a>.</p>
<div class="note"><b>Aller plus loin</b>La définition de référence, l'origine du concept et ce que le climat scolaire n'est pas : <a href="#c7">1.7</a>. La justice scolaire : <a href="#c8">1.8</a>.</div>
<h2>Pourquoi c'est une priorité</h2>
<p>La recherche établit le lien entre climat scolaire, qualité des apprentissages et victimation. Un climat positif s'accompagne de meilleurs résultats scolaires, d'un bien-être accru des élèves et des adultes, d'une diminution du harcèlement et des problèmes de discipline, de moindres inégalités, d'équipes plus stables, et d'une baisse de l'absentéisme et du décrochage.</p>
<div class="note"><b>Climat scolaire et pHARe</b>Le programme pHARe n'est pas un dispositif isolé : c'est le volet « harcèlement » d'une politique d'amélioration du climat scolaire. Son niveau de labellisation le plus élevé consiste précisément à s'engager dans un processus d'amélioration du climat scolaire.</div>`,
tools:["t-memo","t-guide-cs","t-fiches-edu","t-cs-eduscol"], links:[CT("a/34104/le-bien-etre-a-lecole","Le bien-être à l'école")], see:["c7","c8","c4","c5","p1","r3","pi1"]},

c2:{rub:"comprendre", n:"1.2", t:"Qu'est-ce que le harcèlement scolaire ?", s:"Le harcèlement est une violence répétée, verbale, physique ou psychologique, exercée par un ou plusieurs élèves sur un élève qui ne peut pas se défendre dans ce contexte. Trois critères : la répétition, la durée, la disproportion des forces.", pub:["Tous"], src:"Protocole national 2023 ; guide des ambassadeurs pHARe 2021",
body:`
<h2>Définition</h2>
<p>Au sein d'un groupe d'élèves, le harcèlement est une violence répétitive physique, verbale ou psychologique perpétrée, sur la durée, par un ou plusieurs auteurs à l'encontre d'un élève qui est dans l'incapacité de se défendre dans ce contexte précis.</p>
<p>Cumulés et répétés, des faits qui passent souvent inaperçus des adultes peuvent avoir des conséquences d'une particulière gravité. C'est pourquoi une situation signalée n'est jamais minimisée, même lorsqu'elle est difficile à qualifier.</p>
<div class="note"><b>Aller plus loin</b>Les définitions de la recherche, du programme pHARe et du droit (dont le délit de harcèlement scolaire) sont détaillées en <a href="#c6">1.6</a>.</div>
<h2>Trois critères pour le reconnaître</h2>
<div class="two">
<div class="box"><h3>Répétition</h3><p>Les faits reviennent : moqueries quotidiennes, surnoms, bousculades, messages.</p></div>
<div class="box"><h3>Durée</h3><p>Ils s'installent dans le temps, parfois sur plusieurs mois ou plusieurs années.</p></div>
<div class="box"><h3>Disproportion</h3><p>Un groupe contre un, un élève plus âgé ou « populaire » : la cible ne peut pas se défendre seule.</p></div>
</div>
<h2>Conflit, violence ou harcèlement ?</h2>
<div class="tbl"><table><thead><tr><th></th><th>Conflit</th><th>Violence ponctuelle</th><th>Harcèlement</th></tr></thead><tbody>
<tr><td><b>Relation</b></td><td>Entre égaux, chacun peut se défendre</td><td>Un acte, un moment</td><td>Déséquilibre installé</td></tr>
<tr><td><b>Fréquence</b></td><td>Ponctuel</td><td>Isolé</td><td>Répété, sur la durée</td></tr>
<tr><td><b>Réponse</b></td><td>Régulation, médiation possible</td><td>Réponse éducative ou disciplinaire</td><td>Protocole de l'établissement. Jamais de médiation entre la cible et l'auteur.</td></tr>
</tbody></table></div>
<h2>Ses formes</h2>
<ul>
<li><b>Physique</b> : bousculades, coups, tapes répétées, gestes discrets dans les couloirs.</li>
<li><b>Verbale</b> : moqueries, surnoms, insultes, imitations.</li>
<li><b>Psychologique et relationnelle</b> : mise à l'écart, rumeurs, alternance entre inclusion et exclusion du groupe.</li>
<li><b>Matérielle</b> : vols, affaires cachées ou dégradées.</li>
<li><b>Cyberharcèlement</b> : messages, exclusion des groupes de discussion, diffusion de photos, commentaires.</li>
</ul>
<p>Le harcèlement peut avoir lieu partout où les élèves se retrouvent : dans l'établissement, à la cantine, sur le chemin de l'école, dans les transports, sur les réseaux sociaux, les plateformes de jeux en ligne et les messageries.</p>
<h2>La spécificité du cyberharcèlement</h2>
<p>Il se poursuit hors de l'établissement et le soir, touche une audience plus large et laisse des traces numériques. Un message ou une photo partagés une seule fois peuvent être relayés indéfiniment. Supprimer un message ne supprime pas la douleur.</p>
<h2>Vérifier sa compréhension : conflit ou harcèlement ?</h2>
<p>Dix situations courtes, inspirées des cas travaillés en formation. Classez chacune, puis lisez la correction.</p>
<div id="quiz" class="tree"></div>`,
tools:["t-amb1d","t-harcelometre","t-violento"], links:[["Vidéo","Lutter contre le harcèlement : un enjeu pour toute la communauté éducative (CanoTech)","https://www.canotech.fr/a/31383/lutter-contre-le-harcelement-un-enjeu-pour-toute-la-communaute-educative"],["Vidéo","Le témoignage de Pierre, élève de 6e (Bellon, Gardette)","https://www.youtube.com/watch?v=QlxgmIxrexk"],["Source","Portail Non au harcèlement",NAH]], see:["c6","c3","r1","urgence"]},

c3:{rub:"comprendre", n:"1.3", t:"Pourquoi le harcèlement dure-t-il ?", s:"Le harcèlement entre élèves est une relation à trois : la cible, le ou les auteurs, et les pairs qui regardent. Il dure parce que la cible se tait, que les témoins ne savent pas quoi faire et que les adultes ne voient pas. Le groupe a le pouvoir de l'arrêter.", pub:["Enseignants","Vie scolaire","Équipe ressource"], src:"Guide des ambassadeurs pHARe 2021, module 2",
body:`
<h2>Six mécanismes qui entretiennent la situation</h2>
<ol>
<li><b>L'enfermement de la cible</b> : peur des représailles, honte de ne pas réussir à se défendre, résignation.</li>
<li><b>La loi du silence</b> : tout le monde voit, personne ne parle, par crainte de passer pour une « balance ».</li>
<li><b>La furtivité</b> : les actes sont visibles des élèves et cachés aux adultes, au moment où le professeur écrit au tableau, dans la cour, dans les couloirs.</li>
<li><b>L'indécision des pairs</b> : mal à l'aise, ils attendent un signal de détresse qui ne vient pas.</li>
<li><b>Le rôle du rire</b> : « rire avec » rassemble, « rire sur » exclut. La cible rit parfois elle-même pour ne pas perdre la face.</li>
<li><b>La relation triangulaire</b> : contrairement au harcèlement entre adultes, ce n'est pas un face-à-face. Chacun, volontairement ou non, joue un rôle.</li>
</ol>
<h2>Les trois acteurs</h2>
<div class="two">
<div class="box"><h3>La cible</h3><p>Il n'y a pas de profil type : une petite différence suffit de prétexte. Le contexte compte plus que le profil : arrivée en cours d'année, transitions entre école, collège et lycée. Le seul point commun est l'isolement, à la fois cause et conséquence.</p></div>
<div class="box"><h3>L'auteur</h3><p>Il est préoccupé par sa place dans le groupe et cherche à renforcer sa popularité. Il ne mesure pas ce que ressent la cible. Il va souvent mal lui-même et devient prisonnier de son personnage.</p></div>
<div class="box"><h3>Les pairs</h3><p>Sans public, pas de harcèlement. Quelques-uns soutiennent l'auteur, quelques-uns voudraient aider, la majorité ne se détermine pas. Ce sont eux qui peuvent faire basculer la situation.</p></div>
</div>
<h2>Le « motif » : une inversion de la faute</h2>
<p>L'auteur invoque toujours une raison : la cible serait « trop » ou « pas assez ». Ce motif sert à rendre la cible responsable de ce qu'elle subit. Il ne faut jamais le reprendre à son compte.</p>
<h2>Des conséquences pour tous</h2>
<div class="tbl"><table><thead><tr><th>Pour qui</th><th>Conséquences</th></tr></thead><tbody>
<tr><td><b>La cible, comme élève</b></td><td>Sentiment d'insécurité, absentéisme, baisse des résultats, changement d'établissement, rupture scolaire.</td></tr>
<tr><td><b>La cible, comme personne</b></td><td>Isolement, perte de confiance en soi et dans les autres, stress, angoisse, état dépressif, conduites agressives envers soi ou les autres.</td></tr>
<tr><td><b>Le groupe</b></td><td>Méfiance, clans, peur du regard des autres, prise de parole difficile, rejet de la moindre différence.</td></tr>
<tr><td><b>L'auteur</b></td><td>Sentiment d'impunité, surenchère vers la violence, illusion de popularité, sanctions.</td></tr>
</tbody></table></div>
<div class="note"><b>Vigilance</b>Les typologies cliniques de victimes ou d'auteurs, comme le triangle de Karpman, peuvent éclairer les adultes formés. Elles ne doivent pas être transmises aux élèves : mal comprises, elles laissent croire à une responsabilité de la cible.</div>`,
tools:["t-livret-amb","t-karpman"], links:[["Vidéo","« Les injures », campagne ministérielle","https://www.youtube.com/watch?v=kTJoyhprYWc"],["Vidéo","« Stop », collège Aimé Césaire, prix Non au harcèlement 2018","https://www.youtube.com/watch?v=N5JHoDn1cPA"],["Vidéo","Nino Arial, sur le rôle du témoin","https://www.youtube.com/watch?v=tt21y7fHmdE"]], see:["c2","p4","p2"]},

c4:{rub:"comprendre", n:"1.4", t:"Quels facteurs de risque et de protection ?", s:"Le harcèlement prospère là où les règles sont floues ou appliquées inégalement, où les adultes sont absents et isolés, et aux moments de transition. Des règles justes, des adultes présents et une équipe cohérente protègent.", pub:["Direction","Équipe ressource"], src:"Guide DGESCO « Agir sur le climat scolaire », tableau des facteurs",
body:`
<div class="tbl"><table><thead><tr><th>Facteurs de risque</th><th>Facteurs de protection</th></tr></thead><tbody>
<tr><td>Absence de règlement clair, ou règlement réduit à une liste d'interdits</td><td>Règles explicites et expliquées, avec quelques interdits clairs, des obligations et des droits</td></tr>
<tr><td>Punitions arbitraires, différentes selon l'adulte, punitions collectives</td><td>Règles appliquées de façon équitable, contradictoire possible, réponses éducatives adaptées</td></tr>
<tr><td>Laisser-faire, banalisation des passages à l'acte</td><td>Autorité assumée : chaque transgression reçoit une réponse</td></tr>
<tr><td>Lieux propices aux comportements perturbateurs, temps libres sans adultes</td><td>Présence d'adultes dans tous les lieux, surtout pendant les temps non encadrés</td></tr>
<tr><td>Locaux bruyants, dégradés, sales ; intimité des élèves non respectée</td><td>Locaux propres, accueillants, lieux d'apaisement ; dégradations réparées vite</td></tr>
<tr><td>Équipe instable, enseignant isolé, mauvaise ambiance entre adultes</td><td>Équipe cohérente, régulation des tensions, espaces d'analyse des pratiques</td></tr>
<tr><td>Climat décrit à partir de rumeurs et de ressentis</td><td>Mesure des phénomènes de violence ; analyse après chaque situation de crise</td></tr>
<tr><td>Discours négatif sur les familles, absence d'information</td><td>Familles considérées comme co-éducatrices, accueillies et informées</td></tr>
</tbody></table></div>
<h2>Moments et lieux à surveiller</h2>
<ul>
<li>Les transitions : entrée au collège, entrée au lycée, arrivée d'un élève en cours d'année dans un groupe déjà constitué.</li>
<li>Les lieux sans adulte : cour, couloirs, toilettes, cantine, transports, abords de l'établissement.</li>
<li>Les changements de salle et d'intercours, où des gestes rapides passent inaperçus.</li>
<li>Les groupes de discussion en ligne de la classe.</li>
</ul>
<p>L'injustice ressentie dans l'application des règles est l'un des facteurs qui expliquent le mieux l'augmentation de la victimation. La justice scolaire est donc un levier de prévention du harcèlement, et pas seulement une question de discipline.</p>`,
tools:["t-guide-cs","t-15sit"], see:["c1","p1","r1"]},


c5:{rub:"comprendre", n:"1.5", t:"Pourquoi adopter une approche globale du climat scolaire ?", s:"Aucune action isolée ne suffit. Une politique efficace aligne les pratiques de classe, la vie scolaire, les règles, les espaces, les familles, la participation des élèves, les partenariats, les mécanismes de signalement et l'évaluation.", pub:["Tous","Direction","Formateurs"], src:"Éduscol, climat scolaire 2026 ; UNESCO, whole-education approach",
body:`
<p>Le climat scolaire n'est pas un programme supplémentaire : c'est une manière de lire l'ensemble du fonctionnement de l'école ou de l'établissement. L'approche internationale dite <i>whole-school</i> ou <i>whole-education</i> rejoint très largement les sept facteurs utilisés par Éduscol.</p>
<h2>Neuf composantes à faire fonctionner ensemble</h2>
<div class="tbl"><table><thead><tr><th>Composante</th><th>Traduction concrète dans l'établissement</th></tr></thead><tbody>
<tr><td><b>1. Pilotage et cadre</b></td><td>Une politique explicite, des responsabilités connues, un protocole partagé.</td></tr>
<tr><td><b>2. Formation des adultes</b></td><td>Des personnels capables de prévenir, repérer, accueillir la parole et agir sans rester seuls.</td></tr>
<tr><td><b>3. Apprentissages</b></td><td>CPS, empathie, coopération, citoyenneté numérique, 10 heures pHARe.</td></tr>
<tr><td><b>4. Environnement sûr</b></td><td>Espaces, temps interstitiels, présence adulte, qualité de vie et sentiment de sécurité.</td></tr>
<tr><td><b>5. Signalement et soutien</b></td><td>Des canaux simples, connus des élèves, et un traitement rapide jusqu'à résolution.</td></tr>
<tr><td><b>6. Familles</b></td><td>Coéducation, information en amont et association pendant les situations.</td></tr>
<tr><td><b>7. Participation des élèves</b></td><td>Conseils, délégués, CVC/CVL, ambassadeurs, projets et pouvoir d'agir.</td></tr>
<tr><td><b>8. Partenariats</b></td><td>Santé, protection de l'enfance, associations, acteurs locaux, selon le pays d'accueil.</td></tr>
<tr><td><b>9. Données et évaluation</b></td><td>ELCS, observations, indicateurs, retours d'expérience et réajustements.</td></tr>
</tbody></table></div>
<h2>Ce que cela change en formation</h2>
<ul><li>On ne commence pas par « le protocole harcèlement » : on construit d'abord une culture commune du climat scolaire.</li><li>On fait travailler ensemble enseignants, vie scolaire, direction, santé, premier et second degrés lorsque c'est possible.</li><li>On relie chaque activité à une décision professionnelle ou à une pratique observable.</li><li>On termine par des priorités réalistes et évaluables, pas par une liste d'intentions.</li></ul>
<div class="note"><b>Articulation avec pHARe</b>pHARe constitue le volet structuré de prévention et de traitement du harcèlement. Il est d'autant plus efficace qu'il est intégré à cette approche globale.</div>`,
tools:["t-cs-eduscol","t-whole","t-guide-cs","t-bienetre"], see:["c1","p1","r3","pi1","f1"]},

// ===== 2. PRÉVENIR =====
p1:{rub:"prevenir", n:"2.1", t:"Comment agir sur le climat au quotidien ?", s:"Sept leviers, travaillés ensemble et dans la durée. Les plus sensibles pour les élèves : des règles appliquées de la même manière par tous, des évaluations expliquées, des adultes qui répondent et qui ne rabaissent jamais.", pub:["Tous"], src:"Fiches éduscol « climat scolaire » ; guide DGESCO",
body:`
<p>Les leviers ci-dessous reprennent les sept facteurs du climat scolaire. Les exemples en italique viennent des situations analysées en formation ; ils montrent ce qu'un geste ordinaire produit sur un élève.</p>
<h2>1. La justice scolaire</h2>
<ul>
<li>Les mêmes règles, appliquées de la même manière par tous les adultes. <i>« On ne sait jamais à quoi s'attendre : ça dépend du prof, pas des règles. »</i></li>
<li>Toute punition est expliquée, proportionnée et en lien avec le manquement. L'élève peut s'exprimer.</li>
<li>La réparation et la responsabilisation sont privilégiées à la sanction répétée.</li>
</ul>
<h2>2. L'évaluation et la relation pédagogique</h2>
<ul>
<li>Des critères explicites et des copies annotées pour tous. <i>Lina reçoit « C'est insuffisant » quand d'autres ont des commentaires détaillés ; elle cesse de lever la main.</i></li>
<li>Jamais de remarque humiliante devant la classe. <i>« Tu n'as visiblement pas travaillé, comme d'habitude » : Mathis refuse désormais de passer au tableau.</i></li>
<li>Une demande de relecture est reçue, pas renvoyée à un « je connais ton niveau ».</li>
</ul>
<h2>3. La stratégie d'équipe</h2>
<ul>
<li>Accueillir les nouveaux personnels : projet, règlement, pratiques d'évaluation, personnes ressources.</li>
<li>Prévoir des temps réguliers d'échange et de retour d'expérience sur les micro-violences du quotidien.</li>
<li>Associer les personnels non enseignants (vie scolaire, cantine, entretien) au cadre commun.</li>
</ul>
<h2>4. L'organisation et la direction</h2>
<ul>
<li>Anticiper les changements et en expliquer les raisons. <i>Un message à 22 h 30 pour modifier les cours du lendemain, des groupes changés sans critères annoncés.</i></li>
<li>Répondre aux remontées des équipes, même pour dire qu'elles sont prises en compte.</li>
</ul>
<h2>5. La coopération entre élèves</h2>
<ul>
<li>Groupes hétérogènes, tutorat, projets communs, jeux coopératifs.</li>
<li>Instances d'élèves : délégués, conseils de vie collégienne et lycéenne, conseil d'élèves au primaire.</li>
<li>Règles de vie construites et réinterrogées avec les élèves.</li>
</ul>
<h2>6. La qualité de vie : le temps et l'espace</h2>
<ul>
<li>Des adultes présents dans tous les lieux, des récréations organisées, des lieux de calme.</li>
<li>Des locaux propres, des toilettes respectueuses de l'intimité, des dégradations réparées rapidement.</li>
<li>Des travaux d'élèves affichés, des règles de vie illustrées par les élèves.</li>
</ul>
<h2>7. Les familles et les partenaires</h2>
<p>Voir <a href="#co1">Communiquer avec les familles</a>. Les partenaires extérieurs interviennent en complément de l'équipe, dans le cadre du projet d'établissement et des règles du pays d'accueil.</p>
<p>La prévention des violences et du harcèlement, septième levier, fait l'objet des pages <a href="#p3">Les 10 heures</a>, <a href="#p4">Les ambassadeurs</a> et <a href="#p5">Les temps forts</a>.</p>`,
tools:["t-fiches-edu","t-15sit","t-guide-cs","t-cs-eduscol"], see:["c1","c4","p2","p6","co1"]},

p2:{rub:"prevenir", n:"2.2", t:"Quels gestes professionnels en classe ?", s:"La classe protège quand chacun peut s'y tromper sans être moqué. Les gestes qui comptent : ne jamais humilier, faire de l'erreur une étape, sécuriser la prise de parole et travailler l'empathie et la coopération.", pub:["Enseignants","1er degré"], src:"Guide DGESCO (empathie, médiation, coopération) ; guide des ambassadeurs, module 2",
body:`
<h2>Sécuriser la prise de parole</h2>
<ul>
<li>Poser une règle simple : on ne se moque pas d'une réponse. Intervenir dès les premiers rires collectifs.</li>
<li>Faire de l'erreur une étape de l'apprentissage, explicitement et pour tous.</li>
<li>Valoriser la parole des élèves qui parlent peu.</li>
</ul>
<h2>« Rire avec » ou « rire sur »</h2>
<p>Le rire peut rassembler ou exclure. Une question simple aide les élèves à faire la différence : « Est-ce que j'aimerais que ces propos soient tenus sur moi ? ». Il ne s'agit pas d'interdire l'humour, mais de nommer le rire qui blesse.</p>
<h2>Développer les compétences psychosociales</h2>
<ul>
<li><b>Reconnaître et nommer ses émotions</b> : météo du jour, mots des émotions, retour en fin d'activité.</li>
<li><b>Se mettre à la place de l'autre</b> : jeux de rôle, théâtre forum, débats réglés.</li>
<li><b>Exprimer un désaccord sans violence</b> : messages clairs, régulation des conflits entre égaux.</li>
<li><b>Coopérer</b> : tâches où chacun dépend des autres.</li>
</ul>
<div class="box"><h3>Exemple : le jeu des mousquetaires (7 à 9 ans)</h3><p>Des équipes de quatre tiennent chacune une position difficile ; un « joker » peut remplacer celui qui va lâcher. Chacun doit observer les visages et les signes de fatigue de ses partenaires. Après chaque manche, les élèves mettent des mots sur ce qu'ils ont ressenti et perçu chez les autres.</p></div>
<h2>Médiation entre pairs : pour les conflits, pas pour le harcèlement</h2>
<p>La <a href="${MEDIATION}" target="_blank" rel="noopener">fiche éduscol sur la médiation par les pairs</a> la présente comme un outil de gestion constructive des conflits. Elle aide à résoudre des conflits entre élèves qui sont à égalité. Elle n'est jamais utilisée pour une situation de harcèlement, où le rapport de force est déséquilibré : la cible n'a pas à « négocier » avec son auteur.</p>
<h2>Une règle de sécurité pour toute séance sur le harcèlement</h2>
<div class="warn"><b>À dire en fin de séance</b>« Si cette activité vous a rappelé quelque chose de personnel, vous pouvez venir me parler en privé. » Ne demandez jamais devant la classe : « Qui a déjà été harcelé ? »</div>`,
tools:["t-amb1d","t-anim","t-10h","t-kits","t-fiches-edu"], see:["p3","c3","g1"]},

p3:{rub:"prevenir", n:"2.6", t:"Comment construire les 10 heures d'apprentissage ?", s:"Le programme pHARe prévoit 10 heures annuelles de prévention du harcèlement et de développement des compétences psychosociales pour les élèves, du CP à la terminale, réparties sur l'année et intégrées au temps scolaire.", pub:["Enseignants","1er degré","Direction"], src:"Programme pHARe en 4 pages (2023)",
body:`
<h2>Le principe</h2>
<ul>
<li>10 heures par an et par niveau, du CP à la terminale.</li>
<li>Dans le temps scolaire : heures de vie de classe, enseignement moral et civique, enseignements disciplinaires, projets.</li>
<li>Organisées par une équipe : chaque classe sait qui assure quelles séances, et à quel moment.</li>
</ul>
<div class="note"><b>À corriger dans certains supports</b>Un support de formation présente les 10 heures comme des heures « supplémentaires, en dehors du temps scolaire ». Ce n'est pas le cas : elles s'intègrent au temps scolaire.</div>
<h2>Une répartition possible sur l'année</h2>
<p>Cette progression est une proposition à adapter. Elle s'appuie sur les temps forts du programme.</p>
<div class="tbl"><table><thead><tr><th>Période</th><th>Intention</th><th>Durée indicative</th></tr></thead><tbody>
<tr><td>Rentrée</td><td>Cohésion de classe, règles de vie construites ensemble</td><td>2 h</td></tr>
<tr><td>Autour de la Journée Non au harcèlement</td><td>Comprendre le harcèlement, ses mécanismes et le rôle du groupe</td><td>2 h</td></tr>
<tr><td>Hiver</td><td>Émotions, empathie, « rire avec » et « rire sur »</td><td>2 h</td></tr>
<tr><td>Février, Safer Internet Day</td><td>Usages numériques, cyberharcèlement</td><td>2 h</td></tr>
<tr><td>Printemps</td><td>Le témoin qui agit ; à qui parler dans l'établissement</td><td>1 h</td></tr>
<tr><td>Fin d'année</td><td>Bilan avec les élèves</td><td>1 h</td></tr>
</tbody></table></div>
<h2>Des séquences par cycle</h2>
<div class="tbl"><table><thead><tr><th>Cycle</th><th>Parcours disponibles</th></tr></thead><tbody>
<tr><td><b>Cycle 2</b></td><td>Les petits citoyens : jeu Toimoinous · MAE : Maël le roi des bêtises · Milan presse : conte à découvrir</td></tr>
<tr><td><b>Cycle 3</b></td><td>Tralalère : éduquer à l'empathie · Tralalère : Vinz et Lou stoppent la violence · Tralalère : cyberharcèlement · MAE : le jeu de l'oie Non au harcèlement · Les petits citoyens : campagne Non au harcèlement 1er degré</td></tr>
<tr><td><b>Cycle 4</b></td><td>Ministère : l'altérité et l'empathie · Ministère : défaire les dynamiques de groupe</td></tr>
<tr><td><b>Lycée</b></td><td>Pas de parcours dans les ressources actuelles. Les ambassadeurs lycéens peuvent concevoir et animer une partie des séances.</td></tr>
</tbody></table></div>
<p>Les kits « empathie » (volumes 1 à 3) complètent ces parcours. Les ressources de la plateforme pHARe sont accessibles aux personnels de l'Éducation nationale ; dans le réseau AEFE, elles circulent par les formations et les formateurs de zone.</p>`,
tools:["t-10h","t-mallette","t-4pages","t-kits"], links:[["Vidéo","Lutter contre le harcèlement : une illustration concrète en école primaire (CanoTech)","https://www.canotech.fr/a/31385/lutter-contre-le-harcelement-une-illustration-concrete-en-ecole-primaire"],["Source","Éduscol : lutter contre le harcèlement entre élèves",EDU_PHARE]], see:["p2","p5","pi4"]},

p4:{rub:"prevenir", n:"2.7", t:"Comment former et accompagner les élèves ambassadeurs ?", s:"Les ambassadeurs sont des élèves volontaires formés à sensibiliser leurs camarades, à repérer et à alerter un adulte. Ils ne règlent jamais une situation eux-mêmes. Un adulte référent les accompagne toute l'année.", pub:["Vie scolaire","CPE","Équipe ressource","1er degré"], src:"Guide des ambassadeurs pHARe (ministère, 2021)",
body:`
<div class="two">
<div class="box yes"><h3>Un ambassadeur, c'est</h3><ul><li>un élève responsable et à l'écoute ;</li><li>quelqu'un qui sensibilise au respect d'autrui ;</li><li>quelqu'un qui repère les signes et en parle à un adulte ;</li><li>quelqu'un qui convainc la cible d'en parler ;</li><li>un porteur de projet, avec les autres élus.</li></ul></div>
<div class="box no"><h3>Ce n'est pas</h3><ul><li>celui qui règle seul les situations ;</li><li>un justicier ;</li><li>un médiateur ;</li><li>un témoin passif ;</li><li>le chef de ses camarades.</li></ul></div>
</div>
<div class="note"><b>Un écart à corriger</b>Un programme de formation annonçait des ambassadeurs formés à la « médiation ». Le guide ministériel est explicite : un ambassadeur n'est pas un médiateur. Ses missions sont la sensibilisation, le repérage et l'alerte.</div>
<h2>Qui peut devenir ambassadeur ?</h2>
<p>Tout élève volontaire, pas seulement les délégués ou les élus. Le programme prévoit au moins dix élèves au collège et au lycée. Un noyau d'élèves plus âgés (4e, 3e au collège) apporte maturité et connaissance de l'établissement.</p>
<h2>Feuille de route de l'établissement</h2>
<ol class="steps">
<li><b>Septembre</b> : appel à candidatures, désignation d'au moins un adulte référent, accès aux modules de formation pour les référents.</li>
<li><b>Octobre</b> : programmation des temps de formation, communication à la communauté, trombinoscope des ambassadeurs et des référents.</li>
<li><b>Novembre</b> : premier module de formation autour de la Journée Non au harcèlement ; information des parents des ambassadeurs.</li>
<li><b>Toute l'année</b> : réunions régulières, actions, temps forts, bilan.</li>
</ol>
<h2>La formation en trois modules</h2>
<div class="tbl"><table><thead><tr><th>Module</th><th>Contenu</th></tr></thead><tbody>
<tr><td><b>1. L'engagement</b></td><td>Code d'honneur des séances, présentation du programme, faire connaissance, « un ambassadeur, c'est ? »</td></tr>
<tr><td><b>2. Comprendre</b></td><td>Comment ça marche, pourquoi ça marche, conséquences, définitions, relation triangulaire</td></tr>
<tr><td><b>3. Le rôle</b></td><td>Complémentarité avec l'équipe ressource, dépasser les réticences, construire des actions</td></tr>
</tbody></table></div>
<h2>Règles de sécurité</h2>
<ul>
<li>Les ambassadeurs n'interviennent pas dans une situation : le traitement relève exclusivement des adultes.</li>
<li>Pour une action d'information, ils interviennent toujours à plusieurs, si possible devant des plus jeunes, avec un adulte présent.</li>
<li>Ils restent neutres et ne portent pas de jugement sur les élèves impliqués.</li>
<li>Les échanges dans le groupe des ambassadeurs restent confidentiels.</li>
</ul>
<h2>Répondre à leurs réticences</h2>
<div class="tbl"><table><thead><tr><th>Ce qu'ils disent</th><th>Ce qu'on peut leur répondre</th></tr></thead><tbody>
<tr><td>« On va me traiter de balance. »</td><td>« Balance » est un mot mafieux. Un ambassadeur est un lanceur d'alerte dont l'action profite à tous.</td></tr>
<tr><td>« L'auteur est un ami. »</td><td>On ne dénonce pas l'auteur, on signale l'élève qui souffre. Plus les adultes interviennent tôt, moins ils ont besoin de sanctionner.</td></tr>
<tr><td>« Elle ne dit rien, donc elle ne souffre pas. »</td><td>La cible a souvent honte de ne pas se défendre. Rire de son propre surnom est une défense, pas un signe que tout va bien.</td></tr>
<tr><td>« Je ne l'aime pas. »</td><td>On n'est pas obligé d'être ami avec tout le monde. On doit respecter chacun.</td></tr>
<tr><td>« L'auteur est le plus populaire. »</td><td>De quelle popularité parle-t-on ? Celle qui repose sur la peur ne profite à personne.</td></tr>
</tbody></table></div>
<h2>Faire vivre l'engagement</h2>
<p>Actions possibles : événement pour la Journée Non au harcèlement, participation au prix Non au harcèlement, interventions dans la formation des délégués ou auprès des plus jeunes, badge, slogan, campagne d'affichage, carnet d'observations commenté en réunion, trombinoscope, charte annexée au règlement intérieur.</p>
<h2>Au lycée, et au premier degré</h2>
<p><b>Au premier degré</b>, le dispositif officiel des ambassadeurs ne s'applique pas : il concerne le collège et le lycée. On parle plutôt d'élèves acteurs de la prévention. Des délégués de CM1 et de CM2 peuvent être sensibilisés en quatre temps : les mots des émotions, un vrai/faux collectif, un jeu de rôle sur le pouvoir du témoin, puis une charte « Notre classe protège ». <b>Au lycée</b>, les ambassadeurs gagnent en autonomie et peuvent être simplement supervisés.</p>`,
tools:["t-livret-amb","t-pres-amb","t-fiches-amb","t-candidature","t-anim","t-amb1d"], links:[["Source","Ministère : devenir ambassadeur au collège","https://www.education.gouv.fr/non-au-harcelement/devenir-ambassadeur-au-college-323016"],["Vidéo","Lutter contre le harcèlement : une illustration concrète en école primaire (CanoTech)","https://www.canotech.fr/a/31385/lutter-contre-le-harcelement-une-illustration-concrete-en-ecole-primaire"],["Vidéo","« Tous témoins, tous concernés », collège François Rabelais","https://www.youtube.com/watch?v=uhb0miINk-c"],["Vidéo","Des lycéens ambassadeurs contre le harcèlement (CanoTech)","https://www.canotech.fr/a/37416/des-lyceens-ambassadeurs-contre-le-harcelement"]], see:["f4","p5","pi2","co4"]},

p5:{rub:"prevenir", n:"2.8", t:"Comment préparer les temps forts de l'année ?", s:"Trois temps forts rythment le programme : la Journée Non au harcèlement à l'automne, le prix Non au harcèlement au premier trimestre et le Safer Internet Day en février. Ce sont des occasions de mobiliser élèves, personnels et familles.", pub:["Direction","Équipe ressource","Ambassadeurs"], src:"Programme pHARe en 4 pages (2023)",
body:`
<div class="tbl"><table><thead><tr><th>Temps fort</th><th>Quand</th><th>Objet</th></tr></thead><tbody>
<tr><td><b>Journée Non au harcèlement</b></td><td>Le premier jeudi qui suit les vacances d'automne, ou un autre jour choisi par l'établissement</td><td>Sensibiliser et mobiliser toute la communauté</td></tr>
<tr><td><b>Prix Non au harcèlement</b></td><td>Travail collectif au premier trimestre</td><td>Une affiche ou une vidéo réalisée par les élèves, support d'un projet dans l'établissement</td></tr>
<tr><td><b>Safer Internet Day</b></td><td>Février</td><td>Bonnes pratiques numériques, citoyenneté en ligne</td></tr>
</tbody></table></div>
<p>Le nombre de temps forts organisés dans l'année correspond aux niveaux de labellisation : un au niveau 1, deux au niveau 2, trois au niveau 3. Vérifiez chaque année les dates et le règlement du prix sur éduscol.</p>
<h2>Idées d'actions</h2>
<ul>
<li>Diffusion d'un clip réalisé par des élèves suivie d'un échange avec des invités.</li>
<li>Stand ou intervention des ambassadeurs, trombinoscope des personnes ressources.</li>
<li>Campagne d'affichage, badge, slogan ou hashtag de l'établissement.</li>
<li>Jeu de l'oie Non au harcèlement pour les plus jeunes.</li>
<li>Atelier parents-enfants sur les usages numériques pour le Safer Internet Day.</li>
</ul>
<h2>Un exemple de trame d'échange</h2>
<p>Après le clip : une question d'ouverture (« Que vous inspire ce clip ? »), puis des questions sur la définition, les signes, la prévention, le numérique, le rôle des jeunes. Clôture : <span class="quote">« Le courage n'est pas toujours dans les grands gestes. Il est aussi dans un regard bienveillant, une parole de soutien, une main tendue. »</span></p>
<div class="note"><b>Vigilance</b>Un temps fort ne cite jamais une situation réelle de l'établissement ni un élève identifiable.</div>`,
tools:["t-mallette","t-trame-evt"], links:[["Source","Éduscol : prix Non au harcèlement","https://eduscol.education.fr/3544/prix-non-au-harcelement"],["Outil","Internet Sans Crainte : Safer Internet Day","https://www.internetsanscrainte.fr/sid"],["Source","Éduscol : usages responsables d'Internet","https://eduscol.education.fr/3481/ressources-pour-des-usages-responsables-sur-internet"]], see:["p3","p4","co3","pi4"]},


p6:{rub:"prevenir", n:"2.3", t:"Quel rôle pour la vie scolaire dans le climat scolaire ?", s:"La vie scolaire n'est pas seulement un service de surveillance : elle observe les temps invisibles de la classe, régule, suit, accueille et relie les acteurs. Elle est un levier majeur de prévention, de justice scolaire et de repérage précoce.", pub:["Vie scolaire","CPE","Direction","Enseignants"], src:"Projet de service vie scolaire ; Vademecum AED 2026 ; ressources de formation du corpus",
body:`
<h2>Cinq fonctions qui agissent directement sur le climat</h2>
<div class="two">
<div class="box"><h3>Présence éducative</h3><p>Être visible et disponible dans les cours, couloirs, entrées, restauration et temps interstitiels. La qualité de la présence compte autant que la quantité de surveillance.</p></div>
<div class="box"><h3>Justice et régulation</h3><p>Appliquer un cadre cohérent, expliquer les décisions, distinguer conflit, incivilité, violence et harcèlement, éviter la réaction purement punitive.</p></div>
<div class="box"><h3>Repérage et suivi</h3><p>Croiser retards, absences, passages à l'infirmerie, isolement, changements de comportement et incidents discrets.</p></div>
<div class="box"><h3>Transitions et espaces</h3><p>Observer les moments de vulnérabilité : changements de salle, toilettes, files d'attente, cantine, transports, abords de l'établissement.</p></div>
<div class="box"><h3>Participation des élèves</h3><p>Accompagner délégués, CVC/CVL, ambassadeurs, projets de cour et actions de prévention pour renforcer le sentiment d'appartenance.</p></div>
</div>
<h2>Passer d'une vie scolaire « qui gère » à une vie scolaire « qui pilote »</h2>
<ol class="steps"><li><b>Diagnostiquer</b> les lieux, temps et situations qui concentrent les tensions.</li><li><b>Choisir deux priorités</b> : par exemple l'accueil du matin et les intercours.</li><li><b>Harmoniser les postures</b> : phrases, règles, transmission, suivi.</li><li><b>Associer les enseignants</b> : les informations de vie scolaire éclairent la classe, et inversement.</li><li><b>Évaluer</b> : observer si les incidents, retards, exclusions de cours ou ressentis évoluent.</li></ol>
<h2>Le projet de service</h2>
<p>Le projet vie scolaire donne du sens à l'action collective. Il permet de sortir de l'empilement des urgences et de relier l'organisation quotidienne aux priorités de l'établissement : climat, assiduité, engagement, inclusion, prévention et suivi éducatif.</p>
<div class="warn"><b>Point de vigilance</b>Un AED n'enquête pas seul sur une situation de harcèlement et ne conduit pas une médiation entre une cible et un auteur. Il repère, accueille, protège dans son champ de responsabilité et transmet selon le protocole.</div>`,
tools:["t-vie-projet","t-vademecum-aed","t-decrochage","t-cas-aed"], see:["r1","r2","p1","pi6","f2"]},

p7:{rub:"prevenir", n:"2.4", t:"Comment développer les CPS, l'empathie, la coopération et l'appartenance ?", s:"Les compétences psychosociales sont des compétences cognitives, émotionnelles et sociales qui se développent par des apprentissages réguliers et des pratiques quotidiennes. Elles constituent une prévention universelle, bien au-delà des seules séances sur le harcèlement.", pub:["Enseignants","1er degré","Vie scolaire","Formateurs"], src:"Santé publique France 2026 ; Éduscol CPS 2026",
body:`
<h2>Trois grandes familles de compétences</h2>
<div class="three two">
<div class="box"><h3>Cognitives</h3><p>Conscience de soi, pensée critique, choix réfléchis, attention, capacité à résoudre un problème.</p></div>
<div class="box"><h3>Émotionnelles</h3><p>Identifier, comprendre et réguler les émotions ; faire face au stress et aux situations difficiles.</p></div>
<div class="box"><h3>Sociales</h3><p>Communiquer, écouter, coopérer, demander de l'aide, développer des relations constructives.</p></div>
</div>
<h2>Ce qui rend une intervention CPS de qualité</h2>
<ul><li><b>Régularité</b> : quelques minutes souvent valent mieux qu'une journée isolée.</li><li><b>Expérientiel</b> : faire vivre, mettre en mots, rejouer, transférer.</li><li><b>Progressivité</b> : des objectifs adaptés à l'âge et revisités plusieurs fois.</li><li><b>Posture cohérente des adultes</b> : on ne peut pas enseigner l'écoute dans un climat humiliant.</li><li><b>Transfert</b> : relier les séances aux situations de classe, de cour, de groupe et de numérique.</li></ul>
<h2>Au premier degré : l'empathie comme apprentissage</h2>
<p>Les ressources ministérielles proposent des séances d'empathie à l'école maternelle et élémentaire. Elles ne consistent pas à demander aux élèves d'être « gentils » : elles entraînent des compétences précises — identifier une émotion, comprendre un point de vue, communiquer, coopérer et demander de l'aide.</p>
<h2>Au collège et au lycée</h2>
<p>Le développement des CPS se poursuit dans les disciplines, la vie de classe, l'EMC, les projets, la vie scolaire et les instances. Avec l'âge, on travaille davantage la pression du groupe, l'esprit critique, les interactions numériques, la prise de décision et le pouvoir d'agir comme témoin.</p>
<div class="note"><b>Fil rouge de formation</b>Demander aux stagiaires, pour chaque activité, « quelle compétence est réellement entraînée ? », « comment l'élève la réutilisera-t-il ailleurs ? » et « quelle posture adulte la rend crédible ? ».</div>`,
tools:["t-cps-spf","t-cps-eduscol","t-10h","t-bienetre","t-kits"], see:["p2","p8","p3","c5"]},

p8:{rub:"prevenir", n:"2.5", t:"Quelle progression de la maternelle au lycée ?", s:"La prévention conserve les mêmes finalités à tous les âges, mais elle change de langage, de complexité et de responsabilité : ressentir et demander de l'aide, comprendre le groupe, développer l'esprit critique, puis agir et s'engager.", pub:["1er degré","Enseignants","Vie scolaire","Formateurs"], src:"Ressources 10 h du corpus ; kits CPS et empathie ; guides ambassadeurs",
body:`
<div class="tbl"><table><thead><tr><th>Niveau</th><th>Priorités</th><th>Situations et supports</th></tr></thead><tbody>
<tr><td><b>Maternelle</b></td><td>Nommer les émotions, respecter l'autre, coopérer, demander de l'aide, identifier un adulte de confiance.</td><td>Albums, marionnettes, jeux coopératifs, scénettes très simples, météo des émotions.</td></tr>
<tr><td><b>Cycle 2</b></td><td>Distinguer taquinerie et comportement qui blesse, exprimer un désaccord, aider un camarade, alerter.</td><td>Jeux, dessins, situations courtes, messages clairs, activités d'empathie.</td></tr>
<tr><td><b>Cycle 3</b></td><td>Comprendre la répétition, le rôle du groupe et du témoin, commencer l'éducation au numérique.</td><td>Vrai/faux, cartes-situations, débats, jeux de rôle, premiers scénarios cyber.</td></tr>
<tr><td><b>Cycle 4</b></td><td>Pression du groupe, exclusions, discriminations, cyberharcèlement, esprit critique, signalement.</td><td>Études de cas, théâtre forum, analyses de messages, projets de prévention.</td></tr>
<tr><td><b>Lycée</b></td><td>Relations complexes, réputation numérique, violences discriminatoires, engagement, autonomie responsable.</td><td>Débats argumentés, cas complexes, CVL, campagnes, tutorat ou interventions vers les plus jeunes.</td></tr>
</tbody></table></div>
<h2>Trois principes de continuité</h2>
<ul><li><b>Un même langage</b> pour les adultes : sécurité, respect, répétition, déséquilibre, témoin, demande d'aide.</li><li><b>Une complexité croissante</b> : on part du vécu concret avant d'aborder les mécanismes sociaux et numériques.</li><li><b>Une responsabilité croissante</b> : l'élève apprend d'abord à demander de l'aide, puis à soutenir, alerter, participer et construire des actions.</li></ul>
<div class="warn"><b>Ne pas projeter les problématiques des adolescents sur les plus jeunes</b>Au primaire, on privilégie les émotions, les relations, le respect et la demande d'aide. Les scénarios trop explicites ou anxiogènes n'améliorent pas la prévention.</div>`,
tools:["t-cps-eduscol","t-10h","t-amb1d","t-livret-amb","t-kits"], see:["p7","p3","p4","f1"]},

// ===== 3. REPÉRER =====
r1:{rub:"reperer", n:"3.1", t:"Comment repérer les signaux faibles ?", s:"Un signal isolé ne prouve rien. Plusieurs signaux qui s'installent, chez un élève ou dans un groupe, justifient d'en parler à l'équipe. Mieux vaut transmettre une inquiétude que d'attendre une certitude.", pub:["Tous"], src:"Guide des ambassadeurs pHARe ; supports de formation pHARe (signaux faibles)",
body:`
<h2>Chez l'élève</h2>
<div class="two">
<div class="box"><h3>Comportement</h3><ul><li>Repli, isolement, mange seul</li><li>Changement brusque : agressivité, irritabilité</li><li>Recherche la proximité des adultes</li><li>Arrive en retard, part en dernier</li></ul></div>
<div class="box"><h3>Scolarité</h3><ul><li>Baisse des résultats</li><li>Ne lève plus la main, refuse de passer au tableau</li><li>Absences répétées, surtout certains jours</li><li>Demandes répétées d'aller à l'infirmerie</li></ul></div>
<div class="box"><h3>Corps et émotions</h3><ul><li>Maux de ventre, de tête avant un cours</li><li>Fatigue, troubles du sommeil signalés</li><li>Anxiété, larmes, nervosité entre les cours</li></ul></div>
<div class="box"><h3>Affaires et lieux</h3><ul><li>Affaires perdues, cachées, dégradées</li><li>Évite la cour, les couloirs, les toilettes, la cantine</li><li>Change d'itinéraire, s'inscrit à une activité « pour avoir la paix »</li></ul></div>
</div>
<h2>Dans le groupe</h2>
<ul>
<li>Rires collectifs quand un élève prend la parole, imitations.</li>
<li>Toujours le même élève choisi en dernier ou laissé seul.</li>
<li>Surnoms qui circulent, chuchotements, regards.</li>
<li>Un élève exclu des groupes de discussion de la classe.</li>
</ul>
<h2>Ce que ces signaux ne disent pas</h2>
<p>Ils ne disent ni qui est responsable ni ce qui se passe exactement. Ils disent qu'un élève ne va pas bien. La suite consiste à <a href="#r2">croiser les regards</a> et à transmettre, pas à enquêter seul.</p>
<div class="note"><b>Une cible peut faire semblant</b>Beaucoup d'élèves harcelés disent que tout va bien, rient avec le groupe ou minimisent. Ce n'est pas un signe d'absence de souffrance.</div>`,
tools:["t-reperage","t-harcelometre","t-atelier-dgesco","t-violento"], see:["r2","c2","urgence"]},

r2:{rub:"reperer", n:"3.2", t:"Comment croiser les regards entre adultes ?", s:"Chaque adulte ne voit qu'une partie de la journée d'un élève. C'est en croisant les observations, notées de façon factuelle et transmises à une seule personne, qu'une impression devient une information utile.", pub:["Enseignants","Vie scolaire","Équipe ressource"], src:"Protocole national 2023 (trace écrite) ; supports de formation pHARe",
body:`
<h2>Qui observe quoi</h2>
<div class="tbl"><table><thead><tr><th>Qui</th><th>Ce qu'il voit en particulier</th></tr></thead><tbody>
<tr><td>Enseignants</td><td>La classe, la prise de parole, les travaux de groupe, les résultats</td></tr>
<tr><td>Vie scolaire, assistants d'éducation</td><td>La cour, les couloirs, les absences, les retards, les temps libres</td></tr>
<tr><td>Personnels de santé</td><td>Les passages répétés, les plaintes somatiques</td></tr>
<tr><td>Personnels de cantine et d'entretien</td><td>La cantine, les toilettes, les lieux peu surveillés</td></tr>
<tr><td>Accompagnants d'élèves en situation de handicap</td><td>Les interactions au plus près d'un élève</td></tr>
<tr><td>Ambassadeurs</td><td>Ce qui échappe aux adultes ; ils alertent un adulte référent</td></tr>
<tr><td>Familles</td><td>Le soir, le sommeil, le téléphone, l'envie d'aller à l'école</td></tr>
</tbody></table></div>
<h2>Comment noter</h2>
<ul>
<li>Des faits observables, datés, situés : « mardi, cantine, mange seul, deux élèves ont déplacé leur plateau ».</li>
<li>Pas d'interprétation ni de jugement sur les élèves.</li>
<li>Transmettre à une seule personne, désignée par le protocole : en général le coordonnateur de l'équipe ressource.</li>
</ul>
<h2>Confidentialité : partager ce qui est utile</h2>
<p>L'élève ne veut pas devenir le sujet de toutes les conversations. Avant de partager une information, posez-vous trois questions : qu'est-il utile de dire, à qui, et dans quel but ? L'équipe informe l'ensemble des personnels pour renforcer la vigilance, sans stigmatiser l'élève.</p>`,
tools:["t-reperage"], see:["r1","g2","pi2"]},

r3:{rub:"reperer", n:"3.3", t:"Comment diagnostiquer le climat de l'établissement ?", s:"Mesurer avant d'agir : une enquête anonyme auprès des élèves, des parents et des personnels objective les ressentis et fait apparaître les priorités. Le réseau AEFE propose des questionnaires prêts à l'emploi (ELCS).", pub:["Direction","Équipe ressource"], src:"Questionnaires AEFE ELCS ; Éduscol climat scolaire 2026 ; annonce Climat scolaire 360",
body:`
<h2>Les questionnaires AEFE (ELCS)</h2>
<p>Les liens ci-dessous ouvrent les versions de test des questionnaires. On peut changer de langue en cours de questionnaire.</p>
<div class="tbl"><table><thead><tr><th></th><th>Élèves</th><th>Parents</th><th>Personnels</th></tr></thead><tbody>
<tr><td><b>École</b></td><td><a href="${ELCS(2501)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2507)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2504)}" target="_blank" rel="noopener">Questionnaire</a></td></tr>
<tr><td><b>Collège</b></td><td><a href="${ELCS(2502)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2508)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2505)}" target="_blank" rel="noopener">Questionnaire</a></td></tr>
<tr><td><b>Lycée</b></td><td><a href="${ELCS(2503)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2509)}" target="_blank" rel="noopener">Questionnaire</a></td><td><a href="${ELCS(2506)}" target="_blank" rel="noopener">Questionnaire</a></td></tr>
</tbody></table></div>
<h2>ELCS et Climat scolaire 360 : deux logiques complémentaires</h2>
<div class="tbl"><table><thead><tr><th>Outil</th><th>Ce qu'il apporte</th><th>Vigilance</th></tr></thead><tbody>
<tr><td><b>ELCS</b></td><td>Des questionnaires locaux permettant de comparer les perceptions des élèves, parents et personnels, avec des versions adaptées aux niveaux.</td><td>Préparer la passation, garantir la confidentialité et organiser une restitution qui débouche sur des décisions.</td></tr>
<tr><td><b>Climat scolaire 360</b></td><td>Le ministère annonce à partir de l'automne 2026 un outil de diagnostic autonome associant l'ensemble de la communauté éducative.</td><td>Dans le réseau AEFE, vérifier les conditions d'accès et ne pas remplacer l'analyse locale par le seul outil numérique.</td></tr>
</tbody></table></div>
<p>Dans tous les cas, le diagnostic gagne à croiser questionnaires, observations des espaces et des temps, incidents, absentéisme, exclusions de cours, parole des élèves, des familles et des personnels.</p>
<h2>Une démarche en six étapes</h2>
<ol class="steps"><li><b>Préparer</b> : objectifs, calendrier, information des publics.</li><li><b>Interroger</b> : élèves, parents, personnels.</li><li><b>Analyser</b> : convergences, écarts entre publics, points d'appui, vulnérabilités.</li><li><b>Prioriser</b> : deux ou trois leviers, pas quinze actions.</li><li><b>Agir</b> : responsables, calendrier, indicateurs.</li><li><b>Réévaluer</b> : nouvelle mesure un à deux ans plus tard.</li></ol>
<div class="warn"><b>Se méfier de la moyenne</b>Une moyenne globale peut masquer des écarts importants selon les publics, les niveaux, les lieux ou les moments de la journée. Regardez toujours les résultats par public et par question.</div>
<h2>Croiser quatre sources</h2>
<p>Un questionnaire ne suffit pas. Le diagnostic croise :</p>
<ul><li><b>des données</b> : absences, retards, punitions et sanctions, incidents, passages à l'infirmerie ;</li><li><b>des perceptions</b> : ELCS, questionnaires, groupes de parole ;</li><li><b>des espaces et des temps</b> : une carte des lieux et moments sensibles ;</li><li><b>des pratiques</b> : la cohérence des réponses des adultes, la qualité des relations.</li></ul>
<h2>Conditions de réussite</h2>
<ul>
<li>Hors période de crise, sur la base d'un engagement de l'équipe.</li>
<li>Présentation préalable aux personnels et aux élèves, accord des familles selon les règles en vigueur dans l'établissement et le pays.</li>
<li>Les résultats appartiennent à l'établissement et ne servent qu'à un usage local.</li>
<li>Une restitution organisée, qui débouche sur des priorités d'action.</li>
</ul>
<p>Le simple fait de conduire une enquête contribue à améliorer le climat : les conditions de mise en œuvre d'une démarche comptent au moins autant que la démarche elle-même.</p>
<h2>Analyser une situation de climat : la grille en 7 axes</h2>
